<title>Where2Hang — Corniche miniature</title>
<!--
  PASTE TARGET: where2hang-hero-lab/home-world.html

  WHAT THIS IS, AND WHAT IT IS FOR.
  A bounded proof of concept for the miniature world. It does not touch home-stage.html, which
  remains the control. The question this file exists to answer is narrow:

      does a 10-15 degree camera ORBIT around a small model make you feel you are
      peering around a living place?

  Nothing else. Not whether Abu Dhabi can be modelled, not whether this is shippable. If the
  parallax is not immediately obvious in the hand, without anyone pointing at it, this direction
  is wrong and the photographic hero stays.

  WHY A MODEL AND NOT A PHOTOGRAPH.
  Hero-pano-night.webp is shot from across the water. Every tower on it stands on a near-straight
  shoreline kilometres away. Parallax scales with baseline over distance, so at a phone-scale
  viewpoint change two towers at 2km and 4km displace by a fraction of a pixel relative to each
  other. There is no depth in that image to recover, which is why perspective yaw, DEPTH_PX and
  depth-map displacement all fail on it. The fix is not a better technique. It is a near field.

  WHY AN ORBIT AND NOT A TURN.
  Standing at the centre and turning is a ROTATION, and rotation produces no parallax at all —
  near and far move together. That is exactly what the panorama does, and a centre-mounted camera
  in a real 3D scene would fail the same way with better lighting. The camera must TRANSLATE.
  Here it moves along a shallow arc while continuously aiming at a fixed focal point.

  THE DEPTH RATIO IS THE WHOLE TRICK.
  Palms and jetty sit about 140m from the camera. The towers are about 1.5km away. Roughly 10:1,
  so a small orbit swings the foreground hard across a nearly static skyline. That ratio is the
  measurement that matters — if the effect is weak, move the foreground closer before touching
  the orbit angle.

  SCALE: 1 unit = 10 metres throughout.

  ZERO COST BY CONSTRUCTION. All geometry is defined in code. No API, no licensing, no binary
  assets, nothing to host. Landmarks are recognised by silhouette, proportion and relative
  placement, not by surface detail — which is how games have made cities legible for decades.

  ---------------------------------------------------------------------------------------------
  RENDER PASS — "it looks blocky, like design from four years ago".

  Fair, and none of it was a modelling problem. 41k triangles at 118fps means roughly 8ms of
  headroom going unspent every frame. Four rendering faults, in order of how much each mattered:

  1. NO BLOOM. A night city is defined by light bleeding past the surface that emits it. Every
     lit window here stopped dead at its own polygon edge, so the towers read as coloured
     rectangles rather than as buildings with lights on. This is the change you notice first.

  2. MSAA WAS REQUESTED BUT NEVER APPLIED. antialias:true only affects the default framebuffer.
     Nothing here drew to it once anything else was in play, so every tower edge was stepped.
     SMAA at the end of the chain does the job properly.

  3. NO ANISOTROPIC FILTERING ANYWHERE. Window textures on distant towers and the reflection
     band on the bay were both being minified at steep angles with anisotropy at its default
     of 1. That is the wire-wool on the far rows and part of the smear on the water.

  4. THE REFLECTION BAND WAS STRETCHED AND THEN CUT. repeat was (5, 1) — one texture tile down
     260 units of depth — so each streak was smeared the length of the bay. And it sat at
     y=0.05 while the wave displacement reaches 0.49, so the water rose through it across most
     of the surface and chopped it into dark blotches. Both fixed at the same place.

  The near field is also lifted off zero. It was set near-black deliberately in an earlier pass,
  after being far too bright, but 0.055 overshot: an occluder that cannot be seen does not sell
  depth, it just removes picture. FG_EMISSIVE is now a named dial with the history written down.

  Nothing about the camera, the tilt sensor, the orbit or the district layout is touched.
-->

<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<script type="module">
// Static imports at the top level, above everything. A whole-module try{} wrapped around these
// is a parse-time SyntaxError and the module never runs. Spec v3 section 5b.
import * as THREE from 'three';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass }         from 'three/addons/postprocessing/SMAAPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { Reflector }        from 'three/addons/objects/Reflector.js';
import { mountTilt } from './tilt-absolute.js?v=55';

const __dbg  = document.getElementById('dbg');
const __fail = document.getElementById('fail');
function fail(where, e){
  __fail.classList.add('on');
  __fail.textContent = 'FAILED @ ' + where + '\n' + (e && e.message ? e.message : String(e))
    + '\n\n' + ((e && e.stack) ? e.stack : '');
}

try {

const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG  = location.hash.indexOf('debug') >= 0;
if (DEBUG) __dbg.classList.add('on');

/* ===========================================================================
   CAMERA CONSTANTS — the only numbers worth tuning first.

   ORBIT_DEG   half-angle of the arc the camera sweeps. 12 is the working default; the chips
               switch it live so it can be judged in the hand rather than argued about.
   ELEV_DEG    vertical travel. Deliberately small. Pitching a miniature reads as tipping the
               table, which breaks the illusion faster than too little movement does.
   ORBIT_R     horizontal distance from camera to focal point, in units of 10m. 150 = 1.5km.
   CAM_Y       camera height. 20 = 200m. Low enough that the foreground palms sit against the
               skyline rather than being looked down upon — that overlap IS the occlusion cue.
   TARGET      the focal point the camera keeps aiming at through the whole orbit.
   TAU         damping. Matches the hero so the two feel like the same product.
   =========================================================================== */
let   ORBIT_DEG = 12;
const ELEV_DEG  = 4.5;
const ORBIT_R   = 330;
const CAM_Y     = 30;
const TARGET    = new THREE.Vector3(0, 14, -10);
const FOV       = 55;

/* FRAMING. THE HORIZONTAL FIELD IS THE BINDING CONSTRAINT, NOT THE VERTICAL.
   A phone in portrait is about 0.45 wide for every 1 tall. Vertical FOV therefore buys almost
   nothing horizontally: at 42deg vertical the horizontal field was 19deg, plus or minus 9.5deg
   from centre. The district spanned x from -300 to +300 at 100 to 350 units out — plus or minus
   60deg — so over three quarters of the city was off screen at all times and Emirates Palace at
   x=-72 sat at -40deg, permanently outside the frame. The composition was never once visible.

   The fix is distance plus a wider lens plus lateral compression, all three:
     ORBIT_R 330   at this range a district of +/-77 units fits the horizontal field
     FOV 55        horizontal half-angle becomes atan(tan(27.5) * 0.45) = 13.2deg
     x in [-80,80] everything is authored inside that envelope

   Vertical: camera (0, 30, 320) aiming at y=14 pitches down 2.8deg, so the visible band runs
   -30deg to +25deg. The near field sits at 90 to 120 units, which puts it near -21deg — inside
   the frame, and close enough that a 12deg orbit sweeps it about 25deg against the skyline.
   CHECK BOTH AXES BEFORE PLACING ANYTHING. The horizontal one is the one that bites. */
const TAU       = 0.24;

/* Palette. Straight from the app tokens — no purple, no neon, no Vegas. */
const C = {
  night:   0x0B1620,   // sky and clear colour
  // AERIAL PERSPECTIVE. Fog was the same cold navy as the sky, so distance read as "darker"
  // rather than "further" — everything receded toward black and the far skyline simply
  // disappeared instead of dissolving. This is warmer and lighter than the sky, which is what
  // a real city's night haze looks like: sodium and dust glowing above the horizon under a
  // cold sky. Far towers now lose contrast INTO a warm band rather than into the background,
  // and that difference is the single strongest depth cue available for free.
  haze:    0x241D15,
  mass:    0x151A1F,   // building masses, barely above the page background
  masswarm:0x241E17,   // Emirates Palace stone, warm against the cool city
  gold:    0xE8B547,
  teal:    0x00C2A8,
  water:   0x0A141B,
};

/* ---------- renderer ---------- */
const canvas = document.getElementById('gl');
// antialias:false is REQUIRED, not a preference. Once the scene renders into the composer's
// render target, the canvas MSAA buffer is never drawn to — so it costs memory and bandwidth
// and delivers nothing. SMAA at the end of the chain does the work instead.
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

/* SHADOWS. The single fix for the floating-foreground problem, addressed at the cause rather
   than by lifting emissive until the shapes stop looking wrong. An object with a shadow is
   standing on something; an object without one is hovering over a texture, and no amount of
   material tuning talks the eye out of that.
   PCFSoft rather than VSM: cheaper, and it does not need per-object tuning to avoid light
   bleeding through thin geometry like palm fronds. */
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.night);
// Aerial perspective. This is what makes a small model read as a large city: distant masses
// lose contrast and dissolve into the sky, exactly as haze does over a bay.
// At 0.0042 over 360 units this erased about 90% of the far city — there was no skyline left
// behind the heroes. Distances roughly doubled with the pull-back, so the coefficient halves.
scene.fog = new THREE.FogExp2(C.haze, 0.0019);

const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 3000);

/* ===========================================================================
   POST-PROCESSING. The single largest visual change in this build.

   The blockiness was never a geometry budget problem — 41k triangles at 118fps leaves roughly
   8ms of headroom per frame. It was that a night city was being rendered without the two things
   that make a night city look like one:

   BLOOM      lit windows were flat coloured pixels, not light sources. Nothing bled. Every
              emissive surface stopped exactly at its own polygon edge, which is the single
              strongest tell that an image was rendered rather than photographed.
   SMAA       hard stair-stepped tower edges against a flat sky. MSAA was requested on the
              renderer but it only ever applied to the default framebuffer.

   THRESHOLD IS THE DIAL THAT MATTERS, and the instinct to lower it toward zero is wrong: that
   blooms the sky and the building faces too and the result is grey haze. If something should
   glow and does not, raise ITS emissive intensity above the threshold instead.
   =========================================================================== */
const POST = {
  strength:  0.62,   // overall glow intensity
  radius:    0.55,   // how far it spreads
  threshold: 0.48,   // luminance above which a pixel blooms
  smaa:      true,
};

const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  POST.strength, POST.radius, POST.threshold
);
composer.addPass(bloomPass);

/* TILT-SHIFT. The strongest miniature cue there is, and the cheapest to run.
   Human vision has effectively infinite depth of field at city scale, so a frame where a
   narrow band is sharp and everything else is soft cannot be a real city — the brain concludes
   the subject must be SMALL and CLOSE. Every "tiny planet" photograph runs on this one effect.
   Without it a night skyline reads as a skyline; with it, the same geometry reads as a model
   on a table, which is the entire premise of this hero.

   Blur is driven by distance from a horizontal band, NOT by real depth. That is a cheat and it
   is the correct one: true depth-of-field needs the depth buffer and a circle-of-confusion
   solve, costs several times as much, and looks near-identical on a scene whose subject
   already sits in a band across the middle of the frame. */
const TiltShift = {
  uniforms: {
    tDiffuse: { value: null },
    amount:   { value: 1.0 },
    focus:    { value: 0.44 },
    aperture: { value: 0.15 },
    strength: { value: 0.0024 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float amount, focus, aperture, strength;
    varying vec2 vUv;
    void main(){
      float d = max(abs(vUv.y - focus) - aperture, 0.0);
      float blur = smoothstep(0.0, 0.34, d) * strength * amount;
      // Nine taps. Below about seven the falloff bands visibly on a gradient sky.
      vec4 c = texture2D(tDiffuse, vUv) * 0.226;
      c += texture2D(tDiffuse, vUv + vec2( blur*1.0,  blur*0.4)) * 0.129;
      c += texture2D(tDiffuse, vUv + vec2(-blur*1.0, -blur*0.4)) * 0.129;
      c += texture2D(tDiffuse, vUv + vec2( blur*0.4, -blur*1.0)) * 0.117;
      c += texture2D(tDiffuse, vUv + vec2(-blur*0.4,  blur*1.0)) * 0.117;
      c += texture2D(tDiffuse, vUv + vec2( blur*2.0,  blur*0.8)) * 0.071;
      c += texture2D(tDiffuse, vUv + vec2(-blur*2.0, -blur*0.8)) * 0.071;
      c += texture2D(tDiffuse, vUv + vec2( blur*0.8, -blur*2.0)) * 0.070;
      c += texture2D(tDiffuse, vUv + vec2(-blur*0.8,  blur*2.0)) * 0.070;
      gl_FragColor = c;
    }`
};
const tiltPass = new ShaderPass(TiltShift);
composer.addPass(tiltPass);

// Tone maps and converts to display colour space. The renderer's own toneMapping and
// toneMappingExposure settings above are what it reads, so those stay exactly as they were.
composer.addPass(new OutputPass());

// Anti-alias LAST, on the final low-dynamic-range image. Before the OutputPass it would be
// working on linear HDR values and the edge detection misjudges them.
// SMAAPass in 0.169 REQUIRES width and height in the constructor — it builds its render targets
// there. Calling it bare creates targets of undefined size and the pass silently produces
// nothing. Later versions made the arguments optional; this one did not.
const smaaPass = POST.smaa
  ? new SMAAPass(window.innerWidth * renderer.getPixelRatio(),
                 window.innerHeight * renderer.getPixelRatio())
  : null;
if (smaaPass) composer.addPass(smaaPass);

// renderer.info RESETS ON EVERY render() CALL, and the composer makes several per frame. Left
// on auto, the debug overlay reports only the last pass — a single fullscreen triangle — so
// tris and calls both read 1 and the scene statistics vanish exactly when post-processing makes
// them worth watching. Reset manually once per frame instead and the counts accumulate across
// the whole chain. The passes add a handful of calls; the rest is genuinely the city.
renderer.info.autoReset = false;

/* ---------- environment: what the water reflects ----------
   The Gulf at night is not lit, it REFLECTS. A flat plane with an upward normal returns almost
   nothing from a directional light placed behind the city, which is why the bay rendered black
   however the material was tuned. Give the scene a sky to reflect and the water appears by
   itself — and the same environment puts a soft sheen on every glass face in the district.
   A 64px gradient is plenty: it is only ever seen blurred in a reflection. */
function skyEnvTexture(){
  const cv = document.createElement('canvas');
  cv.width = 32; cv.height = 128;
  const g = cv.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 128);
  grd.addColorStop(0.00, '#04080C');   // zenith, deep navy
  grd.addColorStop(0.40, '#0B1A24');
  grd.addColorStop(0.485,'#1E333E');   // the pale band just above the horizon
  grd.addColorStop(0.515,'#2A2317');   // warm city glow just below it
  grd.addColorStop(0.70, '#080D12');
  grd.addColorStop(1.00, '#03060A');
  g.fillStyle = grd; g.fillRect(0, 0, 32, 128);
  const t = new THREE.CanvasTexture(cv);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromEquirectangular(skyEnvTexture()).texture;
scene.environment = envMap;

/* ---------- lighting ----------
   Restrained. The city is lit mostly by its own windows; the lights here only shape the masses
   so silhouettes stay readable against the haze. */
scene.add(new THREE.HemisphereLight(0x16303d, 0x04070a, 0.55));

// Placed low and beyond the city so its mirror image falls between the shore and the camera:
// on a rippled surface that scatters into a glitter path rather than a single highlight.
// Intensity cut from 0.75 with the water roughness change. This costs nothing on the buildings'
// lit windows — those are EMISSIVE and ignore scene lighting entirely — so the only thing it
// touches is the specular sheet on the bay, which is exactly the thing that was blowing out.
const moon = new THREE.DirectionalLight(0xA8C8DA, 0.55);
moon.position.set(-130, 46, -190);
/* THE SHADOW FRUSTUM MUST WRAP THE SCENE AND NOTHING MORE. Every unit of frustum spends
   shadow-map texels, so an oversized box puts most of its resolution on empty sea and returns
   blocky, stair-stepped shadow edges that read as cheap. This box covers the district and the
   near shore and stops. 2048 over ~700 units is roughly 3.4m per texel — coarse for a hard
   edge, ample for the soft contact darkening that is all this needs to do. */
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.near = 20;
moon.shadow.camera.far  = 900;
moon.shadow.camera.left = -260; moon.shadow.camera.right =  260;
moon.shadow.camera.top  =  320; moon.shadow.camera.bottom = -320;
moon.shadow.bias = -0.0007;
moon.shadow.normalBias = 0.5;   // stops self-shadow acne on the curved towers
scene.add(moon);

// DAY SUN. Off at night. High and to the east so the towers throw their long faces toward the
// camera and the massing reads: a light straight down the view axis flattens everything, which
// is the mistake that makes daylight tests useless.
const sun = new THREE.DirectionalLight(0xFFF3E2, 2.0);
sun.position.set(90, 120, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 20;
sun.shadow.camera.far  = 900;
sun.shadow.camera.left = -260; sun.shadow.camera.right =  260;
sun.shadow.camera.top  =  320; sun.shadow.camera.bottom = -320;
sun.shadow.bias = -0.0007;
sun.shadow.normalBias = 0.5;
sun.visible = false;
scene.add(sun);

const daySky = new THREE.HemisphereLight(0xBBD6E8, 0x6E6455, 1.35);
daySky.visible = false;
scene.add(daySky);
// One teal rim from the seaward side. Used sparingly — it is the brand colour, not a wash.
const rim = new THREE.DirectionalLight(C.teal, 0.30);
rim.position.set(120, 26, 130);
scene.add(rim);

/* ---------- window texture ----------
   Lit windows are what make a dark mass read as inhabited. Generated on a canvas so there is no
   asset to ship. Density varies by building class: towers are sparse and vertical, low blocks
   are denser and warmer. */
// Queried once. On the Fold this returns 16; it is free on any GPU made this decade and it is
// specifically the fix for texture smearing at grazing angles.
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

function windowTexture(cols, rows, litChance, warm){
  const cv = document.createElement('canvas');
  cv.width = cols * 4; cv.height = rows * 4;
  const g = cv.getContext('2d');
  g.fillStyle = '#05080b'; g.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < rows; y++){
    for (let x = 0; x < cols; x++){
      if (Math.random() > litChance) continue;
      const a = 0.45 + Math.random() * 0.55;
      g.fillStyle = warm
        ? 'rgba(232,181,71,' + a.toFixed(2) + ')'
        : 'rgba(214,226,232,' + (a * 0.82).toFixed(2) + ')';
      g.fillRect(x * 4 + 1, y * 4 + 1, 2, 2.5);
    }
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.LinearFilter;
  // A tower face seen from 1.5km is minified hard and viewed at an angle. Without anisotropic
  // filtering the GPU takes one texel per pixel from a mip chain chosen for the WORST axis, so
  // window rows smear along the steep direction. This is the wire-wool aliasing the comment
  // above fought with tile counts; tile counts were only half of it.
  t.anisotropy = MAX_ANISO;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  return t;
}
// Sparser and dimmer. At 0.34/0.42 every tower glittered evenly and read as scribble rather
// than as a lit building; a night skyline is mostly dark with pockets of light.
const TEX_TOWER = windowTexture(14, 46, 0.17, false);
const TEX_BLOCK = windowTexture(18, 14, 0.22, true);

// repX/repY are TILE COUNTS, and getting them wrong is not a cosmetic error. The first pass
// used h/1.5, putting roughly 1,150 window rows on a 380m tower: far below one pixel per row at
// this distance, so every building aliased into wire wool. One texture row is 46 windows, a
// floor is about 4m, so a tower of h units wants about h/16 tiles.
// Cached. Every building was cloning its own texture and material, which took draw calls from
// 44 to 240. Repeats are quantised so near-identical buildings share one material.
const matCache = new Map();
function cityMaterial(tex, repX, repY, emissive, colour){
  const key = (tex === TEX_TOWER ? 'T' : 'B') + repX + '_' + repY + '_' +
              emissive.toFixed(2) + '_' + (colour === undefined ? 'd' : colour);
  const hit = matCache.get(key);
  if (hit) return hit;
  // clone() copies filter settings, but set them explicitly: a clone that loses anisotropy is a
  // silent regression that only shows up as smeared windows on the far rows.
  const t = tex.clone();
  t.anisotropy = MAX_ANISO;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.needsUpdate = true; t.repeat.set(repX, repY);
  const m = new THREE.MeshStandardMaterial({
    color: colour === undefined ? C.mass : colour,
    roughness: 0.72, metalness: 0.14,
    emissive: 0xffffff, emissiveMap: t, emissiveIntensity: emissive,
  });
  matCache.set(key, m);
  return m;
}

const world = new THREE.Group();
scene.add(world);

/* ===========================================================================
   LANDMARKS — SILHOUETTE FIRST.

   Brief, taken literally: converted to flat black, this must still read as Abu Dhabi. So the
   effort here goes into PROFILE, not surface. The first pass built everything from the same
   tapered cylinder, which is why it read as a generic dark city — five identical primitives
   cannot carry recognition however well they are lit.

   Tap SILHOUETTE to test exactly that: every material flattens to black against a pale sky.
   If a landmark is not recognisable in that mode, no amount of lighting in build two saves it.

   Real heights in metres are noted; divide by 10 for units. Proportions are compressed
   deliberately — curate, do not model.
   =========================================================================== */

/* A tower whose profile CURVES. Etihad Towers lean and swell and are cut off at a slant at the
   crown; that diagonal top edge is the single most recognisable thing about them, and a flat
   cap throws it away. Built by displacing the vertices of a cylinder:
     swell  — radius bulge through the middle of the rise
     lean   — lateral drift, weighted to the top so the tower curves rather than tilts
     shear  — the slanted crown, applied only near the top so the base stays plumb
     ell    — elliptical footprint                                                            */
function curvedTower(h, rBot, rTop, swell, lean, shear, ell, segs){
  const g = new THREE.CylinderGeometry(rTop, rBot, h, segs || 26, 16, false);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++){
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    // CLAMPED, and the clamp is load-bearing. Vertex positions are Float32; for a height whose
    // half is not exactly representable (27.7 -> 13.85) the bottom cap lands a few ten-millionths
    // BELOW -h/2, so t comes out very slightly negative. Math.pow(negative, 1.7) is NaN, that NaN
    // writes straight into the position buffer, and three then throws on computeBoundingSphere.
    // Silent for the old heights (30, 33, 28 — halves exact) and triggered the moment the real
    // Etihad ratios went in. Clamping costs nothing and removes a whole class of edge case.
    const t = Math.min(1, Math.max(0, (y + h/2) / h));   // 0 at base, 1 at crown
    const k = 1 + swell * Math.sin(Math.PI * t);
    x *= k; z *= k * ell;
    x += lean * Math.pow(t, 1.7);
    y += shear * (x / Math.max(rBot, 0.001)) * Math.pow(t, 7);
    pos.setXYZ(i, x, y, z);
  }
  g.computeVertexNormals();
  return g;
}

/* A rounded-corner slab. ADNOC HQ is not a box and not a cylinder — it is a broad rectangle with
   softened corners and a curved crown, and that in-between quality is what identifies it. */
function roundedSlab(w, d, h, r, seg){
  const sh = new THREE.Shape();
  const hw = w/2 - r, hd = d/2 - r;
  sh.moveTo(-hw, -d/2);
  sh.lineTo(hw, -d/2);  sh.quadraticCurveTo(w/2, -d/2, w/2, -hd);
  sh.lineTo(w/2, hd);   sh.quadraticCurveTo(w/2, d/2, hw, d/2);
  sh.lineTo(-hw, d/2);  sh.quadraticCurveTo(-w/2, d/2, -w/2, hd);
  sh.lineTo(-w/2, -hd); sh.quadraticCurveTo(-w/2, -d/2, -hw, -d/2);
  const g = new THREE.ExtrudeGeometry(sh, { depth:h, bevelEnabled:false, curveSegments: seg || 6 });
  g.rotateX(-Math.PI/2);
  g.computeVertexNormals();
  return g;
}

/* ETIHAD TOWERS — five curved towers, unequal heights, all leaning the same way with slanted
   crowns. Real: 277, 305, 260, 234, 218 m, and those exact ratios are used below because the
   descending stagger from the second tower is the thing people actually remember.

   SPACING IS THE WHOLE PROBLEM. The previous cluster used 5.5-6.5 units between centres against
   bodies about 5.3 wide, leaving barely a unit of sky between neighbours — so at 1.5km they
   fused into a single textured mass and the count was unreadable. You cannot recognise Etihad
   Towers without counting five, which means the GAPS carry as much identity as the profiles.
   Centres now sit 7.5-8.5 apart on slimmer bodies, giving roughly 4 units of visible sky
   between each pair. Also flattened the depth scatter: the real towers stand on a gentle arc,
   and randomised z was making near ones eclipse far ones from half the orbit. */
function etihadTowers(x0, z0){
  const g = new THREE.Group();
  const spec = [
    { dx:-17.0, dz: 3.0, h:27.7, r:1.95, lean: 0.9, shear: 1.1 },
    { dx: -8.5, dz: 0.8, h:30.5, r:2.05, lean: 1.0, shear: 1.3 },
    { dx:  0.0, dz: 0.0, h:26.0, r:1.90, lean: 0.8, shear: 1.0 },
    { dx:  8.0, dz: 0.8, h:23.4, r:1.80, lean: 0.7, shear: 0.9 },
    { dx: 15.5, dz: 3.0, h:21.8, r:1.72, lean: 0.6, shear: 0.8 },
  ];
  spec.forEach((s, i) => {
    // rTop at 0.42 of the base turned these into obelisks. The real towers barely narrow —
    // they are broad curved slabs, and the width is as much of the signature as the lean.
    const geo = curvedTower(s.h, s.r, s.r * 0.74, 0.16, s.lean, s.shear, 0.62, 26);
    // MATERIAL IDENTITY. Every landmark previously shared one near-black mass tone, so the only
    // thing separating them was outline. Etihad is blue-green curtain glass and now reads that
    // way — cool and slightly reflective against the warm haze behind it.
    // Emissive stepped 0.90 -> 0.78 so the warm palace holds the eye FIRST and the cluster
    // second. Light hierarchy is about relative order, not absolute brightness.
    const m = new THREE.Mesh(geo, cityMaterial(TEX_TOWER, 2, Math.max(1, Math.round(s.h/16)), 0.78, 0x111C22));
    m.position.set(x0 + s.dx, s.h/2, z0 + s.dz);
    m.rotation.y = 0.10 + i * 0.06;
    m.userData.hero = true;
    g.add(m);
  });
  return g;
}

/* EMIRATES PALACE — the counterweight to the towers. Very wide, very low, symmetric, with a
   dome rhythm that steps down from a large centre to corner pavilions. Its horizontality is what
   makes the cluster beside it read as tall, so the width is not decoration — it is the scale
   contrast the brief asks for, built into the composition. */
function emiratesPalace(x0, z0){
  const g = new THREE.Group();
  // Three tones, not one. At a single emissive the body, wings and arcade fused into a
  // continuous gold bar and the dome rhythm — the only thing that identifies this building —
  // disappeared into it. The masses go dark and the domes carry the light.
  const stone = new THREE.MeshStandardMaterial({
    color:0x14110C, roughness:0.92, metalness:0.03, emissive:C.gold, emissiveIntensity:0.025 });
  const arch = new THREE.MeshStandardMaterial({
    color:0x1A150E, roughness:0.9, emissive:C.gold, emissiveIntensity:0.10 });
  const glow = new THREE.MeshStandardMaterial({
    color:0x2A2216, roughness:0.7, emissive:C.gold, emissiveIntensity:0.34 });

  const W = 46;
  const main = new THREE.Mesh(new THREE.BoxGeometry(W*0.42, 3.0, 6.5), stone);
  main.position.set(x0, 1.5, z0); g.add(main);

  // Wings step DOWN and OUT. The stepping is the rhythm; a single long block reads as a shed.
  [[-1,0.62,2.3],[1,0.62,2.3],[-1,0.86,1.7],[1,0.86,1.7]].forEach(([sgn, f, hh]) => {
    const w = new THREE.Mesh(new THREE.BoxGeometry(W*0.20, hh, 5.4), stone);
    w.position.set(x0 + sgn * W * f * 0.5, hh/2, z0 + 0.5); g.add(w);
  });

  // Arcade along the front. Reads as a colonnade in silhouette, costs almost nothing.
  for (let i = 0; i < 26; i++){
    const a = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.15, 0.55), arch);
    a.position.set(x0 - W*0.46 + i * (W*0.92/25), 0.58, z0 + 3.7); g.add(a);
  }

  function dome(dx, r, hy){
    const d = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 13, 0, Math.PI*2, 0, Math.PI/2), glow);
    d.position.set(x0 + dx, hy, z0); d.userData.hero = true; g.add(d);
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(r*0.88, r*0.88, 0.8, 20), stone);
    drum.position.set(x0 + dx, hy - 0.4, z0); g.add(drum);
    const fin = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.9, 8), glow);
    fin.position.set(x0 + dx, hy + r + 0.35, z0); g.add(fin);
  }
  dome(0, 3.4, 3.2);
  dome(-9, 1.7, 2.5);  dome(9, 1.7, 2.5);
  dome(-17, 1.15, 2.0); dome(17, 1.15, 2.0);
  // Corner pavilions, raised — they bracket the whole composition.
  [-22.5, 22.5].forEach(dx => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.6, 5.0), stone);
    p.position.set(x0 + dx, 1.3, z0 + 0.3); g.add(p);
    dome(dx, 1.5, 3.3);
  });
  return g;
}

/* ADNOC HQ — real: 342 m, and the tallest thing in the frame by a clear margin.
   The old version was 9.5 wide and 42 tall — a 4.4:1 slab, which is the proportion of an
   ordinary office block and reads as anonymous however well it is lit. The real building is
   markedly slimmer than that and its identity is the CROWN: the shaft runs clean and then stops
   in a stepped, lit cap that overhangs slightly. That silhouette notch is the recognition cue,
   so it is exaggerated here — two steps rather than one, and the upper step wider than the
   shaft so it throws a distinct shoulder against the sky. Nobody complains that a landmark is
   too recognisable. */
function adnocHQ(x0, z0){
  const g = new THREE.Group();
  const rot = 0.20;
  // Graphite glazing: denser and less blue than Etihad, so the two towers no longer read as the
  // same building at different sizes. Emissive third in the hierarchy, behind palace and Etihad.
  const body = new THREE.Mesh(roundedSlab(7.6, 4.8, 44, 1.7, 7),
    cityMaterial(TEX_TOWER, 3, 3, 0.60, 0x14161A));
  body.position.set(x0, 0, z0); body.rotation.y = rot;
  body.userData.hero = true; g.add(body);

  // Step one: a narrow dark waist. Reads as a shadow line and separates shaft from cap.
  const waist = new THREE.Mesh(roundedSlab(6.9, 4.2, 1.6, 1.5, 7),
    new THREE.MeshStandardMaterial({ color:0x080C10, roughness:0.9, metalness:0 }));
  waist.position.set(x0, 44, z0); waist.rotation.y = rot; g.add(waist);

  // Step two: the lit cap, WIDER than the shaft so the overhang shows in pure black.
  const cap = new THREE.Mesh(roundedSlab(9.0, 5.4, 3.4, 1.9, 7),
    new THREE.MeshStandardMaterial({ color:0x101519, roughness:0.55,
      emissive:0x9FBDC8, emissiveIntensity:0.14 }));
  cap.position.set(x0, 45.6, z0); cap.rotation.y = rot; g.add(cap);
  return g;
}

/* ===========================================================================
   SUPPORTING CITY. Four distinct tower languages rather than one, so the skyline stops
   repeating. Deterministic seed: a skyline that reshuffles between refreshes makes it
   impossible to judge whether a change helped.
   =========================================================================== */
let seed = 20260728;
function rnd(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

function boxTower(w, h, d, em){
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    cityMaterial(h > 9 ? TEX_TOWER : TEX_BLOCK, Math.max(1, Math.round(w/2.6)), Math.max(1, Math.round(h/16)), em));
}
function setbackTower(w, h, d, em){
  const g = new THREE.Group();
  let hh = 0;
  for (let i = 0; i < 3; i++){
    const f = 1 - i * 0.24, seg = h * (0.46 - i * 0.10);
    const m = boxTower(w * f, seg, d * f, em);
    m.position.y = hh + seg/2; hh += seg; g.add(m);
  }
  return g;
}
function slabTower(w, h, d, em){
  return boxTower(w * 1.9, h, d * 0.45, em);
}
function taperTower(w, h, d, em){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(w*0.30, w*0.50, h, 16, 1),
    cityMaterial(TEX_TOWER, 2, Math.max(1, Math.round(h/16)), em));
  m.position.y = h/2; m.scale.z = 0.8;
  return m;
}

/* zSlope tilts the row in depth: the western end sits nearer the camera, the eastern end
   recedes. A shoreline running parallel to the camera gives every building the same distance,
   which is precisely why the skyline read as one rigid object however hard it was orbited.
   gap opens holes in the row — Abu Dhabi is defined as much by its empty ground as its towers,
   and an unbroken wall of buildings is the fastest way to look like a game level. */
function cityRow(count, xMin, xMax, z, zJit, hMin, hMax, em, zSlope, gap){
  const g = new THREE.Group();
  const xMid = (xMin + xMax) / 2;
  const slope = zSlope === undefined ? 0 : zSlope;
  const holes = gap === undefined ? 0.12 : gap;
  for (let i = 0; i < count; i++){
    if (rnd() < holes) continue;
    const h = hMin + Math.pow(rnd(), 1.5) * (hMax - hMin);   // skewed: many low, few tall
    const w = 2.0 + rnd() * 3.2;
    const d = 2.0 + rnd() * 2.8;
    const px = xMin + (xMax - xMin) * (i / (count - 1)) + (rnd() - 0.5) * 4;
    const pick = rnd();
    let m;
    if (h < 6)          m = boxTower(w * 1.4, h, d * 1.4, em);
    else if (pick < 0.28) m = setbackTower(w, h, d, em);
    else if (pick < 0.50) m = slabTower(w, h, d, em);
    else if (pick < 0.72) { m = taperTower(w, h, d, em); }
    else                { m = boxTower(w, h, d, em); m.position.y = h/2; }
    if (m.isMesh && m.geometry.type === 'BoxGeometry') m.position.y = h/2;
    m.position.x = px;
    m.position.z = z + (px - xMid) * -slope + (rnd() - 0.5) * zJit;
    m.rotation.y = (rnd() - 0.5) * 0.6;
    g.add(m);
  }
  return g;
}

/* LOW-RISE. The brief's scale contrast: villas and two-storey mass at the water's edge make the
   towers behind them read as enormous. Without this band everything is the same size and the
   city has no sense of scale at all. */
function lowRise(count, xMin, xMax, z, zJit, em){
  const g = new THREE.Group();
  for (let i = 0; i < count; i++){
    if (rnd() < 0.18) continue;
    const h = 0.7 + rnd() * 1.5;
    const m = boxTower(2.2 + rnd()*3.4, h, 2.0 + rnd()*2.6, em);
    m.position.set(xMin + (xMax-xMin) * (i/(count-1)) + (rnd()-0.5)*3, h/2, z + (rnd()-0.5)*zJit);
    m.rotation.y = (rnd()-0.5) * 0.9;
    g.add(m);
  }
  return g;
}

/* ---------- land and water ---------- */
const land = new THREE.Mesh(
  new THREE.BoxGeometry(700, 1.2, 300),
  new THREE.MeshStandardMaterial({ color:0x0C1218, roughness:0.95, metalness:0 })
);
land.position.set(0, -0.25, -190);          // top at +0.35, clear of the wave displacement
world.add(land);

// Western headland. Emirates Palace moves onto it, roughly 650m from the camera against a
// skyline at 1.5-2km. Geographically compressed, which is the licence a miniature grants —
// landmarks right, relationships intuitive, distances honest fiction.
const headland = new THREE.Mesh(
  new THREE.BoxGeometry(120, 1.2, 70),
  new THREE.MeshStandardMaterial({ color:0x0C1218, roughness:0.95, metalness:0 })
);
headland.position.set(-46, -0.25, 8);
headland.rotation.y = 0.14;
world.add(headland);

/* ===========================================================================
   NEAR SHORE. The reason the foreground "floats" — there was never any ground under it.

   The near field sits at z=218-240. Land was at z=-190 and the headland at z=8, so the eight
   near blocks, the quay and fifteen palms have been standing in open sea this whole time, their
   bases at exactly y=0 with water on all sides and water visible behind their feet. No amount
   of lighting or contact shading fixes that, because the eye is reading a true fact about the
   scene: there is nothing holding them up.

   This is the bank the camera is standing on. It runs from z=190 past the camera at z~320 to
   z=430, so it never shows a far edge behind the viewer, and its waterline at z=190 becomes the
   near edge of the bay — which also gives the reflection somewhere to stop.

   Darker than the city land at 0x0C1218: this is 100 units from the camera rather than 500, so
   the same colour would read considerably lighter and pull the eye down into the corner. */
const nearShore = new THREE.Mesh(
  new THREE.BoxGeometry(560, 1.6, 240),
  new THREE.MeshStandardMaterial({ color:0x070A0E, roughness:1, metalness:0 })
);
nearShore.position.set(0, -0.3, 310);   // top at +0.5, clear of the 0.49 wave crest
world.add(nearShore);

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(1400, 900, 160, 90),
  // NOW that there is an environment to reflect, metalness is correct — it was only wrong
  // before because there was nothing to mirror. Roughness at 0.20 breaks the mirror just enough
  // that the ripple reads as movement rather than as a sheet of glass.
  /* WATER IS A DIELECTRIC, NOT A METAL — metalness 0.92 was wrong and 0.05 is correct. But the
     blowout was never the ENVIRONMENT reflection: the env map's pale band sits around 0.05 in
     linear terms and could not cross a 0.48 bloom threshold if it tried.
     IT IS THE MOON'S DIRECT SPECULAR HIGHLIGHT. A GGX lobe on a smooth surface concentrates a
     light's energy into a peak far above 1.0 — a 0.55-intensity light produces specular values
     in the tens where the half-vector lines up. ROUGHNESS is what spreads that peak, and
     dropping it to 0.22 in the same edit as the metalness fix re-sharpened the lobe and
     cancelled the mitigation out. 0.58 is also nearer the truth: a bay with wind chop is not
     polished glass, and the wave displacement below already implies exactly that surface. */
  new THREE.MeshStandardMaterial({ color:0x050A10, roughness:0.58, metalness:0.05,
    envMapIntensity:0.95 })
);
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0, 140);
world.add(water);
const waterPos = water.geometry.attributes.position;
const waterBase = Float32Array.from(waterPos.array);

/* ===========================================================================
   PLANAR REFLECTION. Replaces the painted band entirely.

   The old strip was a canvas of random gold streaks tiled five times across the bay. It had no
   relationship of any kind to where the lit buildings actually stood, which is why streaks
   appeared under empty sky on the right where the skyline thins out. No amount of tuning fixes
   that: a reflection that does not mirror anything reads as a rug, and the eye knows it before
   the mind works out why.

   This mirrors the camera through the water plane, renders the scene a second time into a small
   off-screen target, and projects that back onto the surface. The skyline is genuinely
   reflected. Towers land under towers, the mosque lands under the mosque, the right side goes
   dark because there is nothing there to reflect, and the whole thing moves correctly as the
   phone tilts because it is derived from the camera rather than painted.

   COST: one extra scene render at 512x512. Roughly 1-2ms. The headroom was there.
   =========================================================================== */

// Additive rather than the stock overlay blend, which is the right model for a reflection on
// dark water: it ADDS light where the city is lit and adds nothing where the sky is black.
// The stock ReflectorShader replaces the surface colour outright, which would erase the wave
// specular underneath it.
const reflectionShader = {
  name: 'W2HReflectorShader',
  uniforms: {
    color:         { value: null },
    tDiffuse:      { value: null },
    textureMatrix: { value: null },
    strength:      { value: 0.55 },   // raised with the calmer surface: a still bay reflects more
  },
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vUv;
    varying vec2 vLocal;
    void main(){
      vLocal = uv;
      vUv = textureMatrix * vec4( position, 1.0 );
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform float strength;
    varying vec4 vUv;
    varying vec2 vLocal;
    void main(){
      vec4 base = texture2DProj( tDiffuse, vUv );

      // The plane is a rectangle and its edges must never be visible. Local V runs 1 at the
      // shoreline to 0 at the camera, so the reflection is strongest directly beneath the city
      // and dies out with distance from it — which is also how a real reflection behaves, since
      // the surface roughness scatters it more the further it travels.
      float fade = smoothstep( 0.04, 0.62, vLocal.y );
      fade *= smoothstep( 0.0, 0.07, vLocal.x ) * ( 1.0 - smoothstep( 0.93, 1.0, vLocal.x ) );

      gl_FragColor = vec4( base.rgb * color * strength * fade, 1.0 );

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
};

const refl = new Reflector(
  new THREE.PlaneGeometry(420, 200),
  {
    // 512 is deliberately small. The surface is rough water, the reflection is meant to be
    // broken up, and a sharp mirror would look more wrong than a soft one. It also keeps the
    // second scene render cheap.
    textureWidth:  512,
    textureHeight: 512,
    // Thin towers reflected into a small target alias badly without this.
    multisample:   4,
    // Nudges the oblique clip plane off the surface. Without it the reflection can self-clip
    // at grazing angles and flicker along the shoreline.
    clipBias:      0.003,
    color:         0x9FB4C4,   // cool tint; the bay is not a neutral mirror
    shader:        reflectionShader,
  }
);
refl.material.transparent = true;
refl.material.blending = THREE.AdditiveBlending;
refl.material.depthWrite = false;
refl.rotation.x = -Math.PI / 2;
// Sits above the maximum wave crest, which the calmer surface above has dropped from 0.49 to
// 0.24 — so the plane comes down with it. Closer to the true water line means the reflection
// starts tighter against the shore instead of hovering a little above it.
refl.position.set(0, 0.30, 62);
world.add(refl);

/* ---------- foreground: the near field the photograph never had ----------
   About 140m from the camera against a skyline at 1.5km. Roughly 10:1, and that ratio is why
   the orbit produces visible parallax at all. These are near-black silhouettes on purpose:
   they are here to occlude, not to be looked at. */
// The per-palm Group builder that used to live here is gone: palms are instanced now.

/* THE NEAR FIELD, REBUILT.
   About 55 units from the camera against Etihad at 157 and the far rows beyond 300. Only 2.9:1,
   far less than the 10:1 the first pass aimed at — but the first pass put its near field off the
   bottom of the screen, so its ratio was worth nothing. What matters is the relative angular
   sweep, and at 12 degrees of orbit the camera translates 34 units, which moves these against
   Etihad by roughly 23 degrees. That is not subtle.

   Composed as two flanking groups with the centre left open, so they frame the skyline instead
   of hiding it. Near-black on purpose: they are here to occlude, not to be looked at. */
const fg = new THREE.Group();
const quayMat = new THREE.MeshStandardMaterial({ color:0x080B0E, roughness:1, metalness:0 });

// NEAR-BLACK, and it matters. The last build gave these the WARM block texture at 0.30
// emissive, so the near field rendered as glowing gold slabs streaked with light — the
// brightest, largest, fastest-moving objects on screen, and the first thing the eye went to.
// They exist to occlude the skyline, not to be looked at. Cool texture, barely lit.
/* THE NEAR FIELD IS A PENDULUM, so it gets a named dial instead of a buried number.
   0.30 warm  — glowing gold slabs, the brightest thing on screen. Too far.
   0.055 cool — the correction, and it went past the mark: the blocks stopped reading as
                objects at all and the bottom third of the frame became a void. An occluder
                still has to be VISIBLE to occlude; a shape you cannot see does not sell depth,
                it just removes picture.
   0.14 cool  — correct WITHOUT bloom, too bright with it. Bloom lifted the block tops over the
                threshold, so the moonlit lids started glowing and the near field turned back
                into a row of plain grey boxes: the blocky look this whole pass set out to fix,
                arriving through the back door.
   0.09 cool  — enough that a vertical edge catches and the face separates from the water, not
                enough for the top surface to bloom. This is the value that survives bloom.
   Above about 0.12 with post-processing on, the lids start to glow again. */
const FG_EMISSIVE = 0.09;
const FG_COLOUR   = 0x090D11;

function nearBlock(x, z, w, h, d, rot){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    cityMaterial(TEX_TOWER, Math.max(1, Math.round(w/2.6)), Math.max(1, Math.round(h/16)), FG_EMISSIVE, FG_COLOUR));
  m.position.set(x, h/2, z); m.rotation.y = rot;
  return m;
}
// Left flank, at about 100 units from the camera and inside the 13.2deg horizontal half-field.
[[-44,222,9,10,7],[-33,232,7,7,6],[-24,218,8,8.5,6.5],[-15,236,6,5.5,5]].forEach(b =>
  fg.add(nearBlock(b[0], b[1], b[2], b[3], b[4], (rnd()-0.5)*0.4)));
// Right flank
[[16,234,7,6,6],[25,220,8.5,9,7],[35,231,7,7.5,6],[46,221,9,11,7.5]].forEach(b =>
  fg.add(nearBlock(b[0], b[1], b[2], b[3], b[4], (rnd()-0.5)*0.4)));

// Quay across the open centre, with palms along it. These sit at about -24deg, just inside the
// bottom of the frame, which is exactly where a foreground edge should sit.
const quay = new THREE.Mesh(new THREE.BoxGeometry(150, 1.4, 6), quayMat);
quay.position.set(0, 0.7, 240); quay.rotation.y = 0.03;
fg.add(quay);
/* PALMS, INSTANCED. Was 15 palms built as Groups of nine meshes each — 135 draw calls for a
   thin scatter that read as props rather than as a planted corniche. Density is most of what
   separates a real waterfront from a few lonely objects, and density is only affordable
   through instancing: 170 palms here cost TWO draw calls instead of 1,530.
   The frond crown is a squashed sphere rather than eight cones. At this distance a cone fan
   and a flattened sphere are indistinguishable, and the sphere is a fifth of the triangles. */
const N_PALM = 170;
const palmTrunkGeo = new THREE.CylinderGeometry(0.05, 0.09, 1, 6);
palmTrunkGeo.translate(0, 0.5, 0);          // origin at the base so scale grows upward
const palmFrondGeo = new THREE.SphereGeometry(1, 7, 5);
palmFrondGeo.scale(1, 0.40, 1);

const palmDark = new THREE.MeshStandardMaterial({ color:0x080B0D, roughness:1, metalness:0 });
const palmTrunks = new THREE.InstancedMesh(palmTrunkGeo, palmDark, N_PALM);
const palmFronds = new THREE.InstancedMesh(palmFrondGeo, palmDark, N_PALM);
palmTrunks.castShadow = palmFronds.castShadow = true;
fg.add(palmTrunks, palmFronds);

const palmData = [];
const palmDummy = new THREE.Object3D();
for (let i = 0; i < N_PALM; i++){
  // Two rows along the quay plus a looser scatter behind, so the planting reads as designed
  // rather than as a single line of identical objects.
  const row = i % 3;
  const x = -60 + (i / N_PALM) * 120 + (rnd() - 0.5) * 3.5;
  const z = row === 0 ? 237 + (rnd()-0.5)*1.6
          : row === 1 ? 231 + (rnd()-0.5)*2.0
          :             224 + (rnd()-0.5)*5.0;
  const h = 2.4 + rnd() * 1.5;
  palmData.push({ x, z, h, phase: rnd() * Math.PI * 2, r: 0.85 + rnd()*0.35 });

  palmDummy.position.set(x, 0, z);
  palmDummy.scale.set(1, h, 1);
  palmDummy.rotation.set(0, 0, (rnd()-0.5) * 0.12);
  palmDummy.updateMatrix();
  palmTrunks.setMatrixAt(i, palmDummy.matrix);
}
palmTrunks.instanceMatrix.needsUpdate = true;
palmDummy.rotation.set(0, 0, 0);

for (let i = 0; i < 11; i++){
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 1.4, 8), quayMat);
  b.position.set(-40 + i * 8, 2.1, 238);
  fg.add(b);
}

/* LAMP POOLS. Emissive geometry GLOWS but does not LIGHT — a lamp head with nothing beside it
   is a bright sticker that illuminates nothing, which is why an emissive-only night scene
   reads as decals on black. Real point lights are expensive, so there are only seven and they
   sit where the eye already goes. Widely spaced, they still read as a continuous chain because
   the eye fills the gaps in. */
const lampHeadMat = new THREE.MeshStandardMaterial({
  color:0xFFE6BE, emissive:C.gold, emissiveIntensity:2.2 });
for (let i = 0; i < 7; i++){
  const x = -54 + i * 18;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 3.0, 6), quayMat);
  post.position.set(x, 1.5, 240); fg.add(post);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.20, 8, 6), lampHeadMat);
  head.position.set(x, 3.1, 240); fg.add(head);
  const pool = new THREE.PointLight(C.gold, 9.0, 26, 2);
  pool.position.set(x, 2.9, 240);
  fg.add(pool);
}

world.add(fg);

/* ---------- assemble the district ---------- */
// DEPTH SPREAD. Previously all three landmarks sat within 14 units of each other — ratios of
// about 1.1:1, so no orbit could ever separate them. Now roughly 65 / 150 / 215 units from the
// camera: 3.3:1 across the district. This is the change that should make the clusters read as
// objects at different distances rather than as one skyline.
// EVERYTHING INSIDE THE +/-80 ENVELOPE. Outside it, at this range, a landmark is simply not on
// screen — which is what happened to Emirates Palace for the whole of the last build.
world.add(emiratesPalace(-44, 12));    // west, near — the wide low counterweight
world.add(etihadTowers(-6, -30));      // centre — the hero cluster
world.add(adnocHQ(42, -62));           // east — the anchor

// HIERARCHY. Emissive falls away with distance so the eye lands on the heroes first, then the
// supporting skyline, then a background mass that is barely more than a silhouette in haze.
world.add(lowRise(26, -78, 80, 22, 6, 0.55));                          // villas at the water
world.add(cityRow(20, -76, 80, -44, 8, 3.5, 17, 0.62, 0.30, 0.20));    // corniche behind
world.add(cityRow(24, -80, 82, -110, 14, 5, 26, 0.42, 0.24, 0.24));    // mid distance
world.add(cityRow(28, -84, 86, -190, 20, 4, 20, 0.24, 0.16, 0.30));    // far, nearly silhouette

/* SHADOW FLAGS, applied in one sweep once the world exists. Doing it per-builder would mean
   remembering it in a dozen places and silently losing it in one. The water and the reflector
   RECEIVE but never CAST: a 1400x900 plane in the shadow frustum would swamp the map's
   resolution and buy nothing, since a flat sea casts no shadow anyone can see. */
world.traverse(o => {
  if (!o.isMesh && !o.isInstancedMesh) return;
  if (o === water || o === refl){ o.castShadow = false; o.receiveShadow = true; return; }
  o.castShadow = true;
  o.receiveShadow = true;
});

/* ===========================================================================
   CAMERA DRIVE. Tilt sets a target point on the arc; the camera eases toward it and always
   looks at TARGET. drift is 0 here: the world must stay where you left it, with no autonomous
   recentring. On the absolute stream the compass supplies the reference, so nothing is needed.
   =========================================================================== */
// Declared BEFORE mountTilt: the onDebug closure captures it, and a `let` below the call sits
// in its temporal dead zone. Spec v3 section 5b, third time this pattern has come up.
let tiltDbg = null;
const tilt = mountTilt({
  enabled: !REDUCE,
  source: 'auto',
  drift: 0,
  onDebug: DEBUG ? (d) => { tiltDbg = d; } : null,
});

// Pointer drag, so this can be judged on a desktop too.
let dragX = 0, dragY = 0, down = false, sx = 0, sy = 0, bx = 0, by = 0;
canvas.addEventListener('pointerdown', e => { down = true; sx = e.clientX; sy = e.clientY; bx = dragX; by = dragY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!down) return;
  dragX = Math.max(-1, Math.min(1, bx + (e.clientX - sx) / (window.innerWidth * 0.42)));
  dragY = Math.max(-1, Math.min(1, by + (e.clientY - sy) / (window.innerHeight * 0.55)));
});
const up = () => { down = false; };
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);

let az = 0, el = 0;          // eased camera angles, degrees
let last = 0, fps = 60;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);

  // Every pass owns its own render targets and none of them resize themselves. Miss one and it
  // keeps sampling a stale buffer — usually seen as the bloom drifting out of register with the
  // scene after an orientation change or the Android URL bar collapsing.
  const pr = renderer.getPixelRatio();
  composer.setSize(w, h);
  bloomPass.setSize(w, h);
  if (smaaPass) smaaPass.setSize(w * pr, h * pr);

  camera.aspect = w / h;
  // Portrait phones are about 0.45 wide per 1 tall, so the horizontal field is roughly a
  // quarter of the vertical. Widen the lens further on very narrow screens rather than let the
  // district fall off the sides.
  camera.fov = (camera.aspect < 0.55) ? FOV + (0.55 - camera.aspect) * 40 : FOV;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function frame(now){
  requestAnimationFrame(frame);
  let dt = last ? (now - last) / 1000 : 1/60;
  last = now;
  if (!(dt > 0) || dt > 0.2) dt = 1/60;
  fps += ((1 / dt) - fps) * 0.08;

  const T = tilt.get();
  const wantAz = Math.max(-1, Math.min(1, T.x + dragX)) * ORBIT_DEG;
  const wantEl = Math.max(-1, Math.min(1, T.y + dragY)) * ELEV_DEG;

  const k = 1 - Math.exp(-dt / TAU);
  az += (wantAz - az) * k;
  el += (wantEl - el) * k;

  // TRANSLATION along the arc. This, not a rotation, is what produces parallax.
  const a = az * Math.PI / 180;
  camera.position.set(
    TARGET.x + Math.sin(a) * ORBIT_R,
    CAM_Y + el * 1.5,
    TARGET.z + Math.cos(a) * ORBIT_R
  );
  camera.lookAt(TARGET);

  // Water: a slow travelling swell, plus the reflection band scrolling against it.
  if (!REDUCE){
    const t = now * 0.00042;
    for (let i = 0; i < waterPos.count; i++){
      const x = waterBase[i*3], y = waterBase[i*3+1];
      // CALMER. Amplitudes roughly halved (0.22/0.17/0.10 -> 0.11/0.08/0.05, crest 0.24 not
      // 0.49) and the two fast terms slowed. Still water against sharp architecture is one of
      // the strongest things about this city, and chop was scattering the reflection into
      // mush. Mirror quality here comes from the PLANAR REFLECTION, not from dropping the
      // roughness — that route is what produced the blowout, and it would produce it again.
      waterPos.array[i*3+2] = Math.sin(x*0.055 + t*1.3) * 0.11 + Math.sin(y*0.041 - t*1.0) * 0.08
                            + Math.sin((x+y)*0.021 + t*0.6) * 0.05;
    }
    waterPos.needsUpdate = true;
    water.geometry.computeVertexNormals();   // without this the ripple never catches the light
    // The painted band used to be scrolled here to fake movement. The reflection now derives
    // from the camera and the animated surface below it, so it moves on its own.

    /* PALM SWAY. Deliberately tiny — a couple of hundredths of a radian. Large enough to
       register only if you look for it, which is precisely the threshold that separates a
       scene that feels alive from one that feels animated. Anything you can clearly SEE
       moving in a hero reads as a screensaver. */
    for (let i = 0; i < N_PALM; i++){
      const pm = palmData[i];
      palmDummy.position.set(pm.x, pm.h + 0.10, pm.z);
      palmDummy.rotation.set(Math.sin(t * 1.7 + pm.phase) * 0.022, 0,
                             Math.cos(t * 1.3 + pm.phase) * 0.022);
      palmDummy.scale.set(pm.r, pm.r * 0.62, pm.r);
      palmDummy.updateMatrix();
      palmFronds.setMatrixAt(i, palmDummy.matrix);
    }
    palmFronds.instanceMatrix.needsUpdate = true;
  }

  renderer.info.reset();
  composer.render();

  if (DEBUG){
    const info = renderer.info;
    __dbg.textContent =
      'orbit   ' + ORBIT_DEG + ' deg   az ' + az.toFixed(2) + '   el ' + el.toFixed(2) + '\n' +
      'sensor  ' + (tiltDbg && tiltDbg.src ? tiltDbg.src : 'waiting') +
        '   T.x ' + T.x.toFixed(3) + '   T.y ' + T.y.toFixed(3) + '\n' +
      'fps     ' + fps.toFixed(0) + '\n' +
      'tris    ' + info.render.triangles + '   calls ' + info.render.calls + '\n' +
      'geo     ' + info.memory.geometries + '   tex ' + info.memory.textures + '\n' +
      'post    bloom ' + (bloomPass.enabled ? POST.strength.toFixed(2) : 'off') +
        '   thr ' + POST.threshold.toFixed(2) +
        '   smaa ' + (smaaPass ? 'on' : 'off') +
        '   aniso ' + MAX_ANISO + '\n' +
      // Reads live off the material, so it confirms which build is actually running rather than
      // what the source says. Cache and a stale deploy look identical from the outside.
      'water   metal ' + water.material.metalness.toFixed(2) +
        '   rough ' + water.material.roughness.toFixed(2) +
        '   env ' + water.material.envMapIntensity.toFixed(2) +
        '   moon ' + moon.intensity.toFixed(2) + '\n' +
      'fx      tilt ' + tiltPass.uniforms.amount.value.toFixed(2) +
        '   shadow ' + (renderer.shadowMap.enabled ? 'on' : 'off') +
        '   palms ' + N_PALM + '\n' +
      'refl    ' + (refl.visible
          ? 'on  str ' + refl.material.uniforms.strength.value.toFixed(2) + '   512px'
          : 'off') + '   mode ' + mode + '\n\n' +
      'the whole district must fit the frame.\nif a landmark is never visible, it is\noutside the 13deg horizontal half-field,\nnot below the frustum.';
  }
}
requestAnimationFrame(frame);

/* ---------- chips ---------- */
const chips = { o8:8, o12:12, o18:18 };
Object.keys(chips).forEach(id => {
  document.getElementById(id).addEventListener('click', () => {
    ORBIT_DEG = chips[id];
    Object.keys(chips).forEach(k =>
      document.getElementById(k).setAttribute('aria-pressed', String(k === id)));
  });
});
document.getElementById('rec').addEventListener('click', () => {
  tilt.recentre(); dragX = 0; dragY = 0;
});

/* LIVE TUNING. Bloom is judged in the hand, not argued about in a commit message. From a
   remote-debug console on the Fold:
     W2H.post.strength = 0.9; W2H.apply()
     W2H.post.threshold = 0.6; W2H.apply()
   Read the values back off the debug overlay and paste the ones that win into POST above. */
window.W2H = {
  post: POST,
  apply(){
    bloomPass.strength  = POST.strength;
    bloomPass.radius    = POST.radius;
    bloomPass.threshold = POST.threshold;
  },
  exposure(v){ renderer.toneMappingExposure = v; },
  // W2H.reflection(0.5) to push the reflection, W2H.reflection(0.2) to pull it back.
  reflection(v){ refl.material.uniforms.strength.value = v; },
  // Aerial perspective, judged in the hand. W2H.haze(0.0026) for a thicker, closer horizon;
  // W2H.haze(0.0012) to push the far skyline back into legibility. Second argument recolours
  // the haze: W2H.haze(0.0019, 0x2E2418) for a warmer, dustier band.
  // W2H.tilt(0) to switch the miniature blur off, W2H.tilt(1.8) to exaggerate it.
  // W2H.focus(0.55) moves the sharp band up the frame.
  tilt(v){ tiltPass.uniforms.amount.value = v; },
  focus(v){ tiltPass.uniforms.focus.value = v; },
  haze(density, colour){
    if (colour !== undefined) scene.fog.color.setHex(colour);
    scene.fog.density = density;
  },
};

/* ===========================================================================
   THREE VIEW MODES, because each one answers a question the other two cannot.

   NIGHT       the real product. Tests lighting, bloom, reflection, atmosphere.
   SILHOUETTE  flat black on pale sky. Tests OUTLINE only. If a landmark vanishes here it is
               not carrying its own recognition and no lighting will rescue it.
   DAY         neutral stone under a hard sun. Tests MASSING — how forms shade, how they sit
               against each other, whether the composition has depth or is one flat wall.

   The gap DAY fills: at night almost every surface is near-black, so proportion, setback,
   spacing and depth are all invisible. You cannot judge whether the district is well composed
   in a picture where you can only see the windows. Under a raking sun each face takes a
   different value and the massing becomes legible — which is exactly what the composition and
   scale notes in the brief are about.
   =========================================================================== */
let mode = 'night';   // 'night' | 'day' | 'sil'

const silMat   = new THREE.MeshBasicMaterial({ color:0x000000 });
const silWater = new THREE.MeshBasicMaterial({ color:0xB9CBD4 });

// STANDARD, not Basic. A flat unlit material would give a day mode that is just a paler
// silhouette — every face the same value, no massing information at all. Standard means the
// sun shades each plane differently and the forms read as solid.
const dayMat   = new THREE.MeshStandardMaterial({ color:0xC9C2B2, roughness:0.88, metalness:0 });
const dayWater = new THREE.MeshStandardMaterial({ color:0x6E9CB6, roughness:0.30, metalness:0 });

function applyMode(next){
  mode = next;
  const sil = (mode === 'sil'), day = (mode === 'day');

  ['day','sil'].forEach(id => document.getElementById(id)
    .setAttribute('aria-pressed', String(mode === id)));

  scene.background = new THREE.Color(sil ? 0xC8D8DF : day ? 0x9FC4DA : C.night);
  scene.fog = sil ? null
            : day ? new THREE.FogExp2(0xB6CEDD, 0.0011)
            : new THREE.FogExp2(C.haze, 0.0019);
  // Day drops the env map: it is a NIGHT gradient, and leaving it on tints every daylight
  // surface a muddy blue. The hemisphere light does the ambient job instead.
  scene.environment = (sil || day) ? null : envMap;

  moon.visible  = !sil && !day;
  rim.visible   = !sil && !day;
  sun.visible   = day;
  daySky.visible = day;

  // Bloom is a night effect. Against a pale sky it flares every edge and destroys exactly the
  // profiles and massing these two modes exist to judge.
  bloomPass.enabled = (mode === 'night');
  renderer.toneMappingExposure = day ? 1.0 : 1.15;

  // The reflection stays on in day — a still bay under sky is half the point of the city — but
  // is off in silhouette, where anything but flat black is noise.
  refl.visible = !sil;

  world.traverse(o => {
    if (!o.isMesh || o === refl) return;   // NEVER swap the Reflector: its ShaderMaterial IS the
                                           // reflection, and replacing it silently kills it.
    if (mode === 'night'){
      if (o.userData.origMat) o.material = o.userData.origMat;
      return;
    }
    if (!o.userData.origMat) o.userData.origMat = o.material;
    o.material = (o === water) ? (sil ? silWater : dayWater)
                               : (sil ? silMat   : dayMat);
  });
}

document.getElementById('sil').addEventListener('click',
  () => applyMode(mode === 'sil' ? 'night' : 'sil'));
document.getElementById('day').addEventListener('click',
  () => applyMode(mode === 'day' ? 'night' : 'day'));

// Permission gate for iOS. Android attaches on mount and this is a no-op.
canvas.addEventListener('click', function once(){
  if (tilt.request) tilt.request();
  canvas.removeEventListener('click', once);
});

} catch(e){ fail('module top level', e); }
</script>
</body>
</html>
