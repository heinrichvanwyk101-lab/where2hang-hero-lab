# PASTE TARGET: where2hang-hero-lab/.github/workflows/bake-city.yml
# ==============================================================================================
# Fetches Abu Dhabi and commits data/index.json plus one file per island.
#
# BUILDINGS COME FROM OVERTURE. Coastline, roads, parks and landmarks still come from
# OpenStreetMap via Overpass. The split is deliberate: OSM's building coverage outside Abu Dhabi
# Island is landmarks-only — Al Reem holds 16 buildings per km² against the main island's 194, and
# the median building it does hold is 2,476 m² — while its road and coastline coverage is good and
# both the stitcher and the road classifier are built around OSM's conventions.
#
# MANUAL ONLY. No schedule and no push trigger, deliberately: the sources change under you, and a
# nightly bake would mean the scene quietly moved between two deploys with no commit explaining
# why. Run it when you want new data, look at the diff, keep it or revert it.
#
# RUN THE PROBE FIRST when anything about the source changes. It counts what Overture returns per
# island against what the committed index holds, writes nothing and commits nothing. One minute
# against an afternoon.
#
# TO RUN: Actions tab -> "Bake city data" -> Run workflow. On the phone this is four taps.
# ==============================================================================================
name: Bake city data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = count only, nothing written. bake = write and commit.'
        type: choice
        options: [probe, bake]
        default: probe
      island:
        description: 'One island only (corniche, maryah, reem, saadiyat, yas) — blank for all'
        required: false
        default: ''
      source:
        description: 'Building source. osm falls back to the pre-Overture bake.'
        type: choice
        options: [overture, osm]
        default: overture
      release:
        description: 'Overture release, e.g. 2026-07-22.0. Blank resolves the latest from STAC.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Two bakes at once would race on the commit and get the repo rate-limited by Overpass.
  group: bake-city
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    # Raised from 30. The Overpass half is unchanged; the S3 scan is new and its cost depends on
    # how many parquet row groups the bounding box touches, which is not a number this repository
    # controls. A timeout that fires on a slow day looks exactly like a broken query.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ------------------------------------------------------------------------------------
      # DUCKDB, AND IT IS THE ONLY DEPENDENCY THIS REPOSITORY HAS EVER TAKEN.
      #
      # Overture publishes GeoParquet on S3 and has no REST endpoint, so there is no way to read
      # it with built-in fetch. This is a build-time binary rather than a runtime supply chain —
      # nothing it touches reaches the repo except JSON — but it does break the no-install rule the
      # old workflow was written around, and that is worth stating rather than sliding past.
      #
      # Two install paths because neither is guaranteed: the release asset first, the official
      # script second. If both fail the step fails here rather than leaving a later step to report
      # "duckdb: not found" three minutes in.
      # ------------------------------------------------------------------------------------
      - name: Install DuckDB
        if: inputs.source != 'osm'
        run: |
          set -e
          if curl -fsSL -o /tmp/duckdb.zip \
               https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip; then
            sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
          else
            curl -fsSL https://install.duckdb.org | sh
            echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"
            export PATH="$HOME/.duckdb/cli/latest:$PATH"
          fi
          duckdb -c "SELECT version();"

      # ------------------------------------------------------------------------------------
      # ONE SCAN FOR ALL FIVE ISLANDS.
      #
      # The union of the five fetch boxes, queried once, split in Node afterwards. Five separate
      # queries would be five scans of S3 over overlapping rows — Corniche's box already contains
      # Al Maryah's — and the scan is the expensive half.
      #
      # The predicate is on bbox.xmin/xmax/ymin/ymax rather than on the geometry, because those are
      # plain columns and Parquet can skip whole row groups on them. A spatial predicate here would
      # read the entire theme.
      #
      # WRITTEN TO RUNNER_TEMP, NOT THE REPO. The extract is a hundred thousand footprints with
      # their geometry; it must not be within reach of `git add`, and putting it outside the
      # working tree is a stronger guarantee than a .gitignore line somebody edits later.
      # ------------------------------------------------------------------------------------
      - name: Fetch Overture buildings
        if: inputs.source != 'osm'
        env:
          OUT: ${{ runner.temp }}/overture-buildings.ndjson
        run: |
          set -e
          REL='${{ inputs.release }}'
          if [ -z "$REL" ]; then
            REL=$(duckdb -noheader -list -c \
              "INSTALL httpfs; LOAD httpfs;
               SELECT latest FROM read_json_auto('https://stac.overturemaps.org/catalog.json');" \
              | tail -1 | tr -d '[:space:]')
          fi
          if [ -z "$REL" ]; then
            echo "Could not resolve the Overture release from the STAC catalog."
            echo "Re-run with the release input set explicitly, e.g. 2026-07-22.0."
            exit 1
          fi
          echo "Overture release: $REL"

          duckdb -c "
            INSTALL httpfs; LOAD httpfs;
            INSTALL spatial; LOAD spatial;
            SET s3_region='us-west-2';
            COPY (
              SELECT id,
                     height,
                     num_floors,
                     -- WHAT THE BUILDING IS, WHICH THIS QUERY HAS BEEN THROWING AWAY.
                     -- Overture tags every building with a subtype and a class: hotel,
                     -- apartments, retail, warehouse, hangar, parking, school, mosque. The
                     -- renderer was picking a facade material by HASHING the id, so a beachfront
                     -- hotel drew from the same distribution as an industrial shed and Yas Bay
                     -- came out the same grey as everywhere else. One column ends that.
                     subtype,
                     class,
                     -- Roof shape and facade material are sparse but free, and where they exist
                     -- they beat anything that can be inferred.
                     roof_shape,
                     roof_color,
                     facade_material,
                     facade_color,
                     sources,
                     ST_AsGeoJSON(geometry) AS geojson
              FROM read_parquet(
                's3://overturemaps-us-west-2/release/$REL/theme=buildings/type=building/*',
                hive_partitioning=1)
              WHERE bbox.xmin <= 54.6450 AND bbox.xmax >= 54.2800
                AND bbox.ymin <= 24.5950 AND bbox.ymax >= 24.3800
            ) TO '$OUT' (FORMAT JSON);
          "
          echo "extract: $(wc -l < "$OUT") rows, $(du -h "$OUT" | cut -f1)"
          # An empty extract means the predicate or the release path is wrong, and baking on it
          # would commit five empty islands. Better to stop here.
          if [ "$(wc -l < "$OUT")" -lt 1000 ]; then
            echo "Extract is implausibly small for Abu Dhabi. Not baking."
            exit 1
          fi

      # ------------------------------------------------------------------------------------
      # PROBE. Counts and stops. No Overpass traffic, no writes, no commit.
      # ------------------------------------------------------------------------------------
      - name: Probe
        if: inputs.mode == 'probe'
        env:
          W2H_OVERTURE: ${{ runner.temp }}/overture-buildings.ndjson
        run: node tools/bake-city.mjs --probe

      - name: Bake
        if: inputs.mode == 'bake'
        env:
          W2H_OVERTURE: ${{ runner.temp }}/overture-buildings.ndjson
        run: node tools/bake-city.mjs ${{ inputs.island }}

      - name: Report
        if: inputs.mode == 'bake'
        run: |
          ls -lh data/
          node -e "const d=require('./data/index.json'); const c=d.islands;
            console.log('buildings from', d.buildingSource || 'osm');
            console.log('origin', d.origin.lat, d.origin.lon);
            for(const i of c) console.log(i.id.padEnd(10),
              (i.extent? (i.extent.w/1000).toFixed(2)+' x '+(i.extent.d/1000).toFixed(2)+' km' : 'no outline').padEnd(18),
              'roads', String(i.counts.roads).padStart(5),
              'buildings', String(i.counts.buildings).padStart(6),
              'height', String(i.counts.withHeight).padStart(5),
              (i.bytes/1048576).toFixed(2)+' MB');"

      - name: Commit
        if: inputs.mode == 'bake'
        run: |
          git config user.name  'bake-city'
          git config user.email 'actions@github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'No change in the source data.'
          else
            git commit -m "Bake city data (${{ inputs.source }})${{ inputs.island && format(' — {0}', inputs.island) || '' }}"
            git push
          fi
