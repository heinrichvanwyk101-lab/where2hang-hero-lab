/* 45 SECONDS, UP FROM 22, AND A WAY TO TURN IT OFF ENTIRELY.

   22 is a reasonable guess for a visitor who has stopped touching the screen. It is hopeless for
   anyone inspecting the scene: reading a debug overlay, comparing a road network against a map, or
   just looking at something takes longer than that, and the camera flying away mid-thought makes
   the loop an obstacle rather than an attraction.

   ?still disables it outright, which is what you want while working on the thing. It is a URL
   flag rather than a build constant for the same reason ?drawn is: a diagnostic you have to
   redeploy to use is a diagnostic nobody uses. */
const IDLE_MS = 45000;
const ATTRACT_OFF = location.search.includes('still');

/* THE ERROR TRAP, WHICH SHOULD HAVE EXISTED BEFORE THE ATTRACT LOOP DID.

   This is authored and tested on a phone. There is no console, so an exception is not a message —
   it is an absence: the camera stops moving, or an island never appears, and the only evidence is
   the thing that did not happen. Two rounds of this have now been spent trying to tell a frozen
   frame apart from a healthy one in a screenshot.

   A throw inside frame() is especially quiet. requestAnimationFrame is registered on the FIRST
   line, so the loop survives its own body failing: every subsequent frame re-enters, dies at the
   same statement, and re-registers. The picture freezes, the overlay keeps whatever numbers the
   last complete frame left, and nothing anywhere says so.

   Kept to the last error and a count. A trap that scrolls is a trap nobody reads on a 6-inch
   screen, and the first one is nearly always the real one anyway. */
const ERR = { msg:null, n:0 };

/* PICK — a real, discoverable coordinate tool, replacing a first attempt that only worked behind
   #debug with no visible control and needed a pixel-perfect tap that one-finger orbit was
   swallowing as a drag. Modes cycle OFF -> POINT -> POLY -> OFF via the bottom-bar button.
   While active, orbit is frozen — every pointer interaction is unambiguously a pick, not a
   competing camera gesture, which was the actual cause of "nothing happens" before. */
const PICK = { mode:'off', points:[], markers:null };
const PICK_MODES = ['off', 'point', 'poly'];
function noteError(where, e){
  ERR.n++;
  const m = (e && e.message) || String(e);
  if (!ERR.msg) ERR.msg = where + ': ' + m;
  console.error(where, e);
}
window.addEventListener('error', ev => noteError('window', ev.error || ev.message));
/* THE OTHER BLACK SCREEN. A lost WebGL context draws nothing and throws nothing: no exception,
   no console line, a live page with an empty canvas. On Android it is caused by backgrounding
   the tab or by memory pressure, and five islands of instanced footprints is a great deal more
   memory than this page used to hold. Identical to a NaN camera from the outside; completely
   different underneath. Naming it is the whole point. */
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  noteError('webgl', new Error('context lost — reload required'));
});
canvas.addEventListener('webglcontextrestored', () => { ERR.msg = null; ERR.n = 0; });
window.addEventListener('unhandledrejection', ev => noteError('promise', ev.reason));

const attract = { on:false, i:0, until:0, lastInput:performance.now() };

/* Building the NEXT island now, so its arrival is a camera move rather than a camera move plus a
   second of frozen thread. Wrapped exactly like setDistrict's own call, because a freshly built
   island needs its materials snapshotted and registered before any view touches them — the fault
   that killed the render loop the first time this was deferred. */
/* HAS THIS ISLAND'S NETWORK LANDED YET. Synchronous, because the answer decides whether to build
   now or to wait, and a promise cannot be asked that question without already having waited. */
function roadsIn(id){
  const idx = window.__basemapIndex;
  const e = idx && (idx.islands || []).find(i => i.id === id);
  return !!(e && e._roads);
}

/* Resolves when the roads are in hand, when the fetch has failed, or after a ceiling — whichever
   comes first. The ceiling is the important one: a fetch that never settles would otherwise leave
   the island unbuilt for the rest of the session and the flight would arrive at bare sand. Four
   seconds is comfortably longer than any of these files has taken and comfortably shorter than a
   leg, so in the normal case it is never reached and in the pathological case it degrades to
   exactly the old behaviour. */
function whenRoads(id, ms = 4000){
  const idx = window.__basemapIndex;
  if (!idx || !BMAP.loadRoads) return Promise.resolve(false);
  return Promise.race([
    BMAP.loadRoads(idx, id).then(() => true).catch(() => false),
    new Promise(res => setTimeout(() => res(false), ms)),
  ]);
}


/* ---------- STAGE 3a: REAL FOOTPRINTS, BEHIND ?fp ----------

   The island payload is the file roads were split out of, and it is the larger half of what is
   left. It is fetched only when the flag is on, so nothing about the default path changes weight:
   a diagnostic that costs every visitor a megabyte is a diagnostic that has to be justified to
   people who are not debugging.

   Per island, on demand, at the moment its city is built. Same lifecycle as the roads, same
   reason — the ground and the buildings want to arrive together or the island assembles twice. */

async function footprintsFrom(d){
  const idx = window.__basemapIndex;
  if (!idx || !BMAP.loadIsland || !BMAP.buildingsUnits) return null;
  const entry = (idx.islands || []).find(i => i.id === d.id);
  if (!entry) return null;
  const data = await BMAP.loadIsland(idx, d.id);
  const origin = BMAP.islandOrigin(entry);
  const units = BMAP.buildingsUnits(data, origin);
  return (units && units.length) ? units : null;
}

/* THE GOLF COURSE AND THE CIRCUIT, on the same async path and for the same reason.

   These are ground features and conceptually belong in the ground canvas. They are meshes because
   paintGround runs at island BUILD time while the payload arrives later, so painting them would
   mean loading the payload before the build — and a prefetch race of exactly that shape already
   made Al Maryah render generated-or-real non-deterministically per load. Adding after the island
   exists is the path footprintsFor already proves.

   INERT WITHOUT THE BAKE. golfUnits and racewayUnits are new in basemap v7 and the arrays they
   read are new in the bake; against an older payload both come back empty, gfState records
   'none', and nothing is added. */
const gfState = new Map();

async function groundFeaturesFrom(d){
  const idx = window.__basemapIndex;
  if (!idx || !BMAP.loadIsland || !BMAP.golfUnits || !BMAP.racewayUnits) return null;
  const entry = (idx.islands || []).find(i => i.id === d.id);
  if (!entry) return null;
  const data = await BMAP.loadIsland(idx, d.id);
  const origin = BMAP.islandOrigin(entry);
  const golf = BMAP.golfUnits(data, origin);
  const raceway = BMAP.racewayUnits(data, origin);
  const parks = BMAP.parksUnits ? BMAP.parksUnits(data, origin) : [];
  return (golf.length || raceway.length || parks.length) ? { golf, raceway, parks } : null;
}

async function addGroundFeatures(d){
  if (!groundFeaturesFor || gfState.has(d.id)) return;
  gfState.set(d.id, 'pending');
  try {
    const feats = await groundFeaturesFrom(d);
    if (!feats){ gfState.set(d.id, 'none'); return; }
    const g = groundFeaturesFor(d, feats);
    if (!g){ gfState.set(d.id, 'none'); return; }
    d.detail.add(g);
    /* Same order the deferred islands taught us: snapshot and register BEFORE any view touches
       the new meshes, or applyView sets a material to undefined and the render loop dies inside
       projectObject naming neither the mesh nor the island. */
    snapshotMats(g); registerLift(g); applyView(view);
    gfState.set(d.id, 'on');
  } catch (e){
    gfState.set(d.id, 'fail');
    console.warn('groundFeatures ' + d.id + ': ' + e.message);
  }
}

/* THE WATER REBUILD'S OWN CALLER — refreshIslandWater itself just swaps geometry and adds meshes;
   something still has to fetch the data it needs and know when to ask.

   Reuses loadIsland's own cache rather than adding a new fetch: footprintsFrom and
   groundFeaturesFrom both already await BMAP.loadIsland(idx, d.id) for this exact island, so by
   the time any of the three resolves the underlying promise is very often already settled from
   one of the others — this call either joins that same promise or starts it, never duplicates
   the network request.

   d._waterAttempted guards the ATTEMPT, separately from refreshIslandWater's own d._waterBuilt
   guard on the RESULT — an island with no water at all (five out of six) would otherwise retry
   loadIsland on every single visit for the rest of the session, forever confirming the same
   "nothing to do" it already confirmed the first time. */
async function addWaterGeometry(d){
  if (!refreshIslandWater || d._waterAttempted) return;
  d._waterAttempted = true;
  try {
    const idx = window.__basemapIndex;
    if (!idx || !BMAP.loadIsland) return;
    await BMAP.loadIsland(idx, d.id);
    const before = d.isleMeshes ? d.isleMeshes.length : 0;
    refreshIslandWater(d);
    /* Only the NEW water-island meshes need this — the main platform's own mesh objects are
       reused as-is by refreshIslandWater, materials untouched, so they are exactly as
       snapshotted and registered as they were at the original build. Only brand-new objects
       need the treatment addGroundFeatures's own comment above explains the ordering for. */
    if (d.isleMeshes && d.isleMeshes.length > before){
      for (let i = before; i < d.isleMeshes.length; i++){
        snapshotMats(d.isleMeshes[i]); registerLift(d.isleMeshes[i]);
      }
      applyView(view);
    }
  } catch (e){
    console.warn('waterGeometry ' + d.id + ': ' + e.message);
  }
}

/* Hides the generated fabric's MESHES without touching its arithmetic. The cells and blocks it
   returned are still in d.fabric and still feeding groundPlan; only the boxes stop drawing. */
/* CULL THE FABRIC WHERE REAL BUILDINGS LAND, AND NOWHERE ELSE.

   THIS REPLACES HIDING THE LOT. hideFabric switched off every generated InstancedMesh on any
   island that got footprints, which is right only if the payload covers the island. It does not:

     Saadiyat  1,841 real against 18,782 generated — hiding all of it empties the island
     Yas       3,803 real against  1,079 generated — the payload is the denser layer
     Maryah      102 real against  1,107 generated

   So the two islands failed in opposite directions and neither mode was ever right. All-generated
   gave Saadiyat the right density with invented heights and types; all-real gave it a scarce
   island. Yas was the reverse. That is not a tuning problem, it is a coverage problem, and it
   varies block by block within an island as well as between islands.

   THE DESIGN WAS ALWAYS GAP-FILL: real footprints where they exist, generated stock in the gaps,
   hand-built for the heroes. This is that, decided per instance rather than per island, so no
   per-island number needs maintaining — coverage settles it wherever the coverage happens to be.

   HOW. Every real footprint's centre goes into a coarse grid. Then every generated instance is
   tested against that grid, and any instance standing within CULL_R of a real building has its
   matrix zeroed. Zeroing the scale rather than removing the instance keeps the count, the buffer
   and the draw call intact — an InstancedMesh cannot drop a member, and rebuilding the buffer to
   do it properly would cost more than the degenerate triangles it saves.

   CULL_R IS A RADIUS, NOT A FOOTPRINT TEST, and that is deliberate. The generated block sits on a
   street grid and the real building sits where it really is; they will never align, so testing for
   overlap leaves a generated box wedged against every real facade. A radius in island units, about
   14 m, clears the neighbours as well as the collision. Too large and the real buildings stand in
   holes; this is the number to move if the islands read wrong.

   WHY IT IS DONE HERE rather than at generation time. buildFabricFor runs inside buildIsland and
   the footprints arrive later, async, from the basemap. Reordering that is the prefetch race that
   already made Al Maryah render generated-or-real non-deterministically per load, and the comment
   above footprintsFrom says so. At THIS point both datasets are in hand and nothing has to move. */
const NO_GRAIN = /[?&]nograin\b/.test(location.search);
const CULL_R = 14 / 7.8;                 // island units; M_PER_UNIT is 7.8
/* AND THE FAR TEST, WHICH IS THE OTHER HALF OF THE SAME IDEA.

   Near-culling alone still fills every part of an island that has no footprints in it, and on
   Saadiyat that is most of the island. Its 1,842 buildings sit in a clean diagonal band from
   north-east to south-west — the villa estates and the Cultural District — and the entire
   south-east is sand, mangrove and laydown yards. Generated stock carpeted it, which is a city
   invented in a desert and the loudest thing wrong with the island.

   So an instance survives only if a real building is FAR ENOUGH to leave room and NEAR ENOUGH to
   suggest people build here. Overture is trustworthy about WHERE and unreliable about HOW MANY —
   Saadiyat returns roughly half its villas but puts them all in the right places — so proximity to
   a real footprint is a good proxy for "this is a built area" and absence of one for hundreds of
   metres is a good proxy for "this is empty ground".

   KEEP_R IS THE COARSER OF THE TWO NUMBERS AND THE MORE LIKELY TO NEED MOVING. Too small and the
   fill hugs the real buildings and leaves holes inside genuine estates; too large and the desert
   comes back. 160 m is about two villa plots plus a street, which is the scale at which a gap in
   the payload stops being a gap and starts being open ground.

   YAS IS THE CHECK ON IT. Yas already reads correctly — its villa estates are real footprints and
   their form and grouping are right — and its southern half is theme parks and circuit, where
   there is almost nothing real to be near. If this is calibrated properly Yas barely moves. */
const KEEP_R = 160 / 7.8;

function cullFabric(d, list){
  if (!list || !list.length) return 0;

  /* KIT_ZONES, THE SAME LANDMARK RECTANGLES footprintsFor ALREADY TRUSTS, NOW READ HERE TOO.
     Shared from w2h-world.js's buildWorld() for exactly this — this loop only knew "is a real
     surveyed building nearby", and a hand-built landmark or a traced precinct shape isn't one, so
     ground it already covers kept generating filler regardless. NOT a module export — KIT_ZONES
     lives inside buildWorld's own closure like almost everything else in that file, and reaches
     here the same way buildIsland and footprintsFor already do: through the destructured return
     value above, not through the WORLD module namespace. (`export const KIT_ZONES` was tried
     first and broke the entire file — `export` is illegal inside a function body, which is what
     that position actually was, verified with esbuild after Node's own --check missed it.)
     Checked once per call, not per instance; the zone list for a district is at most a handful
     of rectangles. */
  const zones = (KIT_ZONES && KIT_ZONES[d.id]) || [];
  const inZone = (x, z) => zones.some(b => x >= b.x0 && x <= b.x1 && z >= b.z0 && z <= b.z1);

  /* One grid at the COARSER radius so a single +/-1 cell sweep serves both tests. Binning at
     CULL_R instead would need an eleven-cell sweep to answer the far question. */
  const CELL = KEEP_R;
  /* HOISTED ABOVE nearGrain, which reads FAR2. It worked where it was only because nothing calls
     nearGrain until after the declaration runs; that is a temporal-dead-zone trap waiting for the
     first person who moves a line. */
  const NEAR2 = CULL_R * CULL_R, FAR2 = KEEP_R * KEEP_R;
  const grid = new Map();
  const key = (x, z) => Math.floor(x / CELL) + ':' + Math.floor(z / CELL);
  for (const u of list){
    const x = u.x != null ? u.x : (u[0] || 0);
    const z = u.z != null ? u.z : (u[1] || 0);
    /* w, dp AND h, WHICH THIS GRID HAS ALWAYS THROWN AWAY. buildingsUnits has carried them since
       basemap v1; cullFabric bins only x and z, so every question it could answer was reduced to
       a distance. The plan size of the neighbours is the signal that says whether this is a villa
       estate or a business district, and it was already in the payload. */
    const w = u.w != null ? u.w : 0, dp = u.dp != null ? u.dp : 0;
    const k = key(x, z);
    let a = grid.get(k);
    if (!a){ a = []; grid.set(k, a); }
    a.push([x, z, (w + dp) / 2, u.h > 0 ? u.h : 0]);
  }
  /* NEAREST DISTANCE AND NEIGHBOURHOOD GRAIN IN ONE SWEEP. The 3x3 walk already visits every real
     building within reach; summing plan size and height over the ones inside FAR2 costs two adds
     per visit and no extra traversal.

     THE MEAN IS OVER THE WHOLE 160 m NEIGHBOURHOOD, NOT THE SINGLE NEAREST. One building next
     door can be a clubhouse in an estate of houses, and the fabric would then be sized to the
     clubhouse. Grain is a property of an area; it needs the area.

     Height is averaged only over the footprints that HAVE one - Overture leaves h null on most
     of the payload, and folding those in as zero would drive every estate to the two-storey
     floor whether or not the real stock is low. */
  const nearGrain = (x, z) => {
    const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
    let best = Infinity, n = 0, sp = 0, nh = 0, sh = 0;
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++){
      const a = grid.get((cx + i) + ':' + (cz + j));
      if (!a) continue;
      for (const [px, pz, pp, ph] of a){
        const dx = px - x, dz = pz - z;
        const d2 = dx * dx + dz * dz;
        if (d2 < best) best = d2;
        if (d2 <= FAR2 && pp > 0){ n++; sp += pp; if (ph > 0){ nh++; sh += ph; } }
      }
    }
    return { d2: best, n, pw: n ? sp / n : 0, ph: nh ? sh / nh : 0 };
  };
  /* GUARDED, because an older w2h-world.js in a browser cache has no grainFit and the island must
     still cull. Absent, every line below behaves exactly as v113 did. */
  const GFIT = (!NO_GRAIN && WORLD.grainFit) ? WORLD.grainFit : null;

  const m = new THREE.Matrix4(), zero = new THREE.Matrix4().makeScale(0, 0, 0);
  /* Scratch for the survivors only. decompose is the expensive call the original loop was written
     to avoid, and it still is - it now runs on the instances that SURVIVE both tests, which on
     Saadiyat is a small fraction of the count, and it runs once at swap time rather than per
     frame. */
  const gp = new THREE.Vector3(), gq = new THREE.Quaternion(), gs = new THREE.Vector3(),
        goff = new THREE.Vector3(), gjit = new THREE.Quaternion(),
        GY = new THREE.Vector3(0, 1, 0);
  let culled = 0, kept = 0, grained = 0;
  [d.mass, d.detail].forEach(layer => {
    if (!layer) return;
    layer.children.forEach(o => {
      if (!o.isInstancedMesh || o.name === 'footprints') return;
      for (let i = 0; i < o.count; i++){
        o.getMatrixAt(i, m);
        /* Elements 12 and 14 are the translation's x and z. Cheaper than decompose, and this runs
           once per instance across tens of thousands of them. */
        const ix = m.elements[12], iz = m.elements[14];
        /* Zone check first and unconditional — a landmark or a traced precinct wins regardless
           of what the real-building proximity test would have said on its own. */
        if (inZone(ix, iz)){ o.setMatrixAt(i, zero); culled++; continue; }
        const g = nearGrain(ix, iz);
        /* Too close: a real building already stands here. Too far: nobody builds here at all. */
        if (g.d2 < NEAR2 || g.d2 > FAR2){ o.setMatrixAt(i, zero); culled++; continue; }
        kept++;
        if (!GFIT) continue;
        /* THE SCALE IS THE BOX. urbanFabric writes M.scale.set(o.w, o.h, o.d) onto a unit profile
           whose origin is at the FOOT, so x and z are the plan in island units, y is the height in
           island units, and shrinking y does not need the position moved. */
        m.decompose(gp, gq, gs);
        const fit = GFIT(gs.x, gs.z, gs.y, g, ix, iz);
        if (!fit) continue;
        /* The offset is in the building's OWN frame so it slides along its plot rather than across
           the street. The quaternion carries the street angle already. */
        goff.set(fit.dx, 0, fit.dz).applyQuaternion(gq);
        gp.add(goff);
        gjit.setFromAxisAngle(GY, fit.dRot);
        gq.multiply(gjit);
        gs.set(fit.w, fit.h, fit.d);
        m.compose(gp, gq, gs);
        o.setMatrixAt(i, m);
        grained++;
      }
      o.instanceMatrix.needsUpdate = true;
      /* NOT marked fpHidden and NOT set invisible: the mesh stays in the scene and stays drawn,
         because most of its instances are now the thing filling the gaps. That mark existed only
         to survive applyView's traverse, and there is nothing left for it to protect. */
    });
  });
  d.fpCull = culled;
  d.fpKept = kept;
  d.fpGrain = grained;
  return culled;
}

/* WHAT IS ACTUALLY DRAWING, READ WHEN THE OVERLAY IS BUILT.

   d.fpHid is a count taken at the instant of hiding, and it stayed perfectly truthful for the
   whole time the scene was drawing two cities on top of each other — 135 meshes were hidden, and
   then unhidden, and the number never knew. A count of what is on screen now cannot lie in that
   direction. This is the instrument that would have closed it in one load rather than three. */
function fabricVisible(d){
  let n = 0;
  [d.mass, d.detail].forEach(layer => {
    if (!layer) return;
    layer.children.forEach(o => {
      if (o.isInstancedMesh && o.name !== 'footprints' && o.visible) n++;
    });
  });
  return n;
}

/* HOW MANY BUILDINGS THE GENERATOR IS DRAWING ON THE LAYER THE FOOTPRINTS WOULD REPLACE.

   Instances, not meshes. The mesh count says how many buckets the fabric split into and has no
   relationship to how full the island looks; the instance count is the number of buildings a
   visitor sees. DETAIL ONLY — mass is the same city filtered by height, and adding the two would
   count the tall half twice and make every island look denser than it is.

   This is the denominator the swap is judged against, and having it is the difference between
   "the footprints are thin" as an impression and as a ratio. */
function fabricInstances(d){
  let n = 0;
  const layer = d.detail;
  if (!layer) return 0;
  layer.children.forEach(o => {
    if (o.isInstancedMesh && o.name !== 'footprints') n += o.count || 0;
  });
  return n;
}

async function addFootprints(d){
  if (!FP_ON || !footprintsFor || fpState.has(d.id)) return;
  fpState.set(d.id, 'pending');
  try {
    const list = await footprintsFrom(d);
    if (!list){ fpState.set(d.id, 'none'); return; }
    /* The payload size BEFORE the coastline clip, recorded here because this is the only place
       both numbers exist. raw against kept says whether a thin island is thin because the bake
       returned little or because the clip discarded most of what it returned, and those are
       opposite faults in opposite files. */
    d.fpRaw = list.length;
    const g = footprintsFor(d, list);
    if (!g){ fpState.set(d.id, 'none'); return; }

    /* WHAT THE GENERATOR WAS DRAWING HERE, RECORDED AND THEN REPLACED REGARDLESS.

       v61 turned this into a gate: below half the fabric's instance count the payload was thrown
       away and the island kept its generated city. That was the wrong lever. The design is real
       buildings on every island with the fabric masked and the hand-built attractions kept, so a
       thin payload is a fault to go and fix at the source, not a reason to put the generator back
       and call the island finished.

       The number stays because it is the honest measure of how far short a payload falls — Al
       Maryah's 34 against four thousand generated is the whole complaint expressed as a ratio. It
       just no longer decides anything. */
    d.fpFab = fabricInstances(d);
    /* GAP-FILL, NOT REPLACE. Was hideFabric(d) — every generated mesh off. Now only the instances
       a real building actually stands on are zeroed, so the generated stock survives wherever the
       payload does not reach. See cullFabric for why the two islands failed in opposite ways. */
    cullFabric(d, list);
    d.detail.add(g);
    /* Same order the deferred islands taught us: snapshot and register BEFORE any view touches
       the new meshes, or applyView sets a material to undefined and the render loop dies inside
       projectObject naming neither the mesh nor the island. */
    snapshotMats(g); registerLift(g); applyView(view);
    fpState.set(d.id, 'on');
    /* AFTER the state, never before. applyLOD now asks whether this island swapped in order to
       decide whether its detail layer stays up when the camera leaves, and it reads that from
       fpState — so calling it a line earlier would settle the question with the old answer and
       leave the island dark until the next unrelated state change happened to fix it. */
    applyLOD();
    console.info('footprints ' + d.id + ': ' + d.fpCount + ' (' + d.fpReal + ' real heights, ' +
                 (d.fpZoned || 0) + ' under hand-built landmarks)');
  } catch (e){ noteError('footprints ' + d.id, e); fpState.set(d.id, 'none'); }
}

function buildAndRegister(d){
  /* Same rule as the setDistrict path, and this is the case it matters for: the prefetch builds an
     island a whole leg before the camera arrives.

     The light is in `world` now, so hiding the group costs nothing. */
  if (d !== corniche && d.pending) d.group.visible = false;
  if (!buildIsland(d.id)) return;
  snapshotMats(d.group); registerLift(d.group); fitClip(); applyView(view);
  addFootprints(d);
  addGroundFeatures(d);
}


function attractPrefetch(n){
  const leg = ATTRACT[n % ATTRACT.length];
  if (!leg || !leg.id || !buildIsland) return;
  const d = DISTRICTS.find(x => x.id === leg.id);
  if (!d) return;
  /* THE RACE, AND WHY IT WAS WORTH FIXING RATHER THAN LIVING WITH.

     The ground canvas is painted once, during the build, and never repainted. So whether an island
     shows its real street network or a generated lattice is decided by whether roads-<id>.json
     happened to have arrived at the instant the prefetch fired — and for Al Maryah, built from the
     startup prefetch milliseconds after the page opens, that came down to network weather. Two
     consecutive loads of the identical build read `mary gen` and `mary 459`.

     A hero that renders differently on refresh for reasons the visitor cannot see, cause or avoid
     is not a hero with a bug in it; it is a hero you cannot reason about at all. The prefetch runs
     a whole leg ahead of the camera, so it has seconds to spare — it simply was not spending them.

     Nothing here blocks a frame: the build still happens synchronously when it happens, this only
     moves WHEN. And a user tap still builds immediately through setDistrict, because a stall
     during a committed move is worse than a generated lattice. */
  /* THE ISLAND'S FULL FILE, PREFETCHED THE SAME LEG AHEAD ROADS ALREADY GETS — this is the same
     race whenRoads exists to close below, just for a different fetch. islandGeometry (built
     inside buildAndRegister, synchronously) reads BASE[id].water off entry._data, which
     loadIsland only populates once data/isle-<id>.json has actually landed. Roads getting a head
     start does nothing for water or the mini-islands sitting in it — those live in the FULL
     file, not the roads-only one — so without this, an island's water holes are exactly as
     network-weather-dependent as roads used to be before whenRoads existed, just quieter about
     it: a missed fetch does not fall back to a generated lattice the way roads does, it falls
     back to no water at all, indistinguishable from an island that was never supposed to have
     any. Placed BEFORE the roadsIn check below and not inside either branch of it, because the
     early-return branch (roads already in) would otherwise skip this entirely — this needs to
     fire on every leg regardless of which path the roads check takes. Fired and forgotten, not
     awaited — the geometry build already tolerates data arriving late (the lazy getter just
     returns empty until it does), this only improves the odds it does not have to. */
  const idx = window.__basemapIndex;
  if (idx && BMAP.loadIsland) BMAP.loadIsland(idx, leg.id).catch(() => {});
  if (roadsIn(leg.id)){ buildAndRegister(d); return; }
  whenRoads(leg.id).then(() => { if (d.pending) buildAndRegister(d); });
}

/* AN ISLAND IS READY WHEN THERE IS NOTHING LEFT TO WATCH ARRIVE.

   Built is not enough: under ?fp the footprints land on a promise well after the build returns, and
   the swap from generated fabric to real buildings is the most conspicuous of the three stages. So
   ready means built AND the footprint state settled to something final — on, none or thin. */
function isleReady(d){
  if (!d || !d.built) return false;
  if (!FP_ON) return true;
  const st = fpState.get(d.id);
  return st === 'on' || st === 'none' || st === 'thin';
}

/* ONE LOOKUP FOR BOTH CALLERS, matching label first and osm second — the two names a place can be
   known by, and the reason the first attempt at this failed silently. */
function placeByName(d, nm){
  if (!d || !d.placeAnchors || !nm) return null;
  return d.placeAnchors.find(pl => pl.label === nm) ||
         d.placeAnchors.find(pl => pl.osm === nm) || null;
}

function attractGo(i){
  attract.i = i % ATTRACT.length;
  const leg = ATTRACT[attract.i];
  attract.until = performance.now() + leg.ms;
  attract.hold = leg.hold ? performance.now() + (leg.maxMs || 30000) : 0;
  if (leg.world) setWorld();
  else {
    const d = DISTRICTS.find(x => x.id === leg.id);
    if (d){
      /* A named place on a leg composes a place shot rather than a district one. Looked up by name
         against the island's own anchors, so a landmark leaving the bake degrades to the district
         shot rather than throwing. */
      const a = leg.place && placeByName(d, leg.place);
      if (a) setPlace(d, a); else setDistrict(d);
    }
  }
  /* Next island built during THIS leg, not at the moment it is needed. */
  attractPrefetch(attract.i + 1);
}

function attractStart(){
  if (ATTRACT_OFF || attract.on) return;
  attract.on = true;
  attractGo(attract.i + 1);
}

/* Cancel leaves the camera wherever the flight had reached: the goal is not reset, so the ease
   that was in progress simply finishes and the viewer inherits a composed shot rather than being
   snapped back to wherever they last were. */
function attractStop(){
  attract.on = false;
  attract.lastInput = performance.now();
}
['pointerdown', 'wheel', 'keydown'].forEach(ev =>
  window.addEventListener(ev, attractStop, { passive:true }));

function attractTick(now){
  /* REVEALED WHOLE, NEVER HALF. An island under construction is off camera — the flight is
     elsewhere and the prefetch runs a leg ahead — so hiding it until it has settled costs nothing
     to look at and removes the assembly you could otherwise watch in the distance. Corniche is
     exempt: it is the opening subject, and the hold leg is what covers its build. */
  for (const d of DISTRICTS){
    if (d === corniche || !d.built || d._shown) continue;
    /* The counterpart to the hide above: mass comes back, detail stays under applyLOD's control
       exactly as it was, and the group was never hidden so its light never left the count. */
    if (isleReady(d)){ d.group.visible = true; d._shown = true; }
  }
  if (attract.on){
    /* The hold waits for the island rather than for the clock, up to its ceiling. */
    if (attract.hold && now < attract.hold && !isleReady(activeDistrict)) return;
    if (now >= attract.until) attractGo(attract.i + 1);
    return;
  }
  if (now - attract.lastInput > IDLE_MS) attractStart();
}

/* KICK OFF HERE, not up beside setDistrict(corniche) where it reads more naturally. ATTRACT is a
   const declared in this block, and a const is in the temporal dead zone until its declaration
   runs — referencing it two hundred lines earlier is a ReferenceError, not a hoist. The opening
   shot is already composed by then; this only decides how long it holds before the flight moves.

warmHideAll();

attract.until = performance.now() + ATTRACT[0].ms;

   only touches 126 KB and does not apply to the data files at all.

phase('prefetch');

/* THE FIRST TWELVE FRAME TIMES, KEPT.

   build says the longest task in the whole load was three. Both cannot be true, and traces are no
   longer available from this network — so the arbitration has to happen on the device.

   If frame 1 is nineteen seconds and frames 2 to 12 are single-digit milliseconds, the block is

     buildIsland, which between them touch geometry, textures and materials for an island being
     built for the first time — the most failure-prone call in the file, executed before anything
     is drawn. A throw here stops the camera AND the render, which is a frozen scene, which reads
     as almost any other bug.

     Caught, named, and the loop disabled after the first failure: retrying a throw sixty times a
     second buries the message under its own repeats and would keep the scene frozen anyway. The
     rest of the frame then runs, so what you get is a live scene that has stopped flying and an
     overlay line saying why — which is a bug report rather than a mystery. */
  try { attractTick(performance.now()); }
  catch (e){ noteError('attract', e); attract.on = false; attract.dead = true; }
  /* The first tick only. It is the one that can build an island, and it is the one that has been
     hiding inside firstFrame. Every later tick is a camera update and costs nothing. */
  if (_frame0 && !_tick0Done){ PH.attract0 = performance.now() - _t0tick; _tick0Done = true; }
  const t0 = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  /* DAMPED, framerate-independent. The 1-exp(-k*dt) form is correct at 30fps and 120fps
     alike; a plain lerp by a fixed fraction travels twice as fast on a 120Hz phone, which is
     the usual reason camera feel differs between devices. Damping also means a tap during a
     transition simply re-aims, with no timeline to cancel. */
  const e = 1 - Math.exp(-2.0 * dt);
  cur.target.lerp(goal.target, e);
  cur.dist  += (goal.dist  - cur.dist)  * e;
  cur.elev  += (goal.elev  - cur.elev)  * e;

  /* The idle drift stops the moment the camera is touched. Two things moving the view at once
     reads as a bug, and on a still frame the drift is what makes a held angle look unsteady. */
  /* THE SIGNALS RUN ON WALL TIME, every frame, in every view. It is tempting to skip this at world
     zoom where a lens is sub-pixel — but the tick only writes when an aspect actually changes, so
     the per-frame cost is a loop over 416 signals doing one modulo and one compare, and skipping
     it would mean every junction jumping to a new state the moment an island is tapped. */
  if (tickSignals) tickSignals(t);

  const drift = (state === STATE.WORLD && !orbit.on) ? Math.sin(t * 0.045) * 0.09 : 0;
  const a = cur.angle + drift + orbit.yaw;
  const dist = cur.dist * orbit.zoom;

  /* TWO MEANINGS FOR lift, BECAUSE THE LIT MODES AND THE MAP MODES WANT DIFFERENT THINGS.

     In the lit modes it scales height while horizontal distance stays put — a turntable that can
     be raised. That is why it can never reach overhead however far the clamp is opened: the camera
     climbs but never comes in, so it asymptotes to a steep oblique. Fine for a diorama.

     In Plan and Check it is a PITCH from 0 to 1, and 1 is straight down. The camera swings along an
     arc of constant distance from the target, so the framing holds while the angle changes and the
     top of the arc is genuinely vertical. At 0 it reproduces the lit-mode framing exactly, so
     switching into Check does not move the camera. */
  let elev, horiz = dist;
  if (mapGesture()){
    const base = Math.max(1, (cur.elev - GROUND) * orbit.zoom);
    const r    = Math.hypot(dist, base);
    const a0   = Math.atan2(base, Math.max(1, dist));
    const ang  = a0 + (Math.PI / 2 - a0) * Math.max(0, Math.min(1, orbit.lift));

       up looking down from the height the world view wanted. Floored just above the ground plane:

    elev = Math.max(GROUND + 4, (cur.elev - GROUND) * orbit.zoom * (1 + orbit.lift) + GROUND);

     slides the view across the model without turning it. Kept out of cur.target on purpose: the

  const tx = cur.target.x + orbit.panX, tz = cur.target.z + orbit.panZ;
  camera.position.set(
    tx + Math.sin(a) * horiz,
    elev,
    tz + Math.cos(a) * horiz

     a lerp against an Infinity — propagates into camera.position and every frame after it draws
     nothing. Three comparisons per frame buys a scene that recovers rather than one that is black
     until the page is reloaded, and it says so on the overlay rather than recovering silently. */
  if (!Number.isFinite(camera.position.x + camera.position.y + camera.position.z)){
    noteError('camera', new Error('non-finite position — reframing'));

     would drag the horizon line around with the yaw. */
  if (skyDome.visible) skyDome.position.copy(camera.position);

  /* PICK MARKERS RESCALED HERE, EVERY FRAME, RATHER THAN LEFT AT A FIXED WORLD SIZE.

     A fixed-size sphere read as a reasonable dot at a 186-unit place-shot distance and was
     invisible at the 4191-unit district overview — both times the point was actually recorded
     correctly, which is the giveaway that this was never a data problem. A first attempt to fix
     it reached for Sprite + sizeAttenuation, which promises constant screen size, but that
     property has documented inconsistencies across camera setups and I could not verify its exact
     pixel behavior without a live renderer to check against. This does the same job with ordinary
     mesh scale and arithmetic I can reason about exactly: distance from camera to marker, times
     the tangent of the half-FOV, is the world-space size one screen-height covers at that
     distance — scaling the marker by that quantity holds its ON-SCREEN size constant at any zoom,

    const fovRad = cur.fov * Math.PI / 180;

  if (scene.fog && fogKey){

    // the moment anything is zoomed.
    const camDist = Math.hypot(dist, elev - GROUND);
    const f = fogFor(camDist, fogKey);

    camera.fov = cur.fov; camera.updateProjectionMatrix();

  for (let i = 0; i < waterPos.count; i++){
    const x = waterBase[i*3], y = waterBase[i*3+1];

       change to the sea.

       Peak displacement was 0.97 units. At 7.8 metres to the unit that is a 7.6-metre swell —
       fifteen metres crest to trough — in water holding seventy moored boats. It read as
       plausible while the coast was a wall, because a wall does not care where the waterline is.

       A beach is nothing BUT where the waterline is. The foam band and the dark band under it
       span y +0.06 to -0.06: 0.12 units, 94 centimetres, and the sea was moving sixteen times
       that. The shoreline swept across 9.2 of the beach's 12 units, 77 per cent of its width, so
       at a crest the water climbed to the sea wall and at a trough it drained off the outer edge
       and exposed the dark submerged rings. Every band in that profile was being alternately
       drowned and stranded, several times a second. No colour or width change could have fixed
       it — the bands were correct and the sea was washing over all of them.

       At 0.15 peak the sweep is 2.0 units and lands on the foreshore, with the foam band inside
       it. 1.2 metres of swell, which is a real day in the Gulf.

       and the geometry is only carrying the long shape underneath it. */

     look like the sea was moving in two unrelated ways. */
  if (waterNormal){
    // Rates raised with the tile: the offset is in UV, so a 188-unit tile moving at the old rate
    // would drift half again as slowly across the water as it used to.
    waterNormal.offset.set(t * 0.0092, t * 0.0058);
    // Eased rather than switched: the camera flight between world and district takes about a
    // second, and a sea that changes surface in one frame during it is worse than either end.
    if (Math.abs(rippleNow - rippleGoal) > 0.002){

     pass and the composer's target allocation, and the probes then measure the second, third and
     fourth renders, which are cheap because this one already paid. That is how upload came back at
     81 ms inside a firstFrame of 19,840.

     prefetch and attract0 both read zero, so this call and the wait to reach it are the only things
     left in the span. Naming it costs one variable. */
  /* SPLITTING THE FIRST FRAME INTO PIPELINE AND SCENE.

     only difference is whether the scene is in it.

       three candidates left inside one composer.render(): geometry and texture upload, the first
       shadow pass, and the composer's own target allocation. Each step adds exactly one thing to
       the one before it, so the DIFFERENCES are the costs:

         f0post    composer.render()                -> adds the post chain's targets

       this device that is not free. Read them as a ladder, not as absolutes — the duplicate
       program set is still linked and still lands in f0plain, which is exactly why this is a flag

         cannot tell them apart. Four generations of the same buildings are parented in this scene
         — landmass, generated fabric, Overture footprints, bespoke landmarks — and a later one
         superseding an earlier one hides it rather than removing it. If the cost scales with what
         is DRAWN, the visible column explains it. If it scales with what is RESIDENT, the hidden
         column does, and no amount of hiding will ever touch it. */
      let _vm = 0, _vt = 0, _hm = 0, _ht = 0;
      const _triOf = o => {
        const g = o.geometry;
        if (!g) return 0;
        const n = g.index ? g.index.count : (g.attributes && g.attributes.position
                                             ? g.attributes.position.count : 0);
        return (n / 3) * (o.count || 1);

      F0INFO.visTri = Math.round(_vt);

      F0INFO.hidTri = Math.round(_ht);

         they have four different owners. A mesh can carry more than one mark; counted separately
         on purpose, so overlapping authorities show up as columns that do not sum to hid. */
      let _byWarm = 0, _byFp = 0, _bySelf = 0;
      scene.traverse(o => {
        if (!o.isMesh || _visibleChain(o)) return;
        if (o.userData.warmHidden) _byWarm++;
        if (o.userData.fpHidden) _byFp++;
        if (!o.visible && !o.userData.warmHidden && !o.userData.fpHidden) _bySelf++;

      F0INFO.byFp = _byFp;
      F0INFO.bySelf = _bySelf;

      F0INFO.tex0 = renderer.info.memory.textures;

         links 3 programs, and costs twenty-one seconds. Nothing about that is geometry, draw count
         or linking. Whatever it is is attached to one of five objects, or to the first render
         itself, and five is small enough to test exhaustively rather than argue about.

         Same principle as warm1 and for the same reason: a marker around a call cannot attribute
         cost the driver has deferred past it, but a DIFFERENCE BETWEEN SCENES can. Hide all five,
         render — that is the background and the driver's own first-render cost, with no mesh in
         it. Then reveal exactly one, render, and the difference is that mesh's first draw. There

     permanently unreachable, and I spent a round trip wondering why the diagnostics were silent.
     A single flag, cleared in exactly one place, cannot fail that way. */

       stage. three.js calls it per program, and every call is a synchronous round trip to the GPU
       driver that stalls the main thread until the driver answers.

       Turned off HERE rather than at renderer construction, so every program built during startup
       is still validated and a genuine compile failure still reaches the console with a shader
       source dump. What is given up is diagnosis of a shader that fails later — and a material
       created after this point is a variant of a family that already compiled, so the realistic

       first attractTick ever ran, and the loop advanced immediately — Corniche appeared and was
       gone, and the flight opened on Al Maryah.

       with view modes: 53 with Corniche alone, 74 after Al Maryah, 85 after Al Reem, 96 after

    const _mat = _warmLast.material && (Array.isArray(_warmLast.material)

        '   view ' + view + '\n' +
      'tris   ' + info.render.triangles + '   calls ' + info.render.calls + '\n' +
      /* GROUND FEATURES, ON THE OVERLAY AND NOT ONLY IN THE PROGS DUMP. The first version of this
         line went into the vProg click handler, which is a dump you have to ask for — so the one
         row that says whether the golf course, the circuit and the real parkland loaded at all
         was invisible on the screen you actually watch. Per island: state, then t tracks,
         g golf rings, p parkland polygons. */
      /* COMPACT, because the first version ran off the right edge of a phone screen and the part
         that fell off was the track count — the one number the row exists to show. Two-letter ids,
         and 'on' is implied by there being counts at all. */
      'gf     ' + DISTRICTS.map(x => {
        const st = gfState.get(x.id), t = x.id.slice(0, 2);
        return st === 'on'
          ? t + (x.trackN ? ' t' + x.trackN : '') + (x.golfN ? ' g' + x.golfN : '') +
                (x.parkRealN ? ' p' + x.parkRealN : '') +
                /* Yas Bay land-use cells. On the gf row because that is where they are built and
                   where they would go missing — a `b` that never appears means the block did not
                   run, which is exactly the failure the first version had and nothing reported. */
                (x.baySurf ? ' b' + x.baySurf : '')
          : t + ' ' + (st || '-');
      }).join('  ') + '\n' +
      /* PROGRAMS, because compile came back at 23,681 ms and nothing on this overlay said why.

         twenty-four second compile is a program count problem, and the program count was the one
         thing renderer.info exposes that was not on screen. three.js caches by program key, so
         this is the number of DISTINCT material configurations in the scene, not the mesh count.

         generated-fabric InstancedMeshes are still parented, still walked by compileAsync, and
         still compiled, to be never drawn. */
      'geo    ' + info.memory.geometries + '   tex ' + info.memory.textures +
        '   prog ' + (info.programs ? info.programs.length : '?') + '\n' +
      'props  ' + propCount.palms + ' palm  ' + (propCount.shrubs||0) + ' shrub  ' + propCount.lamps + ' lamp  ' +
        propCount.cars + ' car  ' + propCount.boats + ' boat  ' +
        (propCount.signals || 0) + ' signal\n' +
      'build  ' + B_NAV + ' / ' + B_CITY + ' / ' + B_WORLD + ' / ' + B_PROPS + '\n' +
      /* WHICH NETWORK IS ON THE GROUND, ON SCREEN. Stage 2 shipped and then sat unverified,
         because the only way to answer "are these real centrelines" was to look at the painted
         texture and judge it by eye — which is exactly the sort of question a build should be
         able to answer about itself. One line: per island, real or generated, with the centreline
         count when it is real. dispScale is here for the same reason. It is the number three
         separate bugs came out of and it was visible nowhere. */
      'roads  ' + DISTRICTS.map(d => d.id.slice(0,4) + ' ' +
        (!d.built ? '-' : d.roadsReal ? String(d.roads.drawArterials.length) : 'gen') +
        (d.dispScale && Math.abs(d.dispScale - 1) > 0.01
          ? ' x' + d.dispScale.toFixed(1) : '')).join('  ') + '\n' +
      /* HOW MANY ANCHORS THE BAKE NAMED, per island, and whether the shot is framing them or
         falling back to the coastline. An anchor the bake missed keeps a stale authored position
         near the island centre and looks like a landmark that happens to be central. */
      /* ONE LINE PER ISLAND, BECAUSE FIVE ON ONE ROW RAN OFF THE SCREEN.

         This row carries four numbers per island and the pane is 55 characters wide on a folded
         Z Fold, so it truncated at Al Maryah and reem, saad and yas were never legible on the
         device the build is judged on. A diagnostic nobody can read is worse than one that does
         not exist: it looks like coverage. Every other row here fits because it carries one
         short token per island; this one does not, so it wraps instead of pretending.

         The gutter is blank after the first line, so the label column still reads as one field
         rather than five. */
      (FP_ON ? DISTRICTS.map((d, i) => {
        const head = (i ? '       ' : 'fp     ') + d.id.slice(0,4).padEnd(5);
        const st = fpState.get(d.id) || '-';
        if (st !== 'on') return head + st;
        /* raw>kept says what the clip cost, kept/fab says whether the swap was worth making, and
           the last field says what was decided. Every number the decision used is on the line, so
           the threshold can be argued with rather than trusted. */
        return head + (d.fpRaw || 0) + '>' + (d.fpCount || 0) + '/' + (d.fpReal || 0) + 'r' +
          (d.fpZoned ? ' z' + d.fpZoned : '') +
          (d.fpMerged ? ' m' + d.fpMerged : '') +
          ' fab' + (d.fpFab || 0) +
          /* WAS hid<n>/<n>v, AND IT WENT BLIND WHEN hideFabric BECAME cullFabric. fpHid was a count
             of whole meshes switched off, and nothing switches whole meshes off any more, so it
             printed hid0 on every island regardless of what the cull did. Two loads were read
             against a number that could no longer move.

             tests, and how many were zeroed for being either on top of a real building or too far
             from one to be plausible. kept is what is actually filling the gaps. */
          /* ROOFS BEFORE keep/cull, because the keep/cull pair is what runs off the right edge of a

          (d.fpRoof ? '  roof' + d.fpRoof : '') +
          '  keep' + (d.fpKept || 0) + '/cull' + (d.fpCull || 0) +
          /* HOW MANY SURVIVORS WERE RESIZED TO THE LOCAL GRAIN. Zero on an island that reads as a
             street wall means the signal never fired - too few neighbours, or neighbours bigger
             than GRAIN_MAX_S - and that is a threshold to move, not a renderer to open. */
          (d.fpGrain ? '/grain' + d.fpGrain : '') +
          '  ' + fabricVisible(d) + 'v' +
          /* THE TWO NUMBERS THE VACANCY MASK IS JUDGED ON, and the reason it can ship behind a
             flag rather than behind a day of bisecting.

               park   lawn blobs groundPlan emitted. The mask removes cells, and cell-free ground
                      is exactly what the park filler claims, so a jump here means the suppression
                      in groundPlan is not biting and the island is going green.
               clash  real buildings standing on ground the mask cleared. The zones are hand-placed
                      guesses; a large number means one is in the wrong place, and which island it
                      is on is on the same line.

             decides anything on its own — they exist so the decision is made against a figure
             instead of against an impression of a screenshot. */
          (VAC_ON ? '  park' + ((d.plan && d.plan.parkN) || 0) +
                    ' clash' + (d.fpClash || 0) : '');
      }).join('\n') + '\n' : '') +
      'marks  ' + DISTRICTS.map(d => d.id.slice(0,4) + ' ' +
        (d.marksHit == null ? '?' : d.marksHit + '/' + d.marksOf) +
        (d.shot && d.shot.r < d.r ? '*' : '')).join('  ') + '\n' +
      /* V, WHICH THE OVERLAY NEVER SHOWED. The four stamps tell you which module CONTENT is

         forgotten bump and a Pages cache miss looked identical from here. */
      /* THE BUILD BREAKDOWN, ON SCREEN RATHER THAN IN THE CONSOLE. This is authored on a phone,

         a desktop debugger is a timing nobody will look at. Top four stages, one line. */
      /* ONE STAGE PER LINE. The single-line version ran off the right edge of a folded phone and
         showed four of eight, which is how a measurement turns into another guess: the two stages
         that were visible accounted for three seconds of fourteen and I could not see where the
         other eleven went. Pairs per line, so it fits and still reads. */
      /* WRAPPED, LIKE THE STAGES, and for the same reason — which I had just fixed one line below
         and then reintroduced here. A single line of seven phases runs off a folded phone at the
         fourth, and the fourth was the one that mattered. */
      (() => {
        const rows = Object.keys(PH).filter(k => k[0] !== '#')
          .map(k => [k, Math.round(PH[k])]).sort((a, b) => b[1] - a[1]);
        let out = '';
        for (let i = 0; i < rows.length; i += 2){
          out += (i ? '       ' : 'phase  ') +
            rows.slice(i, i + 2).map(([k, v]) => (k + ' ' + v).padEnd(24)).join('') + '\n';
        }
        return out + '       total ' + Math.round(PH['#page'] || 0) + ' ms   ' +
               (PH['#mpx'] ? PH['#mpx'].toFixed(0) + ' Mpx tex' : '') + '\n';
      })() +
      (PERF ? (() => {
        const rows = Object.keys(PERF).filter(k => k[0] !== '#')
          .map(k => [k, Math.round(PERF[k])]).sort((a, b) => b[1] - a[1]);
        const named = rows.reduce((a, r) => a + r[1], 0);
        rows.push(['(rest)', Math.max(0, Math.round(PERF['#total'] || 0) - named)]);
        let out = '';
        for (let i = 0; i < rows.length; i += 2){
          out += (i ? '       ' : 'stages ') +
            rows.slice(i, i + 2).map(([k, v]) =>
              (k + ' ' + v).padEnd(24)).join('') + '\n';
        }
        return out;
      })() : '') +
      /* THE LOOP, ON SCREEN. "It stopped flying" has three causes that look identical from the
         outside — the flag is set, the user touched something, or it threw — and the overlay
         could distinguish none of them. */
      'cam    aspect ' + (camera.aspect || 0).toFixed(2) + '  dist ' + Math.round(cur.dist) +
        '  elev ' + Math.round(cur.elev) + '  fov ' + Math.round(camera.fov) +
        '  clip ' + Math.round(camera.near) + '/' + Math.round(camera.far) + '\n' +
      /* WHERE THE CAMERA IS AND WHERE THE SUBJECT IS, which is the pair that decides whether a
         black frame means "aimed at nothing" or "aimed at something that is not being drawn".
         Every other number on this overlay is consistent with a working scene, so the fault is
         in a relationship between two of them and none of the two were visible.
         The island's own centre and displayed radius sit alongside, because the question is
         whether the target is anywhere near the land. */
      'aim    cam ' + [camera.position.x, camera.position.y, camera.position.z]
          .map(v => Math.round(v)).join(',') +
        '  tgt ' + [cur.target.x, cur.target.y, cur.target.z].map(v => Math.round(v)).join(',') +
        (activeDistrict ? '\n       isle ' + Math.round(activeDistrict.x) + ',' +
            Math.round(activeDistrict.z) + '  r ' +
            Math.round(activeDistrict.r * (activeDistrict.dispScale || 1)) +
            '  shot ' + (activeDistrict.shot
              ? Math.round(activeDistrict.shot.x) + ',' + Math.round(activeDistrict.shot.z) +
                ' r' + Math.round(activeDistrict.shot.r) : '-') +
            '  vis ' + (activeDistrict.detail && activeDistrict.detail.visible ? 'detail' : 'mass') +
            ' ' + ((activeDistrict.detail && activeDistrict.detail.children.length) || 0) : '') +
        '\n' +
      'loop   ' + (ATTRACT_OFF ? 'off (?still)'
        : attract.dead ? 'DEAD'
        : attract.on ? ('leg ' + attract.i + ' ' + (ATTRACT[attract.i].id || 'world') + '  next in ' +
            Math.max(0, ((attract.until - performance.now()) / 1000)).toFixed(1) + 's')
        : ('stopped, idle ' + ((performance.now() - attract.lastInput) / 1000).toFixed(0) + 's')) + '\n' +
      (ERR.msg ? 'ERROR  ' + ERR.msg + (ERR.n > 1 ? '  (x' + ERR.n + ')' : '') + '\n' : '') +
      (PICK.mode !== 'off' ? 'pick   ' + PICK.mode + '(' + PICK.points.length + ')' +
        (PICK.points.length
          ? '  ' + JSON.stringify(PICK.points.map(pt => [pt.x, pt.z]))
          : '  tap the ground') + '\n' : '') +
      /* ?marks LISTS WHAT THE BAKE ACTUALLY CALLS THINGS.

         marks says reem 0/3 and saad 1/3, which tells us the match failed and nothing else. The
         match is our display label against a key in the baked landmark table, so the fix is a
         PLACE_OSM entry — and writing one without seeing the key is guessing at a proper noun and
         committing it. The names are sitting in index.json, which is already in memory; the only
         reason they were unreadable is that nobody printed them, and there is no console on this
         device to print them to.

         A URL flag rather than a build constant, for the same reason ?drawn and ?still are. */
      (location.search.includes('marks') ? (() => {
        try {
          const idx = window.__basemapIndex;
          if (!idx) return 'names  no basemap index\n';
          let out = '';
          for (const d of DISTRICTS){
            const e = (idx.islands || []).find(i => i.id === d.id);
            const keys = Object.keys((e && e.landmarks) || {});
            const miss = (d.places || []).filter(p => p.baked === false).map(p => p.label);
            out += (out ? '       ' : 'names  ') + d.id + '  bake: ' +
                   (keys.length ? keys.join(', ') : 'none') + '\n';
            if (miss.length) out += '         missed: ' + miss.join(', ') + '\n';
          }
          return out;
        } catch (e){ return 'names  ' + e.message + '\n'; }
      })() : '') +
      'cache  ' + V + '   shadow ' + shadowNote + '\n' +
      // The number to tune against, on the device rather than in an estimate.
      'frame  ' + ftStat;
  }
}
frame();

window.W2H = {
  world: setWorld,
  view: applyView,
  build: [B_NAV, B_CITY, B_WORLD, B_PROPS].join(' / '),
  go: id => { const d = DISTRICTS.find(x => x.id === id); if (d) setDistrict(d); },
  tilt: v => tiltPass.uniforms.amount.value = v,
  DISTRICTS, goal, cur,
};

} catch(e){ fail('module top level', e); }
</script>
</body>
