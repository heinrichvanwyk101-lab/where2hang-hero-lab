<title>Where2Hang — Abu Dhabi World</title>

<!--
  PASTE TARGET: where2hang-hero-lab/world-nav.html

  SPLIT INTO THREE FILES, because a 950-line single file had become impossible to paste by hand
  on a phone — and hand-pasting on a phone is the actual authoring loop on this project, so it
  is a real constraint, not a tidiness preference.

      world-nav.html   this file. Shell, styles, renderer, lighting, camera states, UI, post.
      w2h-city.js      the building kit: window textures, materials, landmarks, tower types.
      w2h-world.js     island outlines, urban fabric, the district table, world assembly.

  All three must be committed together the first time. After that, a landmark change touches
  w2h-city.js alone and the other two never move.

  ===========================================================================
  FIVE ISLANDS, ONE FINISHED

  Corniche is built at full quality using the real landmark code from home-world.html —
  Emirates Palace, Etihad Towers, ADNOC HQ, the graded city rows. The other four are
  placeholder massing.

  That asymmetry is the point of this build. One finished island sitting beside four crude
  ones makes the quality gap visible and, more usefully, makes the COST of that gap
  measurable: watch the triangle count and the frame rate when Corniche's detail layer
  switches on, and you will know what the remaining four actually cost before committing to
  building them.

  ===========================================================================
  LOD IS A SWAP, NOT AN ADDITION

  Every district carries two mutually exclusive layers:

    mass    cheap silhouette. Visible when the district is NOT active.
    detail  full landmarks. Visible when it IS.

  They are never both on. An earlier draft of this had detail simply added on top of mass,
  which doubles the geometry precisely at the moment the camera is closest and the budget is
  tightest. Swapping means the peak cost is one detailed district plus four silhouettes, no
  matter how rich any single island becomes.

  ===========================================================================
  DISTRICTS ARE AUTHORED AT LOCAL ORIGIN

  Every district's contents are built around (0,0) and the GROUP is positioned. This is why
  Corniche's landmarks drop in unchanged: home-world.html built them around origin too. Author
  in world coordinates instead and every island becomes impossible to move, reuse or hand to
  a different scene — which is the thing that makes hand-built city projects calcify.

  ===========================================================================
  THE GROUND DATUM LIVES IN w2h-world.js

  GROUND is exported, not written down here. It is derived from the island extrusion
  (depth + bevelThickness = 2.9), which is where the top face of every island actually is.
  Camera targets, label heights and the district tap plane all read it, so changing the island
  profile moves the whole scene together instead of leaving the UI half a building behind.

  ===========================================================================
  PORTRAIT FRAMING, THE CONSTRAINT THAT SHAPES THE LAYOUT

  On a phone the horizontal field is tiny: at 52 degrees vertical and a 0.46 aspect, the
  horizontal half-angle is about 13. Spreading five islands east-to-west would push the camera
  so far back they became specks. So the layout leans NORTH-SOUTH, using the depth of the
  frame rather than its width. That is also roughly true to the real geography, which runs
  diagonally — the constraint and the map happen to agree.
  ===========================================================================
-->

<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<script type="module">
const errEl = document.getElementById('err');
function fail(where, e){
  errEl.style.display='block';
  errEl.textContent = where + '\n' + (e && e.stack ? e.stack : e);
  console.error(where, e);
}
window.addEventListener('error', ev => fail('window', ev.error || ev.message));

import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass }        from 'three/addons/postprocessing/SMAAPass.js';

try {

/* ===========================================================================
   ONE VERSION STRING, ONE PLACE.

   Pages caches modules hard enough that a redeploy is regularly invisible, and three debugging
   rounds went into reading screenshots of code that had never shipped. So every local module is
   fetched with ?v=N and N moves when anything changes.

   DYNAMIC IMPORTS, because static ones cannot take a variable. That is not a workaround, it is
   the point: with the specifier built from V, w2h-world.js no longer needs its own copy of the
   version — it takes C and rnd as arguments instead of importing them — and there is exactly
   one string to edit. Previously the same number lived in four files and had to match, or the
   city kit would be evaluated twice and its shared random seed split in two.

   The BUILD stamps are per-file CONTENT revisions and deliberately do not track V. A reading of
   'nav v10 / city v9 / world v10 / props v9' means city and props have not changed since v9 and
   do not need re-pasting — the version bump only forces the browser to refetch them.

   ---------------------------------------------------------------------------------------------
   V IS A TIMESTAMP NOW, AND THE HAND-EDITED NUMBER IS GONE.

   It sat at 16 through six module drops. Four of them were diagnosed from screenshots of code
   that had never loaded, because a forgotten bump and a working deploy look identical from the
   outside — and worse, they are INTERMITTENT: Pages serves assets with max-age 600, so whether a
   drop appeared depended on how long ago the last one was fetched. That is the least debuggable
   failure mode there is.

   No browser-side trick fixes it either, and it is worth being precise about why. The page URL
   and the module URLs are independent requests. Loading world-nav.html?x=2 forces a fresh copy of
   the PAGE; that page then executes this line and asks for ./w2h-world.js?v=16, exactly the URL
   it asked for last time, which is exactly the copy already in cache. The stale specifier is
   baked into the source, so the source is the only place it can be fixed.

   Date.now() makes every load a URL no cache has seen. The cost is that modules are never cached
   at all — about 126 KB refetched per reload across the four files. That is the wrong trade for
   production and obviously the right one for a lab that gets reloaded thirty times a day.

   TO PIN A BUILD, replace it with a literal: const V = '?v=31'. Worth doing when profiling, so
   the numbers are not measured against a cold fetch every time.
   =========================================================================== */
/* PHASE TIMING FOR THE PAGE, because the stage timing inside buildWorld answered a different
   question than the one being asked.

   buildWorld measured 3,287 ms of a fourteen second load. Everything else — fetching four modules,
   generating the city kit's window textures, the PMREM environment map, shader compilation and the
   first render — was outside it and therefore invisible. Textures went from 97 to 338 over the same
   change, which is a hint but not a measurement, and I have already spent one round trip on a
   confident guess about paintGround that was wrong.

   Same discipline one level up: mark the phases, put them on screen, then decide. */
const PH = {}; let _phT = performance.now();
const phase = name => { PH[name] = performance.now() - _phT; _phT = performance.now(); };
const PAGE_T0 = performance.now();

const V = '?v=' + Date.now();
const CITY  = await import('./w2h-city.js'  + V);
const WORLD = await import('./w2h-world.js' + V);
const PROPS = await import('./w2h-props.js' + V);
const BMAP  = await import('./w2h-basemap.js' + V);
phase('import');

/* THE BASEMAP, FETCHED BEFORE THE WORLD IS BUILT.

   data/index.json is the artefact tools/bake-city.mjs commits: one shared metric frame for the
   emirate, every island's true coastline and extent. About forty kilobytes, because the outlines
   live in the index and the roads and buildings do not — the world view draws five silhouettes
   and needs nothing else until the camera goes somewhere.

   FAILING SOFT IS DELIBERATE. If the fetch fails, basemap stays null, buildWorld falls back to
   the hand-drawn ISLE_SHAPES and the scene renders as it did in v77. A hero section that shows
   nothing because a JSON 404'd is a worse outcome than one showing a slightly wrong coastline,
   and the console line says which happened.

   ?debug ALSO ACCEPTS ?drawn, which forces the old path with the data present. That is the toggle
   that makes a fault attributable: same build, same camera, coastlines the only difference. */
let basemap = null;
if (!location.search.includes('drawn')){
  try {
    const idx = await BMAP.loadIndex('data/');

    /* CORNICHE'S ROADS BEFORE THE BUILD, the other four after.

       The ground canvas is painted while an island is built, so its centrelines have to be in hand
       first — there is no repainting it later without throwing the texture away. Corniche is the
       island the hero opens on, so its roads are the one thing worth blocking the first frame for:
       a few hundred kilobytes against the 2.7 MB island file they were split out of.

       The rest are fetched without awaiting. Each outer island is built the first time the camera
       commits to it, which is at least a leg of the attract loop away — long enough for a fetch
       this size, and if one has not landed the island simply paints generated roads and the flight
       does not stall waiting for it. */
    try { await BMAP.loadRoads(idx, 'corniche'); }
    catch (e){ console.warn('roads corniche:', e.message); }

    const isles = BMAP.sceneIslands(idx, 0);
    window.__basemapIndex = idx;

    /* AN EMPTY TABLE IS A FAILURE, NOT A BASEMAP, and the first deploy proved why this check has
       to exist. index.json was a bake old — it carried counts.outline but no outline array — so
       sceneIslands skipped every island and returned {}. `opts.basemap || null` then saw an object,
       called it present, and buildWorld fell back island by island to the drawn shapes. The scene
       rendered exactly as v77 and said nothing. Twenty minutes went into looking for a fault in
       geometry that had never been reached.

       Silence is the bug. Fall back if you must, but say which and say why. */
    const n = Object.keys(isles).length;
    if (!n){
      console.warn('basemap: index.json has no outlines — re-run the bake Action. ' +
                   'Falling back to drawn shapes.');
    } else if (n < (idx.islands || []).length){
      console.warn('basemap: only ' + n + ' of ' + idx.islands.length +
                   ' islands have outlines; the rest fall back to drawn shapes.');
    }
    if (n){
      basemap = isles;
      console.info('basemap: ' + n + ' islands — ' +
        Object.entries(isles).map(([k, v]) =>
          k + ' r=' + Math.round(v.r) + ' x' + v.scale.toFixed(2)).join('  '));
    }
  } catch (e){
    console.warn('basemap unavailable, falling back to drawn outlines:', e.message);
  }
}
phase('basemap');
const { C, createCityKit, rnd } = CITY;
const { buildWorld, GROUND }    = WORLD;
const { createPropKit }         = PROPS;
const B_NAV = 'nav v58', B_CITY = CITY.BUILD, B_WORLD = WORLD.BUILD, B_PROPS = PROPS.BUILD;

const DEBUG = location.hash.indexOf('debug') >= 0;

/* WITH THE OTHER URL FLAGS, AND THAT POSITION IS THE FIX.

   These were declared next to the functions that read them, about 250 lines below the opening
   shot. addFootprints is a function declaration and hoists; a const does not. So setDistrict on
   Corniche — the one island built eagerly, before the attract loop exists — reached FP_ON while
   it was still in its temporal dead zone and threw. The other four islands worked, because they
   are built later, by which time the line had run.

   A fault that hits exactly one of five cases and looks like a data problem on the other four.
   The error trap named it in one load; without it this would have read as "Corniche has no
   footprints" and sent me looking at the bake. */
const FP_ON = location.search.includes('fp');
const fpState = new Map();          // id -> 'pending' | 'on' | 'none'
if (DEBUG) document.getElementById('dbg').classList.add('on');


/* ---------- renderer ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;

/* SIZE THE DRAWING BUFFER NOW, WHILE THE SCENE IS EMPTY. This one line was 5,463 ms of a fourteen
   second load — more than building the entire city, and the largest single cost in the page.

   resize() ran after buildWorld and after compile, by which point 17 Mpx of textures and three
   million triangles were resident on the GPU. renderer.setSize reallocates the WebGL drawing
   buffer, and reallocating it forces the driver to revalidate everything already uploaded against
   the new framebuffer. The three composer sizings in the same function measured 0 ms each — it was
   only ever this call, and only because of when it happened.

   Called here the buffer is allocated against nothing, which is free. resize() still runs later
   for the composer targets and still handles every subsequent orientation change; setSize is
   idempotent, so the second call with the same dimensions costs nothing.

   The size cannot come from resize() itself because the composer does not exist yet — that is why
   the call was down there in the first place, and why splitting it is the whole fix. */
{
  const t = performance.now();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  PH['r.setSize@empty'] = performance.now() - t;
}


const scene = new THREE.Scene();
scene.background = new THREE.Color(C.night);
scene.fog = new THREE.FogExp2(C.haze, 0.0013);

// FOV is interpolated between states. Wider high up, tighter close in — that change is what
// makes descending feel like moving through space rather than scaling an image.
const camera = new THREE.PerspectiveCamera(52, 1, 1, 6000);

/* ---------- environment ----------
   A GRADIENT SKYBOX, not a flat clear colour. The reference render's horizon is doing half the
   lighting work: the band of warm light where the sea meets the sky is what makes the water
   read as water and gives every glazed face something to reflect. A flat background colour can
   never produce that, however carefully the lights are placed.

   Canvas row 0 is the zenith after the default flipY, so the stops read top-down: sky, haze,
   horizon, sun band, ground. The two mode textures share one builder because the only real
   difference between night and dusk here is where the warm band sits and how wide it is. */
function skyTexture(stops){
  const cv = document.createElement('canvas');
  cv.width = 32; cv.height = 256;
  const g = cv.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  stops.forEach(st => grd.addColorStop(st[0], st[1]));
  g.fillStyle = grd; g.fillRect(0, 0, 32, 256);
  const t = new THREE.CanvasTexture(cv);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const nightSkyTex = skyTexture([
  [0.000,'#04080C'],[0.400,'#0B1A24'],[0.485,'#1E333E'],
  [0.515,'#2A2317'],[0.700,'#080D12'],[1.000,'#03060A']]);
/* BELOW THE HORIZON IS SEA. The obvious thing to paint under a sky is ground, and it is wrong
   for this scene: the camera is always over water looking at islands, so every ray that misses
   the water plane should still land on something that looks like sea. Painting it brown put a
   band of desert across the far half of the frame and there was no waterline anywhere. */
const duskSkyTex = skyTexture([
  [0.000,'#2A5A86'],[0.300,'#6E9CC0'],[0.440,'#C6D6DE'],[0.492,'#F7D4A2'],
  [0.512,'#C9A882'],[0.560,'#5A6C79'],[1.000,'#28343E']]);

const pmrem    = new THREE.PMREMGenerator(renderer);
const nightEnv = pmrem.fromEquirectangular(nightSkyTex).texture;
const duskEnv  = pmrem.fromEquirectangular(duskSkyTex).texture;

/* ---------- lighting ---------- */
/* NIGHT WAS DARK BECAUSE OF THE ALBEDOS, AND THE FOG WAS FINISHING THE JOB.

   Working it through rather than guessing. The night stone is 0x161C22, which is a LINEAR
   luminance of 0.0112 — one per cent. A vertical wall sees roughly half the hemisphere, so with
   the old rig its irradiance was about 0.031, and 0.031 x 0.0112 is 3.5e-4. Three ten-thousandths.
   The buildings were not badly lit, they were effectively black by construction, and every window
   was floating on nothing.

   Then the fog took what was left. Night ran the HIGHEST density of the three modes at 0.0013,
   toward 0x241D15 — near black — so at world range the far islands were 88 per cent faded into
   darkness. That is backwards twice over: at night the subject is self-luminous, the air scatters
   city glow rather than absorbing it, and the far islands should be the LAST thing to go.

   So: the hemisphere carries more and reaches further round, the moon comes up, and the night fog
   drops to the weakest of the three rather than the strongest. The albedos themselves are left
   alone — they are what keep the windows dominant, which is the whole design of the night mode.
   Sea and sand stay dark because their albedos are darker still: water is 0.0029, a quarter of
   the stone, so lifting the ambient lifts the city about four times as much as it lifts the
   water. That separation is the aerial-photography look, and it comes free from the palette. */
const hemiNight = new THREE.HemisphereLight(0x2A4A5C, 0x1A2229, 1.55);
scene.add(hemiNight);

const moon = new THREE.DirectionalLight(0xA8C8DA, 0.92);
moon.position.set(-320, 220, -260);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.near = 40;
moon.shadow.camera.far  = 1600;
// Wide enough to cover all five islands. Coarse per-texel, but at world scale the shadows are
// only reading as soft contact darkening under the masses, not as legible shapes.
moon.shadow.camera.left = -340; moon.shadow.camera.right =  340;
moon.shadow.camera.top  =  340; moon.shadow.camera.bottom = -340;
moon.shadow.bias = -0.0009;
moon.shadow.normalBias = 0.6;
scene.add(moon);

/* THE COUNTER-KEY, AND WHY IT STAYS LOW.

   The moon runs (-320, 220, -260), so it lights the -x and -z walls and leaves +x and +z on
   ambient alone. This light exists to cover those two faces and at 0.26 against the moon's 0.92
   it was doing it at a third of the strength — which is most of why the city reads from the ADNOC
   approach and goes to silhouette from the opposite side. 0.46 puts the shaded faces at roughly
   half the moonlit ones, which is a night-time ratio rather than a daylight one.

   THE ELEVATION IS NOT A FREE PARAMETER. At y 60 this light grazes: its direction is 0.18 in y,
   so a horizontal surface takes a fifth of what a wall takes. Raise it towards the moon's height
   and the sea comes up with it, which is the one thing the whole night palette is arranged to
   avoid. Intensity is the lever here; elevation is not. */
const rim = new THREE.DirectionalLight(C.teal, 0.46);
rim.position.set(220, 60, 240);
scene.add(rim);

/* THE KEY LIGHT, shared by Day and Dusk rather than one each. Both want a low raking sun and
   both want shadows; two directional lights would mean two 2048 shadow maps resident for the
   whole session to save four property assignments in a function that runs on a button press.
   Low and to one side, never overhead — a raking light is what makes massing legible, and a
   light down the view axis flattens the whole model into a plan drawing. */
const sun = new THREE.DirectionalLight(0xFFD9A8, 3.0);
sun.position.set(-380, 210, 260);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 40; sun.shadow.camera.far = 1600;
sun.shadow.camera.left = -340; sun.shadow.camera.right =  340;
sun.shadow.camera.top  =  340; sun.shadow.camera.bottom = -340;
sun.shadow.bias = -0.0009; sun.shadow.normalBias = 0.6;
sun.visible = false;
scene.add(sun);

// The sky fill for both lit modes. Colours and intensity are set per mode in applyView.
const daySky = new THREE.HemisphereLight(0xBBD6E8, 0x7A6E5C, 1.30);
daySky.visible = false;
scene.add(daySky);

/* THE DAY COUNTER-KEY, AND WHY FREE LOOK IS WHAT REVEALED IT.

   One sun at (-380, 210, 260) plus a 0.55 hemisphere gives, on the four cardinal walls:

       west  (into the sun)   sun 1.35  fill 0.43   total 1.78
       south (into the sun)   sun 0.92  fill 0.43   total 1.35
       east  (away)           sun 0.00  fill 0.43   total 0.43
       north (away)           sun 0.00  fill 0.43   total 0.43

   With the counter in, Day goes to 1.78 / 1.35 / 0.89 / 0.79 — a wall contrast of 2.26:1 rather
   than 4.14:1, which is a shaded side that still reads as shaded rather than as a hole.

   TWO OF THE FOUR WALLS GET NO SUN AT ALL, at a 4.1:1 ratio against the lit ones. That was
   invisible for as long as the camera was a state machine, because every composed shot was framed
   from the sunlit side — and it became obvious the moment nav v34 let the camera go round the
   back, which is exactly what free look is for.

   It is also the same fault as the night rim, found the same way and fixed the same way: a single
   key light, no fill, only ever judged from one angle. That one went 0.26 to 0.46 for the same
   reason.

   0.62 puts the shaded walls at roughly half the lit ones, which for a desert city is not
   generous — sand at 0.4 albedo under a high sun throws a great deal of light back up onto the
   north and east faces, and it is why Gulf towers photograph with such soft shadow sides.

   NO SHADOW MAP. The comment on the sun stands: two 2048 maps resident all session to save four
   property assignments is not a trade worth making, and a fill light that casts shadows is not a
   fill light. It also means this costs one extra dot product per fragment and nothing else. */
const sunFill = new THREE.DirectionalLight(0xCADCEA, 0.62);
sunFill.visible = false;
scene.add(sunFill);
const FILL_OFF = new THREE.Vector3(360, 150, -280);

/* THE TARGETS GO IN THE SCENE, and this is not optional once they move.

   A DirectionalLight aims at light.target, and three reads target.matrixWorld — which is only
   updated for objects the scene graph actually walks. An unparented target sitting at the origin
   works by accident, because its matrix is already identity. Move it without adding it and the
   light keeps pointing at the last place the matrix happened to be updated, which is a bug that
   presents as shadows drifting one frame behind the camera. */
scene.add(sun.target, moon.target);

/* THE SHADOW FRUSTUM FOLLOWS THE ACTIVE ISLAND.

   Both maps are 2048 and both covered a fixed 680-unit box centred on the world origin: 0.332
   units per texel, or 2.6 metres. That is one texel across a doorway and about ten across a
   whole city block, and it is why nothing in the district and place views casts a shadow you
   can read — the chamfers shipped in world v22 are 0.5 units wide, which is a texel and a half.

   In district and place states only one island is on screen, so the box only has to contain that
   island. Corniche at r 76 fits in 180 units, which is 0.088 per texel — 3.8 times finer. The
   long shadows the low sun throws out to sea fall outside the box and are not missed, because
   there is nothing out there to receive them.

   NORMALBIAS HAS TO MOVE WITH IT, and this is the part that actually changes the picture.
   normalBias is a world-space push along the surface normal, so 0.6 was 1.8 texels at the old
   scale and would be 6.8 at the new one — every shadow detaching from the object throwing it,
   the classic gap under the building. Held at 1.8 texels, it stays correct at both scales, and
   at district range 1.8 texels is now 0.16 units instead of 0.6. Contact shadows reattach. */
const SUN_OFF  = new THREE.Vector3(-380, 210, 260);
const MOON_OFF = new THREE.Vector3(-320, 220, -260);
let shadowNote = 'world';
let fogKey = 'dusk';
/* HOW MUCH RIPPLE THE SEA SHOULD BE SHOWING, by state rather than by mode.

   The tile is 123 units. At district and place range that is a comfortable few hundred pixels
   and the chop reads as chop. At world range the camera is 600 units up looking across 1,400,
   so a tile is under a hundred pixels and the finest components in it are well under one — and
   a normal map sampled below a pixel per feature does not average to flat, it averages to
   BLOTCHES, because neighbouring texels disagree about which way they face and the specular
   term swings hard between them. That is the mottled grey haze over the world render.

   Mipmaps and anisotropy reduce it; they do not remove it, because the error is in the
   specular response rather than in the filtering. Fading the map out with distance does remove
   it, and costs nothing anyone would want at that range: from 600 units up the sea should be
   calm and the islands should be the subject.

   Read in the frame loop rather than assigned here, because fitShadow runs long before the
   water materials exist and touching them from it would be a temporal dead zone error. */
let rippleGoal = 1, rippleNow = 1;

/* ===========================================================================
   AERIAL PERSPECTIVE, AND WHY ONE FOG DENSITY CANNOT DELIVER IT.

   Fog was a single constant per view mode. But the three camera states look at the model from
   721, 448 and 253 units, so the SAME density produces wildly different amounts of depth cue —
   measured across the near and far edges of what is actually on screen:

                       dusk            day           night
       world        5 -> 22%       20 -> 64%      37 -> 88%
       district     2 ->  9%        8 -> 32%      16 -> 56%
       place        1 ->  3%        3 -> 12%       5 -> 23%

   Seventeen points of separation across the world view at dusk, and two points at place. The
   world view is the one that most needs air between the islands and it has the least, because
   the density was tuned at district range where the far islands sit at 694 units.

   FogExp2 is 1 - exp(-(d*k)^2), so it separates most strongly where d is around 1/k. At dusk
   that is 2,222 units — the entire model sits deep in the near-linear toe of the curve, where
   it can barely tell 500 from 1,100.

   So density scales with the camera. The multiplier is per STATE rather than per view, because
   what changes between world and place is not the light, it is how far away the subject is.
   Place goes DOWN, not just less up: at 250 units you are looking through 250 units of air and
   anything visible is a defect rather than a depth cue.

   The colour matters as much as the amount. Dusk fog was 0xCBBFA8 against a horizon band of
   0xF7D4A2 into 0xC9A882 — noticeably darker and greyer than the sky it was supposed to be
   dissolving things into, which is what makes fog read as a veil laid over the scene rather
   than as distance. Matched to the band now. */
/* AND THE PER-MODE DENSITIES WERE INCONSISTENT WITH EACH OTHER, which is the larger of the two
   faults. Working the far edge of the world view at each: dusk 22 per cent, day 64, night 88.
   Three modes of the same scene disagreeing by a factor of four about how much air is between
   the camera and Yas. Dusk was the outlier and dusk is the product state.

   Sanity check in real units, since 1 unit is 7.8 m: the far edge of the world view is 8.7 km
   out. Twenty-two per cent extinction over 8.7 km of humid Gulf air at sunset is far too clear;
   somewhere around half is right. The place view's far edge is 3 km, where 3 per cent is too
   clear and 6 to 8 is about right.

   So dusk goes up by three quarters, night comes down slightly, and the STATE multiplier is
   mild — because once the densities agree with each other, a fixed density already does most of
   the work. Scaling it hard by state, which was the first attempt, put Day at 98 per cent across
   the world view and erased the model. */
/* CONTINUOUS, NOT STEPPED — WHICH IS WHY THE TRANSITION WAS ABRUPT.

   v26 chose the fog per STATE: linear at world, exp2 at district and place, with a multiplier
   each. That got each still frame right and made the flights wrong, because the state flips at
   one instant while the camera takes about a second to arrive. Two discontinuities in the middle
   of a move: the curve TYPE changed, and its strength jumped.

   So it is one curve now, linear everywhere, with near and far driven off the live camera
   distance every frame. Nothing to blend between and nothing to switch — during a flight the
   haze eases exactly as the camera does, because it is a function of where the camera is rather
   than of which state it has been labelled.

   THE RELATIONSHIP IS AFFINE, NOT PROPORTIONAL, and that part matters. Scaling near and far by
   the camera distance would hold the fog fraction constant across the states, which is wrong:
   the far edge of the world view is 8.7 km away and the far edge of a place view is 3.1 km, and
   3 km of Gulf air really is clearer than 9. The constant term carries that; the slope carries
   the framing.

       near = 120 + 0.25 d        far = 1400 + 3.3 d

   which lands at 26 per cent across the world islands, 17 at district and 10 at place — close to
   the values each state was individually tuned to, arrived at by one continuous rule. */
/* NIGHT HAZE IS THE CITY'S OWN LIGHT, and that is the second half of making it glow.

   0x151D27 is a cold blue-grey — the colour of night air with nothing in it. But the air over a
   lit city is not empty: it is full of that city's sodium and LED spill scattered back down, which
   is why every night photograph of a skyline has a warm band sitting on the horizon and a sky that
   gets browner as it approaches the buildings rather than darker. Aviation calls it skyglow and it
   is the single most recognisable thing about a city seen from outside it.

   0x241F24 is the same value lifted a little and pulled well off blue. It stays dark enough that
   the sea does not come back — the thing every previous exposure and albedo experiment fell foul
   of — because the change is almost entirely HUE, not level: the two colours differ by 0.02 in
   luminance and by a great deal in warmth.

   The multiplier drops 0.55 to 0.46, which pulls the haze in closer. Glow that only appears at the
   horizon reads as a sunset; glow that starts a few hundred metres out reads as air. */
const FOG = {
  dusk:  { hex: 0xD2BEA4, mul: 1.00 },
  day:   { hex: 0xAEC4D2, mul: 0.82 },
  night: { hex: 0x241F24, mul: 0.46 },
};

function fogFor(camDist, key){
  const F = FOG[key];
  const near = (120 + camDist * 0.25) / F.mul;
  const far  = (1400 + camDist * 3.30) / F.mul;
  return { near, far };
}

function fitShadow(){
  const d = activeDistrict;
  // 1.18r, not r: the coastline is a radius but the island is not a circle, and the bevel and
  // the ring road sit outside the places table's radius.
  const half = d ? Math.max(60, d.r * 1.18) : 340;
  const cx = d ? d.x : 0, cz = d ? d.z : -40;
  /* The fill tracks the district like the others but has no shadow camera to fit, so it is
     aimed separately rather than being given a fake one. */
  sunFill.target.position.set(cx, GROUND, cz);
  sunFill.position.set(cx + FILL_OFF.x, GROUND + FILL_OFF.y, cz + FILL_OFF.z);

  [[sun, SUN_OFF], [moon, MOON_OFF]].forEach(([L, off]) => {
    L.target.position.set(cx, GROUND, cz);
    L.position.set(cx + off.x, GROUND + off.y, cz + off.z);
    const c = L.shadow.camera;
    c.left = -half; c.right = half; c.top = half; c.bottom = -half;
    c.updateProjectionMatrix();
    L.shadow.normalBias = 1.8 * (half * 2 / L.shadow.mapSize.x);
  });
  shadowNote = (d ? d.id : 'world') + ' ' + (half * 2 / sun.shadow.mapSize.x).toFixed(3) + 'u/tx';
  rippleGoal = d ? 1 : 0.18;
  // Nothing to do here any more: the fog follows the camera, and the camera is already moving.
}


/* The two content modules, in order. City kit first: the world needs its landmark builders. */
phase('renderer');
const kit     = createCityKit(renderer);
phase('cityKit');
const propKit = createPropKit();
phase('propKit');
// The ground textures are viewed at a grazing angle by design, so they want anisotropic
// filtering — and only the renderer knows how much is available.
const { world, water, farSea, waterPos, waterBase, waterNormal, DISTRICTS, pickTargets, corniche,
        propCount, tickSignals, PERF, buildIsland, buildCornicheRest, footprintsFor } =
  buildWorld(scene, kit, {
    maxAnisotropy: renderer.capabilities.getMaxAnisotropy(),
    props: propKit,
    C, rnd,
    basemap,
    PALACE_FOOT: CITY.PALACE_FOOT,
  });

/* ===========================================================================
   CAMERA STATE MACHINE
   =========================================================================== */
/* In DISPLAYED units — the size the island actually is on screen. See setDistrict. */
const SHOT_MIN_DISP = 320;
const STATE = { WORLD:'world', DISTRICT:'district', PLACE:'place' };
let state = STATE.WORLD;
let activeDistrict = null, activePlace = null;

phase('buildWorld');
fitClip();

/* SPLIT THE FIRST FRAME, because 9,913 ms of it is two thirds of the load and I do not know which
   half it is.

   three.js compiles a material's program the first time it draws with it, and uploads a texture or
   a buffer the first time it binds it. Both land in the first render and neither is separable from
   the outside. renderer.compile walks the scene and builds every program WITHOUT drawing, so
   timing it splits the two: whatever the first frame still costs afterwards is upload, and
   whatever compile costs is programs.

   The measurement is also half of any fix. Compilation has to happen; doing it here, where a
   loading state can cover it, is better than doing it in the frame the user is waiting on. If it
   turns out to be small, this line costs nothing and the answer is texture and buffer size
   instead — which is a completely different piece of work. */
/* AWAIT THE COMPILE, because the synchronous one lies about when it finished.

   renderer.compile returned in 13 ms and the first frame then cost 9.7 seconds. Moving the drawing
   buffer allocation earlier removed 5.4 seconds from resize and the total did not change by a
   millisecond — firstFrame simply grew by the same amount. Work that moves around but never
   shrinks is work being deferred, and the only thing deferring it is the GL driver: compile queues
   program builds and returns, and the first frame blocks until the queue drains.

   compileAsync resolves when compilation has actually happened, so the number it produces is the
   real one. If the phase comes back at nine seconds then this is shader compilation after all and
   the fix is fewer material permutations. If it comes back at nothing, the cost is texture and
   buffer upload and the fix is smaller textures.

   Guarded on existence — compileAsync arrived in three r162 and the importmap pin is not something
   to discover the hard way at run time. */
try {
  if (renderer.compileAsync) await renderer.compileAsync(scene, camera);
  else renderer.compile(scene, camera);
} catch (e){ console.warn('compile:', e.message); }
phase('compile');

/* Total texture pixels, since 330 textures says nothing about their size and a single 4096 ground
   canvas outweighs a hundred window maps. Counted from the scene rather than assumed. */
try {
  let px = 0, n = 0, big = [];
  scene.traverse(o => {
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) for (const k of ['map','emissiveMap','normalMap']){
      const t = m && m[k], im = t && t.image;
      if (!im || !im.width || t.__counted) continue;
      t.__counted = true; n++; px += im.width * im.height;
      big.push([im.width + 'x' + im.height, im.width * im.height]);
    }
  });
  big.sort((a, b) => b[1] - a[1]);
  console.info('textures ' + n + '  ' + (px / 1e6).toFixed(1) + ' Mpx  largest ' +
               big.slice(0, 4).map(b => b[0]).join(' '));
  PH['#mpx'] = px / 1e6;
} catch (e){ /* diagnostics must never break the scene */ }

const goal = { target:new THREE.Vector3(0,0,-40), dist:430, elev:300, angle:0, fov:52 };
const cur  = { target:goal.target.clone(), dist:goal.dist, elev:goal.elev,
               angle:goal.angle, fov:goal.fov };

/* ===========================================================================
   FREE LOOK.

   The state machine owns the camera and that stays true: world, district and place each aim it,
   and every transition is a damped move toward a goal. What was missing is any way to look at the
   result from somewhere the state machine did not choose — which makes a fault visible from one
   angle impossible to show, and a build impossible to inspect.

   SO ORBIT IS AN OFFSET, NOT A REPLACEMENT. yaw, lift and zoom are added on top of the damped
   goal every frame. The state machine keeps full authority over where the camera is nominally
   pointing, transitions still work while a drag is in progress, and there is no second source of
   truth to get out of step. Reset on every state change, so tapping an island always gives the
   composed shot rather than whatever angle was left over.

   LIMITS ARE PART OF THE DESIGN. Elevation is clamped above the horizon: this is a diorama on a
   dark ground plane and there is nothing underneath it to see, so allowing the camera below the
   waterline only ever produces a broken frame. Zoom is bounded either side of the state's own
   distance rather than absolutely, so the same gesture means the same thing at every scale. */
const orbit = { yaw:0, lift:0, zoom:1, on:false };
function resetOrbit(){ orbit.yaw = 0; orbit.lift = 0; orbit.zoom = 1; }

function applyLOD(){
  DISTRICTS.forEach(d => {
    const on = (d === activeDistrict);
    // MUTUALLY EXCLUSIVE. Never both, or the closest view is also the heaviest one.
    d.detail.visible = on;
    d.mass.visible   = !on;
    if (d.glow) d.glow.intensity = !on ? 0 : view === 'night' ? 70 : view === 'dusk' ? 22 : 0;
  });
  // applyLOD is the one function every state change and every view change already calls, so it
  // is the only place the shadow fit needs hooking. setPlace does not call it, and does not need
  // to: it keeps the district its parent set, so the fit is already right.
  fitShadow();
}

/* The half-extent of the whole archipelago, measured from the districts themselves. */
/* THE DISPLAYED RADIUS, NOT THE TRUE ONE. d.r is the island's real half-span in scene units and
   d.dispScale is the damping the basemap applies on the group, so the radius that actually appears
   on screen is the product. Reading d.r alone under-measures every island except the reference —
   Al Maryah is 156 units true and 613 displayed — and the world camera is framed from this. */
/* THE ARCHIPELAGO'S BOX, NOT ITS RADIUS ABOUT CORNICHE.

   worldBounds measured the furthest island from (0, -40) — Corniche's own position — and returned
   that as the world's size. Corniche sits at the south-west corner of the spread and Yas is 2,300
   units north-east of it, so the "radius" came out roughly twice the true half-extent AND was
   centred on a corner. Both errors land in the opening shot: the camera stands about twice as far
   back as it needs to, and it aims at Corniche while the other four islands sit off to one side.
   That is the overview not being central, and it is not a matter of taste.

   A box has a centre. Everything downstream wants that centre and that half-extent. */
function worldExtent(){
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  DISTRICTS.forEach(d => {
    const R = d.r * (d.dispScale || 1);
    x0 = Math.min(x0, d.x - R); x1 = Math.max(x1, d.x + R);
    z0 = Math.min(z0, d.z - R); z1 = Math.max(z1, d.z + R);
  });
  if (!isFinite(x0)) return { cx:0, cz:-40, r:120 };
  return {
    cx: (x0 + x1) / 2,
    cz: (z0 + z1) / 2,
    r:  Math.max(120, Math.max(x1 - x0, z1 - z0) / 2),
  };
}

function worldBounds(){
  return worldExtent().r;
}

/* THE CLIP AND SHADOW VOLUMES FOLLOW THE WORLD, and three literals here did not.

   camera.far was 6000, which was generous against an archipelago 800 units across and is not
   against one several thousand across. setWorld puts the camera at dist = B * 2.32 and elev =
   B * 1.55, so at B = 3,000 it stands about 8,500 units from its target — past the far plane, and
   geometry crossed it progressively as the camera pulled back. That is the black arriving from the
   top of the frame: not fog, not the sky, just the clip plane eating the scene.

   The shadow camera had the same fault at 1600 near/far with a 340-unit orthographic box, sized
   for an island of radius 190 and now looking at one of 1,220.

   Called once after buildWorld and again whenever the display scale changes, so there is one
   source for it and no copy to drift. */
function fitClip(){
  const B = worldBounds();
  camera.far = Math.max(6000, B * 4.2);
  camera.updateProjectionMatrix();

  const big = DISTRICTS.reduce((a, d) => Math.max(a, d.r * (d.dispScale || 1)), 0);
  const half = Math.max(340, big * 1.25);
  [sun, moon].forEach(L => {
    if (!L || !L.shadow) return;
    L.shadow.camera.left = -half; L.shadow.camera.right  = half;
    L.shadow.camera.top  =  half; L.shadow.camera.bottom = -half;
    L.shadow.camera.far  = Math.max(1600, B * 3.0);
    L.shadow.camera.updateProjectionMatrix();
  });
}

/* THE BEARING THAT LOOKS INTO THE SUN, DERIVED RATHER THAN AVOIDED BY EYE.

   The camera stands at target + (sin a, ., cos a) * dist and looks back at the target, so its view
   direction is -(sin a, cos a). It is staring at the sun when that lines up with the sun's own sky
   direction — sun.position, which is fixed at (-380, 210, 260). Solving gives a bearing of about
   2.17 rad, and the seaward approach in setDistrict is atan2(d.x, d.z + 300):

     Yas       (2300, -1180)  ->  1.94 rad   0.23 from the sun   blown out
     Al Reem   (1560,  -640)  ->  1.79        0.39               hazed
     Saadiyat  ( 520, -1560)  ->  2.75        0.58               glare off to one side
     Al Maryah ( 940,  -150)  ->  1.41        0.76               clean

   which is the order they look bad in. The approach angle was derived purely from where an island
   sits relative to the origin, and three of the five sit north-east, which at dusk is exactly where
   the sun is. Nothing about the shot was wrong; it just had no idea the sun existed.

   So: keep the seaward intent, but if the resulting bearing lands within SUN_KEEP of the sun,
   push it to the nearer edge of that exclusion. Turning the camera 20 degrees around an island
   costs nothing compositionally — every side of these islands is waterfront — and it is the
   difference between a skyline and a white frame. */
const SUN_BEARING = Math.atan2(-sun.position.x, -sun.position.z);
/* 0.9 RADIANS, ABOUT 52 DEGREES, AND IT IS NOT THE SUN DISC THIS IS CLEARING.

   The sun sits at 24.5 degrees elevation. The camera looks 14.7 degrees DOWN with a 21-degree
   vertical half-angle, so its frame runs from about -36 to +6 and the disc itself is already
   above the top edge — it was never in shot. What blows Yas out is the specular path on the
   water, which lies along the sun's azimuth and runs from the horizon back toward the camera,
   right through the middle of the frame. That path is broad, so clearing it wants more than the
   10-degree horizontal half-angle would suggest.

   52 degrees puts the glitter to the edge and leaves the light itself doing what it should:
   raking across the towers from three-quarters behind, which is where the warmth comes from and
   the reason not to move the sun instead. Backlit is the only bad case, and it is the only one
   excluded. */
const SUN_KEEP = 0.90;
function sunSafe(a){
  let d = a - SUN_BEARING;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  if (Math.abs(d) >= SUN_KEEP) return a;
  return SUN_BEARING + (d < 0 ? -SUN_KEEP : SUN_KEEP);
}

/* THE FRAMING DISTANCE, FROM THE ACTUAL ASPECT RATHER THAN A PORTRAIT PHONE'S.

   Three constants in this file were the same arithmetic solved once, by hand, for one screen:
   5.7 for a district, 1/0.159 for a place, 2.32 for the world. All three come from
   dist = r / tan(hFov/2), and tan(hFov/2) is tan(fov/2) * aspect — so they are only correct at
   the aspect they were derived at, 0.46, which is this phone folded.

   Unfolded, the aspect is about 1.0 and the true figure is 2.61r, not 5.66r. The camera was
   standing more than twice as far back as the shot wanted, which is the island as a sliver with
   the sea doing most of the work. It read as a composition problem on the folded screen and as a
   much worse one on the unfolded, because it was never a composition problem.

   min() rather than the horizontal alone: past square the HEIGHT becomes the tighter dimension,
   and fitting the width there would push the subject off the top and bottom instead. Fit the
   narrower axis and the radius is inside the frame whichever way the screen is turned.

   At aspect 0.46 this returns the old numbers to two decimal places, so nothing about the folded
   framing moves. */
function fitDist(r, fovDeg){
  const v = Math.tan(fovDeg * Math.PI / 360);
  /* Clamped, not trusted. aspect arrives from the DOM and the DOM is allowed to be briefly
     absurd; a camera distance is not. 0.3 to 3.0 covers a folded phone through an ultrawide, and
     anything outside that is a measurement error rather than a screen. */
  const a = Math.min(3.0, Math.max(0.30, camera.aspect || 0.46));
  const d = r / Math.min(v * a, v);
  return Number.isFinite(d) ? d : r * 5.7;
}

/* Elevation as a fraction of DISTANCE, not of the subject radius, which is what keeps the pitch
   constant when the distance moves with the aspect. The three ratios are the ones the old pairs
   implied: 1.55/2.32, 1.5/5.7, and 0.62 x 0.159. */
const PITCH_WORLD = 0.668, PITCH_DISTRICT = 0.263, PITCH_PLACE = 0.0986;

function setWorld(){
  state = STATE.WORLD; activeDistrict = null; activePlace = null;
  resetOrbit();
  /* AIMED AT THE ARCHIPELAGO, NOT AT CORNICHE. lookAt puts goal.target dead centre of frame, so
     whatever this is set to IS the middle of the shot. It was Corniche, which is one island at one
     corner of five. */
  const W = worldExtent();
  goal.target.set(W.cx, 0, W.cz);
  /* The two ratios are the ones the old literals implied — 600 and 400 against a half-extent of
     258. They are unchanged; what changed underneath them is that B is now the real half-extent
     rather than a corner-to-corner radius, so the same ratios now frame the group instead of
     standing twice as far back as they were ever meant to. */
  const B = W.r;
  /* 0.52B is what 2.32B framed at the old aspect: the world shot deliberately crops the
     bounding box rather than fitting it, and that intent is preserved as a radius. */
  goal.dist = fitDist(B * 0.52, 52); goal.elev = goal.dist * PITCH_WORLD;
  goal.angle = sunSafe(0); goal.fov = 52;
  applyLOD();
  ui('Abu Dhabi', 'Tap an island');
}
function setDistrict(d){
  /* BUILD THE ISLAND IF IT IS NOT BUILT YET. The four outer islands ship as coastline only and
     grow their city the first time the camera commits to one — see the note in w2h-world.js.

     Synchronous on purpose. It is roughly a second, it happens under a camera flight that already
     takes about that long, and the alternative is a frame where the island is visibly empty and
     then visibly is not. A hitch during a move reads as the move; a pop after it reads as a bug. */
  /* REGISTER BEFORE ANY VIEW TOUCHES IT. The order is the fix: build, snapshot, register, then
     apply. Applying a view to meshes that have not been snapshotted sets their material to
     undefined, which kills the render loop from inside projectObject with an error that names
     neither the mesh nor the island. */
  if (buildIsland && d && buildIsland(d.id)){
    snapshotMats(d.group);
    registerLift(d.group);
    fitClip();
    applyView(view);
  }
  if (d) addFootprints(d);

  /* Every state change composes a shot, so a leftover angle from the last one would arrive as a
     camera that lands somewhere the transition did not intend. orbit.on stays as it is: once the
     user has taken hold of the camera, the idle drift should not come back for the rest of the
     session. */
  resetOrbit();
  state = STATE.DISTRICT; activeDistrict = d; activePlace = null;
  /* d.shot IS THE FRAMING WHEN THERE IS ONE. See the note in w2h-world.js: the district camera
     fits d.r, and on Corniche that is now the whole nineteen-kilometre landmass rather than the
     four kilometres of waterfront anyone means by "the Corniche". A district that declares a shot
     gets framed on it; every other island is unchanged, because for them the island IS the
     subject. */
  const shot = d.shot || { x:d.x, z:d.z, r:d.r };
  const s = d.dispScale || 1;
  /* THE FLOOR BELONGS IN DISPLAYED UNITS, AND WAS IN ISLAND UNITS.

     SHOT_MIN_R exists to stop a small island pulling the camera inside its own towers, and it was
     applied to d.r before the group scale multiplied it. But the group scale is what already makes
     a small island big: Al Maryah's true radius is about 150, the floor lifted that to 320, and
     dispScale 3.9 then took the framing radius to 1,248 against a displayed island of 585. The
     camera was framing something twice the size of the thing on screen, which is why the island
     sits as a band in the middle with sea above and below it.

     Floored after scaling, once, so the number means the same thing as what the eye is measuring. */
  const fr = Math.max(SHOT_MIN_DISP, shot.r * s);
  goal.target.set(d.x + shot.x * s, GROUND + 8, d.z + shot.z * s);
  /* THE PORTRAIT FIELD CAUGHT ME TWICE. I corrected the world view for it and then set the
     district view by eye, and 2.6r put the camera INSIDE the island: at fov 42 with a 0.46
     aspect the horizontal half-angle is about 10 degrees, so the visible half-width at 2.6r is
     roughly 0.46r — barely a quarter of the island, filling the frame with the dark ground
     between buildings. That is the black screen.
     The arithmetic, once rather than by eye: to fit a radius r across the frame,
     dist = r / tan(hFov/2), and tan(10 degrees) is 0.176, so dist must be about 5.7r. */
  /* ELEVATION 1.5r, NOT 2.3r. At 2.3r the pitch is 22 degrees against a 21-degree vertical
     half-angle, so the top of the frame sits one degree BELOW the horizon and there is no sky
     in the shot at all — which is why every district render came out as a plan drawing with no
     waterline and nothing for the sea to reflect. At 1.5r the pitch is 14.7 and the horizon
     lands about six degrees into frame, which is the reference's framing.
     Distance is unchanged: dist = r / tan(hFov/2) still governs how much island is visible, and
     that arithmetic was already right. */
  goal.dist = fitDist(fr, 42); goal.elev = goal.dist * PITCH_DISTRICT; goal.fov = 42;
  // Approach from the seaward side, so the move always reads as the world turning to present
  // the island rather than the camera swinging round behind it.
  goal.angle = sunSafe(Math.atan2(d.x, d.z + 300));
  applyLOD();
  ui('Abu Dhabi <span>&rsaquo; ' + d.name + '</span>',
     d.built ? 'Tap a place, or Back' : 'Placeholder island — Back');
}
/* THE DISPLAY SCALE, WHICH THREE PLACES IN THIS FILE WERE MISSING.

   basemap v4 damps the archipelago by putting a uniform scale on each island's GROUP —
   d.dispScale, up to about 7.4 on Al Maryah — and leaves every coordinate inside the island at
   true scale. That is the right decision and it is documented in both modules. But the landmark
   anchors are consumed HERE, in world space, by three call sites that all applied d.rot and
   neither the scale nor the height.

   The result was one bug wearing two faces. The labels for a district's places collapsed into a
   clump near the island's centre, because an anchor 900 true units out was being drawn 900
   scaled-down units out — a seventh of the way. And tapping a place did nothing, because the
   pick gate is a distance against d.r, the anchors were nowhere near where they appeared, and
   the picked plane was at the unscaled ground height so the ray hit it below the island and
   further away besides. Three separate errors, one missing multiply.

   y takes the scale too: the island's top face is a local 2.9 and the group scales uniformly,
   so on Al Maryah the ground the user can see is at 21.5. */
function anchorWorld(d, a){
  const s = d.dispScale || 1;
  const c = Math.cos(d.rot), n = Math.sin(d.rot);
  return {
    s,
    x: d.x + ( a.x * c + a.z * n) * s,
    z: d.z + (-a.x * n + a.z * c) * s,
    y: (GROUND + (a.h || 0)) * s,
  };
}

function setPlace(d, anchor){
  resetOrbit();
  state = STATE.PLACE; activeDistrict = d; activePlace = anchor;
  const w = anchorWorld(d, anchor), s = w.s;
  const wx = w.x, wz = w.z;
  goal.target.set(wx, (GROUND + anchor.h * 0.55) * s, wz);
  /* Framed from the anchor's OWN radius rather than one distance for everything. Emirates
     Palace is a 90-unit-wide low building and Etihad is a tight cluster of towers; a single
     distance either loses the palace off both edges or leaves the towers as a speck.
     dist = r / tan(hFov/2) again, with tan about 0.159 at fov 38 on a portrait phone. */
  /* Scaled, for the same reason the position is: r and h are authored in the island's own frame
     and the group magnifies both. Unscaled, Al Maryah's Galleria would be framed at a seventh of
     the distance it needs and the camera would end up inside the building. */
  const R = (anchor.r || 46) * s;
  goal.dist = fitDist(R, 38);
  goal.elev = goal.dist * PITCH_PLACE + anchor.h * s * 1.2;
  goal.fov  = 38;
  goal.angle = sunSafe(Math.atan2(wx - d.x, wz - d.z + 60));
  ui('Abu Dhabi <span>&rsaquo; ' + d.name + ' &rsaquo; ' + anchor.label + '</span>',
     'Back to ' + d.name);
}
function ui(crumb, hint){
  document.getElementById('crumb').innerHTML = crumb;
  document.getElementById('hint').textContent = hint;
  document.getElementById('back').classList.toggle('on', state !== STATE.WORLD);
}
document.getElementById('back').addEventListener('click', () => {
  if (state === STATE.PLACE)         setDistrict(activeDistrict);
  else if (state === STATE.DISTRICT) setWorld();
});

/* ===========================================================================
   VIEW MODES, independent of the navigation state.

   FOUR NOW, AND THE PRODUCT ONE CHANGED.

   The reference we are building to is not a night render. It is golden hour: pale stone reading
   its own colour, the sky doing most of the lighting, and warm practicals just coming on as
   ACCENTS rather than as the only visible thing. Deep night is the hardest possible condition to
   make a miniature legible in — everything below the window line goes to black, which is exactly
   what the night screenshots showed. So DUSK is now the base state and night has joined day and
   silhouette as a diagnostic.

     DUSK        the product. Low warm sun, gradient sky, lit windows as accents.
     DAY         neutral stone under a raking sun. Tests MASSING.
     NIGHT       lighting, bloom, warm haze. Tests the light hierarchy.
     SILHOUETTE  flat black on pale sky. Tests OUTLINE alone.

   ONE CYCLING CHIP rather than three toggles. Three labelled buttons plus Back did not fit
   across a phone, and a diagnostic control that pushes the navigation off screen is a worse
   problem than an extra tap.
   =========================================================================== */
/* PLAN is a fifth mode and it exists purely to end an argument. The ground texture has been
   verified at every step — the canvas rasterises to 2,467 distinct colours, the top-cap UVs land
   on canvas pixels 78..956 by 337..738 which is exactly the painted island, the material carries
   the map in all three lit modes — and it still reads as one flat tone on a phone. Plan strips
   the lighting, the tone curve, the fog, the bloom and every other mesh, and shows the island as
   nothing but the painted canvas. One screenshot decides whether the remaining work is addressing
   or art direction, and no amount of further palette guessing can substitute for it. */
const MODES = ['dusk', 'day', 'night', 'sil', 'plan'];
const LABEL = { dusk:'Dusk', day:'Day', night:'Night', sil:'Silhouette', plan:'Plan' };
let view = 'dusk';

const silMat    = new THREE.MeshBasicMaterial({ color:0x000000 });
const silWater  = new THREE.MeshBasicMaterial({ color:0xB9CBD4 });
// STANDARD, not Basic. A flat unlit day mode would be a paler silhouette — every face the same
// value and no massing information at all. Standard means the sun shades each plane and the
// forms read as solid, which is the entire reason for having the mode.
const dayMat    = new THREE.MeshStandardMaterial({ color:0xC9C2B2, roughness:0.88, metalness:0 });
const dayWater  = new THREE.MeshStandardMaterial({ color:0x6E9CB6, roughness:0.30, metalness:0 });
/* DUSK WATER, SECOND ATTEMPT, and the first one was dark for a reason worth writing down.
   0x2C4658 at metalness 0.30 gives an albedo of about 0.03 in linear terms, and the dusk sun
   sits 13 degrees above the horizon so N·L on a flat sea is 0.22. Multiply those and the diffuse
   term is essentially zero; all that was left was a Fresnel sliver of sky and one specular
   glint, so the sea rendered near black and the whole lower half of the frame went with it.
   Water really is that dark in physical terms — but this is a lit diorama, not a simulation, and
   a black foreground is not a defensible outcome.
   Metalness back to a dielectric 0.10 (which is what water actually is), a base colour four
   times lighter, and the env map carrying the rest. The sun glint survives; the sea no longer
   swallows the frame. */
const duskWater = new THREE.MeshStandardMaterial({ color:0x5E7A88, roughness:0.16,
  metalness:0.10, envMapIntensity:1.5 });

/* THE RIPPLE GOES ON ALL OF THEM, and that is the whole reason it is built in the world module
   and handed over rather than assigned there.

   The animated plane has 46 units between vertices, so the wave loop can only make broad swells
   and the surface between them is a perfect mirror. w2h-world.js generates a tiling ripple
   normal at load and puts it on the material it owns — but this file REPLACES water.material in
   Day, Dusk and Silhouette, so a map assigned only over there would have been visible at night
   and nowhere else. Same reasoning as farSea: anything read out of another module is guarded, so
   an older world.js that has no waterNormal degrades to the flat sea rather than throwing.

   Silhouette is left alone deliberately. It is a diagnostic for massing and a rippled sea in it
   would be noise. */
if (waterNormal){
  const nScale = new THREE.Vector2(0.42, 0.42);
  // Day is high and bright, so the chop reads at a steeper angle and wants less of it.
  /* AND LESS OF IT. 0.42 was tuned on a still frame; in motion a strong normal on a repeating
     tile is exactly what makes the repeat legible, because every crest catches the same highlight
     in the same place relative to the pattern. Softer normals let the vertex swell carry the
     movement and leave the map doing texture. */
  dayWater.normalMap  = waterNormal; dayWater.normalScale  = nScale.clone().multiplyScalar(0.52);
  duskWater.normalMap = waterNormal; duskWater.normalScale = nScale.clone().multiplyScalar(0.72);
  dayWater.needsUpdate = duskWater.needsUpdate = true;
}

/* ===========================================================================
   THE DUSK LIFT.

   Day swaps every material for one flat stone, which throws away the window maps — acceptable
   for a massing diagnostic, useless for the product. Dusk needs pale bodies AND lit windows at
   the same time, so it does not swap materials at all: it RECOLOURS them in place and leaves
   every emissive map exactly where it was.

   Two target tones, chosen by a test on the material's own night colour. The night palette is so
   dark that hue differences between materials are a few thousandths and survive no arithmetic
   worth doing — attempts to preserve those hues by normalising or boosting them all collapsed to
   the same cream. But the ONE distinction that actually matters, glass against stone, is still
   legible as a blue-over-red ratio in the original sRGB bytes, so that is what gets tested and
   nothing else is inferred. Building character at dusk comes from the emissive maps and from the
   fabric's per-instance colour, both of which survive untouched.

   Emissive is dimmed to 0.42. At full night intensity the windows read as the light source,
   which is correct at midnight and wrong an hour after sunset.

   BUILT ONCE, EAGERLY, while the materials still hold their night values. Build it lazily and a
   user who presses Day first registers dayMat as the thing to restore, and night never comes
   back. That is a genuinely nasty bug because it only appears on the second mode change.
   =========================================================================== */
/* GLASS IS NOT A COLOUR PROBLEM, IT IS A MATERIAL PROBLEM.

   Two attempts at solving it by picking a better hex both failed, and the arithmetic says why.
   0x8FB6C2 is (143,182,194); the dusk key light is 0xFFC489, or (255,196,137); multiply them and
   you get (143,140,104). The green and blue collapse onto the red and every glazed tower turns
   sage. ANY blue tinted by a warm light does this — the reference's towers are not blue because
   they are painted blue, they are blue because they are REFLECTING THE UPPER SKY and barely
   taking the sun at all.

   So dusk gives glass a material treatment rather than a tint: metalness up, roughness down, and
   the gradient sky env map doing the work. Metalness suppresses the diffuse term, which is the
   term the warm sun was ruining, and puts the specular reflection of the sky in its place —
   blue high on the tower, warm near the horizon, which is exactly the gradient we built. */
const DUSK_STONE = 0xD9CDB6, DUSK_GLASS = 0xBCD2DE;
const GLASS_ROUGH = 0.24, GLASS_METAL = 0.62, GLASS_ENV = 1.5;

/* ORIGINAL MATERIALS CAPTURED EAGERLY, for the same reason the lift registry is.

   applyView used to record o.userData.origMat lazily, on the first mode that swapped materials.
   But the startup state is DUSK, and dusk assigns the islands their duskMats — so the first
   swap recorded the DUSK ground as the thing to restore, and Night afterwards came back with a
   pale dusk beach instead of the dark night one. That was the pale rim outlining every island
   in the night renders, and I had already tried to fix it once by darkening a material that was
   never being used.

   Snapshot everything now, while the scene is still exactly as buildWorld left it. */
/* SNAPSHOT A SUBTREE, not just the world once.

   This ran once at load and stamped origMat on every mesh. applyView restores from it, so a mesh
   without one gets `o.material = undefined` — and three.js then reads material.visible on
   undefined and the render loop dies. That is exactly what deferring the outer islands produced:
   the city arrived after the snapshot had already been taken, and tapping Al Reem threw
   "Cannot read properties of undefined (reading 'visible')" from inside projectObject.

   Deferred building means registration has to be repeatable. Both passes are now functions over a
   root, idempotent through `seen` and the origMat guard, and buildIsland calls them on the new
   island before any view touches it. */
function snapshotMats(root){
  root.traverse(o => {
    if (!o.isMesh || o.userData.helper) return;
    if (!o.userData.origMat) o.userData.origMat = o.material;
  });
}
snapshotMats(world);
water.userData.origMat = water.material;
phase('snapshot');
const liftReg = [];
const liftSeen = new Set();
function registerLift(root){
  const seen = liftSeen;
  root.traverse(o => {
    // litMat: props, already the right colour under any light. duskMats: the islands, which
    // carry a painted ground texture and get a whole material per mode instead.
    if (!o.isMesh || o.userData.litMat || o.userData.duskMats) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (!m || !m.color || seen.has(m)) return;
      seen.add(m);
      const hex = m.color.getHex();
      const r = (hex >> 16) & 255, b = hex & 255;
      // Everything the dusk pass touches has to be restorable, which now includes the surface
      // properties, not just the colour.
      /* duskHex: THE MATERIAL'S OWN DUSK COLOUR, IF IT HAS ONE.

         This is the single change that unblocks a palette. Until now the lift set every
         non-glass material in the scene to one hex, so the city had exactly TWO colours at dusk
         — DUSK_STONE and DUSK_GLASS — however many materials it was built from. Adding
         limestone, aluminium, asphalt and concrete would have changed nothing: they would all
         have been overwritten with 0xD9CDB6 the moment dusk was entered, which is the whole
         reason the render reads beige.

         DUSK_STONE stays as the fallback, so anything that has not declared a dusk colour still
         behaves exactly as it did. The glass path is untouched — glass is a material problem
         rather than a colour one, for the reasons written above, and that argument still holds. */
      /* glassOverride: THE CLASSIFIER GUESSES, AND IT GETS ONE WRONG.

         Deciding glass by blue-over-red on the night hex is a good heuristic and it has been
         right about everything except ADNOC's waist — the narrow dark band between shaft and
         cap, which exists to read as a shadow line. Its hex is 0x080C10, a ratio of exactly 2.0,
         so the lift has been handing it DUSK_GLASS and metalness 0.62 and turning the one
         deliberately dark element on the tower into a bright blue-grey stripe.

         A heuristic that is right nine times out of ten does not want replacing, it wants an
         override for the tenth. */
      liftReg.push({ m, glass: (m.userData && m.userData.glassOverride != null)
                               ? m.userData.glassOverride : b > r * 1.75, nightHex:hex,
                     duskHex: m.userData && m.userData.duskColor,
                     nightEmi: m.emissiveIntensity, nightRough: m.roughness,
                     nightMetal: m.metalness, nightEnv: m.envMapIntensity });
    });
  });
}
registerLift(world);
/* NIGHT SHOULD REVEAL THE CITY, NOT HIDE IT.

   The night render loses the model: sea, ground and unlit faces all sit near black and the only
   thing left is a scatter of windows. Aerial photography at night does the opposite — the water
   goes to nothing and the city is the brightest thing in the frame.

   The fix is emissive, not ambient. Raising the hemisphere or the exposure lifts the sea and the
   sand along with the buildings and flattens the whole thing toward grey; multiplying the window
   emissive lifts only the surfaces that are supposed to be sources. It is also free: emissive
   intensity is a uniform, so nothing recompiles.

   Passed in rather than derived, because applyLift's "off" branch covers Day, Plan and Silhouette
   as well as Night, and boosting lit windows in a daytime diagnostic would be wrong. */
/* CHRISTMAS TREES, AND WHY MORE AMBIENT WAS THE WRONG LEVER.

   v28 raised the hemisphere and the moon and the buildings still did not appear, because the
   limit was never the light. A wall's screen value is irradiance times ALBEDO, and the albedo is
   0.0112 linear. Multiplying irradiance by 1.9 took a moon-facing wall from 5 to 9 out of 255,
   while the windows went up 1.8 and got brighter still — so the one thing already visible became
   more dominant and the render turned into lights on a black tree.

   Scaling the albedo is the lever, because it lifts exactly the surfaces meant to have mass and
   nothing else. Through the ACES curve at exposure 1.24, a moon-facing wall:

       albedo x1.0     9 / 255        shadow side  1
       albedo x5.0    43 / 255        shadow side  3

   Forty-three is a dark grey you can read a silhouette in; nine is black. And it costs nothing
   elsewhere — the sea is not in the lift registry, so it keeps its own 0.0029 and stays dark. The
   city lifts and the water does not, which is the whole difference between an aerial night
   photograph and a black frame with dots on it.

   GLASS TAKES HALF THE SCALE. It is dark at night for a physical reason: it is a mirror, and at
   night there is nothing to mirror. Lifting it as far as stone turns Etihad into five grey slabs.

   AND THE WINDOWS COME BACK DOWN, 1.8 to 1.2. They were raised to compensate for buildings that
   were not there. Now that the buildings are, the boost over-corrects the other way. */
const NIGHT_ALBEDO = 5.0, NIGHT_ALBEDO_GLASS = 2.4;
const NIGHT_EMI = 1.2;

function applyLift(on, night){
  liftReg.forEach(e => {
    if (on){
      /* GLASS CAN NOW VARY TOO, which it could not before.

         duskHex was added for stone and the glass branch went on forcing one colour and one
         roughness on every curtain wall in the scene. That was defensible while there was a
         single glass material; it stops being defensible the moment the point is a library. A
         bronze-tinted facade and a blue-green one differ in tint AND in how hard they reflect,
         and both of those are what the eye reads as "different building".

         The globals stay as the fallback, so anything that declares nothing behaves exactly as
         it did. Still uniforms rather than defines: no recompile, so the mode switch is instant
         however many variants the registry ends up holding. */
      const u = e.m.userData || {};
      e.m.color.setHex(e.duskHex != null ? e.duskHex : (e.glass ? DUSK_GLASS : DUSK_STONE));
      e.m.emissiveIntensity = e.nightEmi * 0.42;
      if (e.glass){
        e.m.roughness = u.duskRough != null ? u.duskRough : GLASS_ROUGH;
        e.m.metalness = u.duskMetal != null ? u.duskMetal : GLASS_METAL;
        e.m.envMapIntensity = u.duskEnv != null ? u.duskEnv : GLASS_ENV;
      }
    } else {
      e.m.color.setHex(e.nightHex);
      // setHex decodes sRGB into the linear working space, so this scales radiance directly.
      if (night) e.m.color.multiplyScalar(e.glass ? NIGHT_ALBEDO_GLASS : NIGHT_ALBEDO);
      e.m.emissiveIntensity = e.nightEmi * (night ? NIGHT_EMI : 1);
      e.m.roughness = e.nightRough;
      e.m.metalness = e.nightMetal;
      e.m.envMapIntensity = e.nightEnv;
    }
  });
}

function applyView(next){
  view = next;
  const sil   = view === 'sil',  day   = view === 'day';
  const dusk  = view === 'dusk', night = view === 'night';
  const plan  = view === 'plan';

  const chip = document.getElementById('vMode');
  chip.textContent = LABEL[view];
  chip.setAttribute('aria-pressed', String(!dusk));

  scene.background = plan ? new THREE.Color(0x101418)
                   : sil ? new THREE.Color(0xC8D8DF)
                   : day ? new THREE.Color(0x9FC4DA)
                   : dusk ? duskSkyTex : nightSkyTex;
  fogKey = sil || plan ? null : day ? 'day' : dusk ? 'dusk' : 'night';
  scene.fog = fogKey ? new THREE.Fog(FOG[fogKey].hex, 1, 2) : null;   // near/far set by the loop
  scene.environment = (sil || day || plan) ? null : dusk ? duskEnv : nightEnv;

  moon.visible = night;
  rim.visible  = night;
  hemiNight.visible = night;
  sun.visible     = day || dusk;
  daySky.visible  = day || dusk;
  /* Not in Silhouette or Plan: both are diagnostics that want one unambiguous key so massing
     reads as massing, and a fill light is the opposite of that. */
  sunFill.visible = day || dusk;
  if (dusk){
    sun.color.setHex(0xFFC489); sun.intensity = 2.4;
    /* Weaker and much cooler at dusk. The sky opposite a sunset is deep blue, not warm, and a
       warm fill there would put a second sunset on the wrong side of every tower — which is the
       single most common way a dusk render gives itself away. */
    sunFill.color.setHex(0x8FAECB); sunFill.intensity = 0.40;
    // Lower than Day and further round. Long shadows across the ground plan are the single
    // cheapest cue that this is evening rather than noon. An OFFSET from the island being
    // looked at now, rather than an absolute position, so the shadow frustum can follow.
    SUN_OFF.set(-420, 118, 300);
    daySky.color.setHex(0xA8C6DE); daySky.groundColor.setHex(0x6E5B44);
    // The dusk sky env map is already a strong ambient source. Stacking a bright hemisphere on
    // top of it flattens the massing, which is the one thing the low sun is there to reveal.
    daySky.intensity = 0.52;
  } else if (day){
    /* SUN 3.0 -> 1.8 AND FILL 1.30 -> 0.55, and this is why the ground plan looked like an
       unbroken cream plain in Day while the same texture read perfectly at dusk.

       Total irradiance was 1.89. Multiply by the ground albedos and every surface lands above
       0.4 linear, which is deep in the ACES shoulder where the curve is nearly flat. Run the
       numbers through it:

           sand 0.909   paving 0.926   lawn 0.867   street 0.808   road 0.755

       A 3:1 albedo ratio between sand and tarmac arriving on screen as 0.91 against 0.76. The
       palette was never the problem — the exposure was eating it. At irradiance 1.02 the same
       five surfaces come out 0.82 / 0.85 / 0.75 / 0.67 / 0.60, which is the spread the ladder
       was designed to give and almost exactly what dusk already produces.

       Worth stating plainly: with a filmic curve, ADDING LIGHT REMOVES CONTRAST once you are
       past the knee. Every instinct says a diagnostic mode should be brightly lit. */
    sun.color.setHex(0xFFD9A8); sun.intensity = 1.8;
    sunFill.color.setHex(0xCADCEA); sunFill.intensity = 0.62;
    SUN_OFF.set(-380, 210, 260);
    daySky.color.setHex(0xBBD6E8); daySky.groundColor.setHex(0x7A6E5C);
    daySky.intensity = 0.55;
  }

  applyLift(dusk, night);

  // Bloom is a lit-window effect. Against a pale sky it flares every edge and destroys the
  // profiles and massing that Day and Silhouette exist to judge.
  bloom.enabled  = night || dusk;
  // NoToneMapping in Plan so the render is the canvas, byte for byte. Tone mapping is part of the
  // program cache key, so three recompiles for us and the switch costs one frame.
  renderer.toneMapping = plan ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
  /* ===========================================================================
     GLOW IS RADIUS, NOT STRENGTH — and the numbers on the device say we can afford it.

     Measured on the Fold at the place camera on Corniche: 3.4 ms median / 6.0 p95 in the light
     case and 9.4 / 12.1 in the heaviest. Against a 60 Hz budget of 16.7 ms that is between four
     and thirteen milliseconds of headroom in every frame, so the question stops being whether to
     spend and becomes what to spend it on.

     A city glows because the light LEAVES the source. A lit window at this distance is a couple of
     pixels; at radius 0.55 its bloom is a couple of pixels too, so the window gets brighter and
     nothing around it changes — which is precisely "brighter windows, no glow". Widening the
     radius spreads each source into the air around it, and because the sources are dense the
     halos overlap and become a wash over the whole downtown. That wash is the effect.

     STRENGTH COMES DOWN AS RADIUS GOES UP. They multiply, so holding strength while widening
     turns the city into a smear. 0.60 at radius 0.55 and 0.46 at radius 0.95 put roughly the same
     energy on screen, distributed very differently.

     THRESHOLD DOWN AT NIGHT, 0.46 to 0.34. The facades sit just under the old bar, so only the
     brightest windows were blooming at all. Dusk stays at 0.82 for the reason already written
     below it: at dusk the stone is bright and a low bar glows the entire city.

     Bloom is a full-screen pass, so the cost is resolution and iteration count, not scene
     complexity — a wider radius is very close to free at this frame time. */
  bloom.radius   = dusk ? 0.62 : 0.95;
  bloom.strength = dusk ? 0.24 : 0.46;
  /* THRESHOLD IS THE OTHER HALF OF THE MILKY LOOK. At 0.46 almost every sunlit stone face in a
     dusk frame clears the bar, so the bloom pass was not picking out windows and lamps, it was
     glowing the entire city. At 0.82 only the emissive surfaces qualify, which is the whole
     point of having the effect. Night can stay low: at night very little is above 0.46 except
     the windows anyway. */
  bloom.threshold = dusk ? 0.82 : 0.34;
  /* 1.15 -> 1.24 at night, and no further. Exposure lifts everything including the sea, so it is
     the wrong lever for readability and the right one only for the small amount the emissive
     boost cannot reach — the moonlit faces beside a lit window. Past about 1.3 the water starts
     coming back and the frame flattens. */
  renderer.toneMappingExposure = night ? 1.24 : dusk ? 1.02 : 1.0;

  world.traverse(o => {
    /* SPRITES ARE NOT MESHES, and the grid labels have been visible in every view since the day
       they were added.

       The planOnly test twenty lines below switches them off outside Plan, and it has never once
       run: this guard returns before reaching it, because a sprite reports isSprite and not
       isMesh. Nobody noticed while the camera sat above an island 380 units across and the labels
       were a few pixels of teal. Opening the hero at street level put a two-metre "8" in the
       middle of the shot.

       Handled before the mesh guard rather than by loosening it — everything after this line
       reads o.material as a surface material, which a SpriteMaterial is not. */
    if (o.userData.planOnly){ o.visible = plan; return; }
    if (!o.isMesh) return;
    /* HELPERS ARE NOT SCENERY. The district tap targets are horizontal discs wider than the
       coastline, held off screen by material.visible = false — and this loop was overwriting that
       material with a visible one in Day and Silhouette, laying a solid lid over every island.
       Anything that exists for input rather than for looking at is skipped outright. */
    if (o.userData.helper) return;
    /* NIGHT-ONLY MESHES EXIST OR THEY DO NOT — there is no daytime version of them.
