// value and no massing information at all. Standard means the sun shades each plane and the
// forms read as solid, which is the entire reason for having the mode.
const dayMat    = new THREE.MeshStandardMaterial({ color:0xC9C2B2, roughness:0.88, metalness:0 });
const dayWater  = new THREE.MeshStandardMaterial({ color:0x6E9CB6, roughness:0.30, metalness:0 });
/* DUSK WATER, SECOND ATTEMPT, and the first one was dark for a reason worth writing down.
   0x2C4658 at metalness 0.30 gives an albedo of about 0.03 in linear terms, and the dusk sun
   sits 13 degrees above the horizon so N·L on a flat sea is 0.22. Multiply those and the diffuse
   term is essentially zero; all that was left was a Fresnel sliver of sky and one specular
   glint, so the sea rendered near black and the whole lower half of the frame went with it.
   Water really is that dark in physical terms — but this is a lit diorama, not a simulation, and
   a black foreground is not a defensible outcome.

   times lighter, and the env map carrying the rest. The sun glint survives; the sea no longer

   and handed over rather than assigned there.

   and the surface between them is a perfect mirror. w2h-world.js generates a tiling ripple
   normal at load and puts it on the material it owns — but this file REPLACES water.material in
   Day, Dusk and Silhouette, so a map assigned only over there would have been visible at night
   and nowhere else. Same reasoning as farSea: anything read out of another module is guarded, so

if (waterNormal){

  /* AND LESS OF IT. 0.42 was tuned on a still frame; in motion a strong normal on a repeating

     movement and leave the map doing texture. */
  dayWater.normalMap  = waterNormal; dayWater.normalScale  = nScale.clone().multiplyScalar(0.52);

   the same time, so it does not swap materials at all: it RECOLOURS them in place and leaves
   every emissive map exactly where it was.

   Two target tones, chosen by a test on the material's own night colour. The night palette is so
   dark that hue differences between materials are a few thousandths and survive no arithmetic
   worth doing — attempts to preserve those hues by normalising or boosting them all collapsed to
   the same cream. But the ONE distinction that actually matters, glass against stone, is still
   legible as a blue-over-red ratio in the original sRGB bytes, so that is what gets tested and
   nothing else is inferred. Building character at dusk comes from the emissive maps and from the
   fabric's per-instance colour, both of which survive untouched.

   Emissive is dimmed to 0.42. At full night intensity the windows read as the light source,
   which is correct at midnight and wrong an hour after sunset.

   BUILT ONCE, EAGERLY, while the materials still hold their night values. Build it lazily and a
   user who presses Day first registers dayMat as the thing to restore, and night never comes

/* GLASS IS NOT A COLOUR PROBLEM, IT IS A MATERIAL PROBLEM.

   Two attempts at solving it by picking a better hex both failed, and the arithmetic says why.
   0x8FB6C2 is (143,182,194); the dusk key light is 0xFFC489, or (255,196,137); multiply them and
   you get (143,140,104). The green and blue collapse onto the red and every glazed tower turns
   sage. ANY blue tinted by a warm light does this — the reference's towers are not blue because
   they are painted blue, they are blue because they are REFLECTING THE UPPER SKY and barely
   taking the sun at all.

   So dusk gives glass a material treatment rather than a tint: metalness up, roughness down, and
   the gradient sky env map doing the work. Metalness suppresses the diffuse term, which is the
   term the warm sun was ruining, and puts the specular reflection of the sky in its place —
   blue high on the tower, warm near the horizon, which is exactly the gradient we built. */
const DUSK_STONE = 0xD9CDB6, DUSK_GLASS = 0xBCD2DE;
const GLASS_ROUGH = 0.24, GLASS_METAL = 0.62, GLASS_ENV = 1.5;

/* ORIGINAL MATERIALS CAPTURED EAGERLY, for the same reason the lift registry is.

   applyView used to record o.userData.origMat lazily, on the first mode that swapped materials.
   But the startup state is DUSK, and dusk assigns the islands their duskMats — so the first
   swap recorded the DUSK ground as the thing to restore, and Night afterwards came back with a
   pale dusk beach instead of the dark night one. That was the pale rim outlining every island
   in the night renders, and I had already tried to fix it once by darkening a material that was
   never being used.

   Snapshot everything now, while the scene is still exactly as buildWorld left it. */
/* SNAPSHOT A SUBTREE, not just the world once.

   This ran once at load and stamped origMat on every mesh. applyView restores from it, so a mesh
   without one gets `o.material = undefined` — and three.js then reads material.visible on
   undefined and the render loop dies. That is exactly what deferring the outer islands produced:
   the city arrived after the snapshot had already been taken, and tapping Al Reem threw
   "Cannot read properties of undefined (reading 'visible')" from inside projectObject.

   Deferred building means registration has to be repeatable. Both passes are now functions over a
   root, idempotent through `seen` and the origMat guard, and buildIsland calls them on the new
   island before any view touches it. */
/* SNAPSHOT, AND PROMOTE THE DAY MATERIALS OFF THE MATERIAL ONTO THE MESH.

   applyView reads dayMats from the MESH. Every hand-built landmark in w2h-city.js declares it on
   the MATERIAL instead — mRed.userData.dayMats, body.userData.dayMats, and so on for Ferrari
   World, Yas Mall, Emirates Palace, Etihad Towers and ADNOC. Nothing anywhere bridged the two, so
   in Day every one of them fell through to the switcher's generic pale dayMat and lost its
   colour. Ferrari World has never been red in Day.

   DUSK WAS NEVER AFFECTED, which is why this survived so long: registerLift reads the material's
   own userData.duskColor, so the same landmarks are correctly coloured at dusk and at night and
   wrong only in the two unlit-ish modes. A fault that appears in one tab out of six reads as a
   lighting quirk rather than as a missing field.

   ARRAY-AWARE, because it has to be. Ferrari World's roof is one mesh with three material groups
   and applyView assigns whatever it is handed — so a mesh with an array material needs an ARRAY
   of day materials, in the same order, exactly as the island ground already does. A material
   without a declared day version falls back to itself rather than to the generic pale, since a
   landmark that is deliberately one colour in every light should stay that colour.

   Done here rather than at each builder because there are five landmarks, a dozen materials and
   two files, and stamping a field at every construction site is precisely how it got missed. */
function snapshotMats(root){
  root.traverse(o => {
    if (!o.isMesh || o.userData.helper) return;
    if (!o.userData.origMat) o.userData.origMat = o.material;

const liftReg = [];

function registerLift(root){

    // carry a painted ground texture and get a whole material per mode instead.
    if (!o.isMesh || o.userData.litMat || o.userData.duskMats) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (!m || !m.color || seen.has(m)) return;
      seen.add(m);
      const hex = m.color.getHex();
      const r = (hex >> 16) & 255, b = hex & 255;

      // properties, not just the colour.
      /* duskHex: THE MATERIAL'S OWN DUSK COLOUR, IF IT HAS ONE.

         This is the single change that unblocks a palette. Until now the lift set every
         non-glass material in the scene to one hex, so the city had exactly TWO colours at dusk
         — DUSK_STONE and DUSK_GLASS — however many materials it was built from. Adding
         limestone, aluminium, asphalt and concrete would have changed nothing: they would all
         have been overwritten with 0xD9CDB6 the moment dusk was entered, which is the whole
         reason the render reads beige.

         DUSK_STONE stays as the fallback, so anything that has not declared a dusk colour still
         behaves exactly as it did. The glass path is untouched — glass is a material problem
         rather than a colour one, for the reasons written above, and that argument still holds. */
      /* glassOverride: THE CLASSIFIER GUESSES, AND IT GETS ONE WRONG.

         Deciding glass by blue-over-red on the night hex is a good heuristic and it has been
         right about everything except ADNOC's waist — the narrow dark band between shaft and
         cap, which exists to read as a shadow line. Its hex is 0x080C10, a ratio of exactly 2.0,
         so the lift has been handing it DUSK_GLASS and metalness 0.62 and turning the one
         deliberately dark element on the tower into a bright blue-grey stripe.

         override for the tenth. */
      liftReg.push({ m, glass: (m.userData && m.userData.glassOverride != null)
                               ? m.userData.glassOverride : b > r * 1.75, nightHex:hex,
                     duskHex: m.userData && m.userData.duskColor,

registerLift(world);
/* NIGHT SHOULD REVEAL THE CITY, NOT HIDE IT.

   The night render loses the model: sea, ground and unlit faces all sit near black and the only
   thing left is a scatter of windows. Aerial photography at night does the opposite — the water
   goes to nothing and the city is the brightest thing in the frame.

   The fix is emissive, not ambient. Raising the hemisphere or the exposure lifts the sea and the
   sand along with the buildings and flattens the whole thing toward grey; multiplying the window
   emissive lifts only the surfaces that are supposed to be sources. It is also free: emissive
   intensity is a uniform, so nothing recompiles.

   Passed in rather than derived, because applyLift's "off" branch covers Day, Plan and Silhouette
   as well as Night, and boosting lit windows in a daytime diagnostic would be wrong. */
/* CHRISTMAS TREES, AND WHY MORE AMBIENT WAS THE WRONG LEVER.

   v28 raised the hemisphere and the moon and the buildings still did not appear, because the
   limit was never the light. A wall's screen value is irradiance times ALBEDO, and the albedo is
   0.0112 linear. Multiplying irradiance by 1.9 took a moon-facing wall from 5 to 9 out of 255,
   while the windows went up 1.8 and got brighter still — so the one thing already visible became
   more dominant and the render turned into lights on a black tree.

   Scaling the albedo is the lever, because it lifts exactly the surfaces meant to have mass and
   nothing else. Through the ACES curve at exposure 1.24, a moon-facing wall:

       albedo x1.0     9 / 255        shadow side  1
       albedo x5.0    43 / 255        shadow side  3

   Forty-three is a dark grey you can read a silhouette in; nine is black. And it costs nothing
   elsewhere — the sea is not in the lift registry, so it keeps its own 0.0029 and stays dark. The
   city lifts and the water does not, which is the whole difference between an aerial night
   photograph and a black frame with dots on it.

   GLASS TAKES HALF THE SCALE. It is dark at night for a physical reason: it is a mirror, and at
   night there is nothing to mirror. Lifting it as far as stone turns Etihad into five grey slabs.

   AND THE WINDOWS COME BACK DOWN, 1.8 to 1.2. They were raised to compensate for buildings that
   were not there. Now that the buildings are, the boost over-corrects the other way. */
const NIGHT_ALBEDO = 5.0, NIGHT_ALBEDO_GLASS = 2.4;

function applyLift(on, night){

         duskHex was added for stone and the glass branch went on forcing one colour and one
         roughness on every curtain wall in the scene. That was defensible while there was a
         single glass material; it stops being defensible the moment the point is a library. A
         bronze-tinted facade and a blue-green one differ in tint AND in how hard they reflect,
         and both of those are what the eye reads as "different building".

         The globals stay as the fallback, so anything that declares nothing behaves exactly as
         it did. Still uniforms rather than defines: no recompile, so the mode switch is instant
         however many variants the registry ends up holding. */
      const u = e.m.userData || {};
      e.m.color.setHex(e.duskHex != null ? e.duskHex : (e.glass ? DUSK_GLASS : DUSK_STONE));
      e.m.emissiveIntensity = e.nightEmi * 0.42;
      if (e.glass){
        e.m.roughness = u.duskRough != null ? u.duskRough : GLASS_ROUGH;
        e.m.metalness = u.duskMetal != null ? u.duskMetal : GLASS_METAL;
        e.m.envMapIntensity = u.duskEnv != null ? u.duskEnv : GLASS_ENV;

      e.m.color.setHex(e.nightHex);

      if (night) e.m.color.multiplyScalar(e.glass ? NIGHT_ALBEDO_GLASS : NIGHT_ALBEDO);
      e.m.emissiveIntensity = e.nightEmi * (night ? NIGHT_EMI : 1);
      e.m.roughness = e.nightRough;
      e.m.metalness = e.nightMetal;
      e.m.envMapIntensity = e.nightEnv;

function applyView(next){

     and the five meshes it was supposed to be drawing came to 25 ms between them. Nothing in the
     scene graph was responsible. The background was — an equirect handed to scene.background,
     converted to CubeUV by WebGLCubeUVMaps on first use, inside the draw. See skyDome at the top
     of the file for the whole argument and for what replaced it.

     Without this it renders black: the sun, the sky hemisphere and the environment map are all
     tied to day/dusk/night, and Check uses the day materials, which are lit. Silhouette and Plan
     get away with it because both swap in unlit materials.

     Overhead and shadowless on purpose. A registration check compares a building's footprint with
     the street painted beneath it, and a low sun lays a copy of every building across exactly the
     ground being read. The hemisphere carries most of the load with the sun as a weak key, so
     surfaces stay distinguishable from each other without anything being thrown into a hole. */
  sun.visible     = day || dusk || check;

           sand 0.909   paving 0.926   lawn 0.867   street 0.808   road 0.755

       A 3:1 albedo ratio between sand and tarmac arriving on screen as 0.91 against 0.76. The
       palette was never the problem — the exposure was eating it. At irradiance 1.02 the same
       five surfaces come out 0.82 / 0.85 / 0.75 / 0.67 / 0.60, which is the spread the ladder
       was designed to give and almost exactly what dusk already produces.

       Worth stating plainly: with a filmic curve, ADDING LIGHT REMOVES CONTRAST once you are
       past the knee. Every instinct says a diagnostic mode should be brightly lit. */
    sun.color.setHex(0xFFD9A8); sun.intensity = 1.8;
    sunFill.color.setHex(0xCADCEA); sunFill.intensity = 0.62;
    SUN_OFF.set(-380, 210, 260);
    daySky.color.setHex(0xBBD6E8); daySky.groundColor.setHex(0x7A6E5C);
    daySky.intensity = 0.55;
  }

  applyLift(dusk, night);

  // Bloom is a lit-window effect. Against a pale sky it flares every edge and destroys the
  // profiles and massing that Day and Silhouette exist to judge.
  bloom.enabled  = night || dusk;
  // NoToneMapping in Plan so the render is the canvas, byte for byte. Tone mapping is part of the
  // program cache key, so three recompiles for us and the switch costs one frame.
  renderer.toneMapping = (plan || check) ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
  /* ===========================================================================
     GLOW IS RADIUS, NOT STRENGTH — and the numbers on the device say we can afford it.

     Measured on the Fold at the place camera on Corniche: 3.4 ms median / 6.0 p95 in the light
     case and 9.4 / 12.1 in the heaviest. Against a 60 Hz budget of 16.7 ms that is between four
     and thirteen milliseconds of headroom in every frame, so the question stops being whether to
     spend and becomes what to spend it on.

     A city glows because the light LEAVES the source. A lit window at this distance is a couple of
     pixels; at radius 0.55 its bloom is a couple of pixels too, so the window gets brighter and
     nothing around it changes — which is precisely "brighter windows, no glow". Widening the
     radius spreads each source into the air around it, and because the sources are dense the
     halos overlap and become a wash over the whole downtown. That wash is the effect.

     STRENGTH COMES DOWN AS RADIUS GOES UP. They multiply, so holding strength while widening
     turns the city into a smear. 0.60 at radius 0.55 and 0.46 at radius 0.95 put roughly the same
     energy on screen, distributed very differently.

     THRESHOLD DOWN AT NIGHT, 0.46 to 0.34. The facades sit just under the old bar, so only the
     brightest windows were blooming at all. Dusk stays at 0.82 for the reason already written
     below it: at dusk the stone is bright and a low bar glows the entire city.

     Bloom is a full-screen pass, so the cost is resolution and iteration count, not scene
     complexity — a wider radius is very close to free at this frame time. */
  bloom.radius   = dusk ? 0.62 : 0.95;
  bloom.strength = dusk ? 0.24 : 0.46;
  /* THRESHOLD IS THE OTHER HALF OF THE MILKY LOOK. At 0.46 almost every sunlit stone face in a
     dusk frame clears the bar, so the bloom pass was not picking out windows and lamps, it was
     glowing the entire city. At 0.82 only the emissive surfaces qualify, which is the whole
     point of having the effect. Night can stay low: at night very little is above 0.46 except
     the windows anyway. */
  bloom.threshold = dusk ? 0.82 : 0.34;
  /* 1.15 -> 1.24 at night, and no further. Exposure lifts everything including the sea, so it is
     the wrong lever for readability and the right one only for the small amount the emissive
     boost cannot reach — the moonlit faces beside a lit window. Past about 1.3 the water starts
     coming back and the frame flattens. */
  renderer.toneMappingExposure = night ? 1.24 : dusk ? 1.02 : 1.0;

  world.traverse(o => {
    /* SPRITES ARE NOT MESHES, and the grid labels have been visible in every view since the day
       they were added.

       The planOnly test twenty lines below switches them off outside Plan, and it has never once
       run: this guard returns before reaching it, because a sprite reports isSprite and not
       isMesh. Nobody noticed while the camera sat above an island 380 units across and the labels
       were a few pixels of teal. Opening the hero at street level put a two-metre "8" in the
       middle of the shot.

       Handled before the mesh guard rather than by loosening it — everything after this line
       reads o.material as a surface material, which a SpriteMaterial is not. */
    if (o.userData.planOnly){ o.visible = plan; return; }
    if (!o.isMesh) return;
    /* HELPERS ARE NOT SCENERY. The district tap targets are horizontal discs wider than the
       coastline, held off screen by material.visible = false — and this loop was overwriting that
       material with a visible one in Day and Silhouette, laying a solid lid over every island.
       Anything that exists for input rather than for looking at is skipped outright. */
    if (o.userData.helper) return;
    /* HIDDEN BY THE FOOTPRINTS PASS, AND IT STAYS HIDDEN.

       This is where the second city came from. hideFabric wrote o.visible = false and this
       traverse wrote o.visible = true again — an InstancedMesh reports isMesh, so every one of
       them fell through to the ground test below and came back on. Both callers of hideFabric
       call applyView three lines later, so the hide has never once survived its own stack, in
       either order. v58's race fix was correct and made no difference for that reason.

       visible is not durable state; it is whatever the last traverse said. The mark is. Checked
       ahead of nightOnly and ahead of the plan/ground line because both of those write visible,
       and this flag outranks a view: a mesh the footprints replaced has no version in any
       lighting mode. */
    if (o.userData.fpHidden){ o.visible = false; return; }
    /* Same durability argument as fpHidden: warm-up hides a mesh so its first upload can be paid on
       a later frame, and applyView writing visible=true underneath would undo that silently. */
    if (o.userData.warmHidden){ o.visible = false; return; }
    /* NIGHT-ONLY MESHES EXIST OR THEY DO NOT — there is no daytime version of them.

       The lamp pools are additive quads standing in for 628 point lights that could not be real
       ones. Handing them to any of the branches below is wrong in a different way each time:
       origMat in Day leaves a warm additive smear across a sunlit ground plan, dayMat makes them
       opaque pale discs, and silMat makes them flat black discs in the one view built to read
       massing. So they are checked before all of it, and simply switched off.

       Plan is covered for free: it is neither night nor dusk. */
    /* PLAN-ONLY MESHES: the grid reference labels. Same argument as nightOnly in reverse — they
       exist for one view and there is no version of them for the others, so they are switched
       before any of the material branches can hand them a material for a mode they never appear
       in. Checked ahead of the ground test below, which would otherwise hide them along with the
       buildings. */
    if (o.userData.nightOnly){
      o.visible = night || dusk;
      if (o.visible) o.material = dusk && o.userData.duskMats ? o.userData.duskMats
                                                             : o.userData.origMat;
      return;
    }
    /* Plan hides everything that is not island ground — buildings, props, the lot — so nothing
       can occlude or shade the surface under examination. */
    o.visible = plan ? o.userData.ground === true : true;
    if (plan){
      if (o.userData.ground) o.material = o.userData.planMats;
      return;
    }
    /* CHECK: nothing hidden, and the ground keeps its plan material so the painted streets read at
       full contrast underneath the buildings standing on them. Everything else takes the flat day
       material — no dusk warmth, no night emissive, no silhouette flattening — because a building
       has to be distinguishable from the tarmac it is sitting on and from the building beside it. */
    if (check){
      o.material = o.userData.ground ? (o.userData.planMats || o.material)
                 : (o.userData.litMat ? o.userData.origMat : (o.userData.dayMats || dayMat));
      return;
    }
    /* Props opt out of every diagnostic except silhouette. A palm frond is already the colour a
       palm frond should be under any light in this scene, and turning it into pale stone in the
       one mode built to judge a daytime render would be a strange thing to have built. */
    if (o.userData.litMat){
      o.material = sil ? silMat : o.userData.origMat;
      return;
    }
    if (night || dusk){
      o.material = (dusk && o.userData.duskMats) ? o.userData.duskMats : o.userData.origMat;
      return;
    }
    o.material = sil ? silMat : (o.userData.dayMats || dayMat);
  });

  water.visible = !plan;
  water.material = sil ? silWater : day ? dayWater : dusk ? duskWater
                 : water.userData.origMat;
  /* The far sea takes the same material. It is flat and unanimated, but it has to be the same
     COLOUR as the near water or the join becomes a visible line across the middle of the frame.

     GUARDED, because this file and w2h-world.js can be deployed a minute apart. farSea is a new
     return value, and an older module simply does not have one — which took the whole page down
     with "Cannot set properties of undefined" rather than degrading to a scene with a short
     horizon. Anything read out of another module's return should assume that module might be a
     version behind; on GitHub Pages, with its caching, it frequently is. */
  if (farSea){ farSea.material = water.material; farSea.visible = !plan; }

  applyLOD();
}

/* THE PROGRAM DUMP GOES TO A FILE, NOT TO THE CONSOLE.

   The console needs DevTools, DevTools needs the page open on a desktop, and the desktop is behind
   a network that blocks github.io. A diagnostic you cannot reach is not a diagnostic — the same
   argument the URL flags in this file were written under.

   So it saves a text file instead. One tap, on the device that has the problem, over the network
   that works. Shown only under #debug, and only once the first frame has been drawn, because
   renderer.info.programs fills as programs are built.

   TAP IT AT THE END OF A FULL LOOP. The count climbs with islands — 53 with Corniche alone, 96
   once all five are up — so a dump taken during the opening leg describes a fifth of the problem. */
document.getElementById('vProg').addEventListener('click', () => {
  try {
    const ps = renderer.info.programs || [];
    const by = {};
    for (const p of ps) by[p.name || '?'] = (by[p.name || '?'] || 0) + 1;
    const lines = [
      'programs ' + ps.length,
      'build    ' + B_NAV + ' / ' + B_CITY + ' / ' + B_WORLD + ' / ' + B_PROPS,
      'gf       ' + DISTRICTS.map(x => x.id.slice(0,4) + ' ' +
        (gfState.get(x.id) || '-') + (x.trackN ? ' t' + x.trackN : '') +
        (x.golfN ? ' g' + x.golfN : '') + (x.parkRealN ? ' p' + x.parkRealN : '')).join('  '),
      'state    ' + state + (activeDistrict ? ' / ' + activeDistrict.id : '') + '   view ' + view,
      'built    ' + DISTRICTS.filter(d => d.built).map(d => d.id).join(', '),
      'tex      ' + renderer.info.memory.textures + '   geo ' + renderer.info.memory.geometries,
      '',
      /* THE TIMINGS TRAVEL WITH THE DUMP.

         The program list and the phase block answer halves of the same question and were arriving
         separately — a text file and a screenshot, taken minutes apart, sometimes from different
         loads. Twice now I have had a dump with no way to tell whether the run it came from was
         faster or slower. One file, both halves, same load. */
      /* WHETHER compileAsync IS CAPABLE OF WAITING AT ALL.

         three.js implements it against KHR_parallel_shader_compile: it polls COMPLETION_STATUS_KHR
         until the driver says a program is linked. Without the extension there is nothing to poll,
         the promise resolves straight away, and `compile 23 ms` means only that the call returned —
         not that anything was compiled. The link cost then lands on the first draw, which is
         precisely where upload is measuring nineteen seconds.

         One line, and it decides between "the driver cannot defer compilation and we must do less
         of it" and "the measurement is wrong". */
      'flags    shadow ' + (NO_SHADOW ? 'OFF' : 'on') + '   env ' + (NO_ENV ? 'OFF' : 'on') +
        '   shadowMap ' + (sun.shadow ? sun.shadow.mapSize.x : '?'),
      'gl       parallel-compile ' +
        (renderer.getContext().getExtension('KHR_parallel_shader_compile') ? 'YES' : 'NO') +
        '   ' + (() => { try {
            const gl = renderer.getContext();
            const d = gl.getExtension('WEBGL_debug_renderer_info');
            return d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
          } catch (e){ return '?'; } })(),
      'frames   ' + FRAME_MS.join(', ') + '  ms',
      /* Only on ?f0split loads, because only those loads have it. Absent means the flag was not
         set, which is a different statement from zero and has to look different. */
      ...(F0INFO.prog0 === undefined ? [] : [
        'f0scene  vis ' + F0INFO.vis + ' meshes, ' + F0INFO.visTri.toLocaleString() +
          ' tri visible   drew ' + F0INFO.tri.toLocaleString() + ' tri in ' + F0INFO.calls +
          ' calls   prog ' + F0INFO.prog0 + ' -> ' + F0INFO.prog1 +
          '  (+' + (F0INFO.prog1 - F0INFO.prog0) + ' linked inside f0plain)',
        'f0resid  hid ' + F0INFO.hid + ' meshes, ' + F0INFO.hidTri.toLocaleString() +
          ' tri resident-not-drawn   by warm ' + F0INFO.byWarm + '  by fp ' + F0INFO.byFp +
          '  by self ' + F0INFO.bySelf + '   geo ' + F0INFO.geo0 + '  tex ' + F0INFO.tex0,
        '',
        'f0each   background alone, no meshes: ' + F0INFO.bgMs + ' ms',
        ...(F0INFO.each || []).map(e =>
          '  ' + String(e.ms).padStart(6) + ' ms  ' + String(e.tri).padStart(7) + ' tri  ' +
          e.mat + '  "' + e.n + '" in "' + e.par + '"' +
          (e.tex ? '\n            ' + e.tex : ''))]),
      'warm     ' + (WARM_COST.length ? WARM_COST.length + ' meshes, ' +
          Math.round(WARM_COST.reduce((a, w) => a + w.ms, 0)) + ' ms total' : 'off'),
      ...(WARM_COST.length ? ['', 'slowest first draws:'].concat(
        WARM_COST.slice().sort((a, b) => b.ms - a.ms).slice(0, 25)
          .map(w => '  ' + String(w.ms).padStart(6) + ' ms  ' + String(w.c).padStart(6) + ' inst  ' +
                    String(w.v).padStart(6) + ' verts  ' + w.m + '  "' + w.n + '" in "' + w.par +
                    '"\n            ' + w.t)) : []),
      /* THE ALLOCATION, IN THE UNITS THAT MAKE IT ARGUABLE. Pixels and samples, not megabytes,
         because the fix is a cap on one of them. */
      'target   ' + (() => { try {
          const t = composer.renderTarget1, db = new THREE.Vector2();
          renderer.getDrawingBufferSize(db);
          return 'css ' + window.innerWidth + 'x' + window.innerHeight +
                 '  dpr ' + renderer.getPixelRatio() +
                 '  buffer ' + Math.round(db.x) + 'x' + Math.round(db.y) +
                 '  rt ' + t.width + 'x' + t.height +
                 '  samples ' + (t.samples || 0) +
                 '  = ' + (t.width * t.height * Math.max(1, t.samples || 1) / 1e6).toFixed(1) +
                 ' Mpx-samples';
        } catch (e){ return '?'; } })(),
      '',
      'phase    ' + Object.entries(PH).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => k + ' ' + Math.round(v)).join('  '),
      'stages   ' + Object.entries(PERF).filter(([k]) => k[0] !== '#')
        .sort((a, b) => b[1] - a[1])
        .map(([k, v]) => k + ' ' + Math.round(v)).join('  '),
      '',
      'by shader: ' + Object.entries(by).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => k + ' x' + v).join(', '),
      '',
      ...ps.map((p, i) => String(i).padStart(3) + '  ' + (p.name || '?') + '\n     ' +
                          String(p.cacheKey || '')),
    ];
    const blob = new Blob([lines.join('\n')], { type:'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'programs-' + ps.length + '.txt';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  } catch (e){ noteError('progs', e); }
});

/* COPY, WITH A FALLBACK, BECAUSE navigator.clipboard IS NOT A GIVEN.

   It requires a secure context (this site is HTTPS, so that part is fine) but some in-app and
   embedded webviews — exactly the kind a phone browser's share sheet or an assistant overlay
   can be running inside — block the permission outright, and there is no reliable way to detect
   that in advance except trying it and catching the rejection. The fallback is the same trick
   pages used before the Clipboard API existed: put the text in a real (if invisible) textarea,
   select it, and ask the browser to copy the current selection instead of asking permission for
   programmatic access. Button label flips to "Copied" briefly either way, so success looks the
   same to Heinrich regardless of which path actually ran. */
document.getElementById('pickoutCopy').addEventListener('click', () => {
  const btn = document.getElementById('pickoutCopy');
  const text = document.getElementById('pickoutTxt').textContent;
  const flash = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1200); };
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      ta.remove();
      flash();
    } catch (e){ noteError('pickCopy', e); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flash, fallback);
  } else {
    fallback();
  }
});

document.getElementById('vMode').addEventListener('click', () => {
  const next = MODES[(MODES.indexOf(view) + 1) % MODES.length];
  /* lift MEANS SOMETHING DIFFERENT EITHER SIDE OF THIS BOUNDARY — a height multiplier in the lit
     modes, a 0-to-1 pitch in Plan and Check — so carrying a value across reinterprets it and jumps
     the camera. A lift of 0.8 left over from orbiting would arrive in Check as most of the way to
     vertical.

     AND THE TWO MAP MODES WANT DIFFERENT ANSWERS, which is what zeroing both of them got wrong.

     Check is a comparison view: it exists to be held against the lit modes, so it should open on
     exactly the framing you just left, and 0 does that. Plan is a plan. An overhead view is the
     whole meaning of the word, and it was opening at the same oblique as everything else.

     Reaching overhead by hand was not a workaround either — in these views one finger pans, so the
     only control that touches lift is the two-finger vertical midpoint, and that gesture is also
     pinch-to-zoom and twist-to-rotate. On a folded Fold the fingers are two centimetres apart and
     every attempt to raise the pitch also changes the zoom and the bearing. The control existed and
     could not be operated. It still works for fine adjustment; it is no longer the only way. */
  const wasMap = view === 'plan' || view === 'check';
  const isMap  = next === 'plan' || next === 'check';
  if (isMap) orbit.lift = next === 'plan' ? 1 : 0;
  else if (wasMap) orbit.lift = 0;
  applyView(next);
});

/* ---------- tap ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let dx0=0, dy0=0, dt0=0;

/* A Map, not a pair of variables. Two fingers on a phone arrive as two independent pointer
   streams and the second one can be released first; keeping them by pointerId is the only way
   the pinch distance stays meaningful when that happens. */
const pointers = new Map();
let pinch0 = 0, zoom0 = 1, lx = 0, ly = 0, twist0 = 0, yaw0 = 0, mid0 = 0, lift0 = 0;

canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (pointers.size === 1){
    dx0 = e.clientX; dy0 = e.clientY; dt0 = performance.now();
    lx = e.clientX; ly = e.clientY;
  } else if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch0 = Math.hypot(a.x - b.x, a.y - b.y);
    zoom0  = orbit.zoom;
    twist0 = Math.atan2(b.y - a.y, b.x - a.x);
    yaw0   = orbit.yaw;
    mid0   = (a.y + b.y) * 0.5;
    lift0  = orbit.lift;
  }
});

/* TWO GESTURE MODELS, AND WHICH ONE APPLIES DEPENDS ON WHAT THE VIEW IS FOR.

   In the lit modes the camera is a diorama turntable: one finger orbits, because that is the whole
   interaction and there is nothing to pan to — the nav decides what you are looking at.

   Plan and Check are inspection views, and inspecting means going somewhere specific and comparing
   it with somewhere else. Every map on this phone pans on one finger, so these do too: one finger
   drags the ground, two fingers pinch to zoom and twist to rotate. Pan on two fingers WHILE
   pinching, which is where I started, is unusable on a folded Fold — the fingers are two
   centimetres apart and every pan reads as a pinch. */
const mapGesture = () => view === 'plan' || view === 'check';

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  /* THE CAMERA DOES NOT MOVE WHILE PICKING. This is the actual fix, not the button — a tap that
     drifts a few pixels during a normal one-finger orbit gets read as a drag and orbit.on flips
     true, and pointerup's own drag check (12px) then discards it as "not a tap" before pickRecord
     ever runs. Freezing every camera update here means there is no drag to misread; whatever the
     finger does before lifting, the pointerup handler below sees a still camera and a clean tap. */
  if (PICK.mode !== 'off') return;

  if (pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0 > 8){
      // Pinching APART should move the camera closer, so the ratio is inverted.
      orbit.zoom = Math.max(ZOOM_MIN, Math.min(2.6, zoom0 * (pinch0 / d)));
      orbit.on = true;
      /* Twist to rotate, in the map modes only. Two fingers on a turntable already mean zoom and
         adding rotation to them there would make every pinch drift the heading. */
      if (mapGesture()){
        let t = Math.atan2(b.y - a.y, b.x - a.x) - twist0;
        while (t >  Math.PI) t -= Math.PI * 2;
        while (t < -Math.PI) t += Math.PI * 2;
        orbit.yaw = yaw0 + t;
        /* AND THE MIDPOINT'S VERTICAL TRAVEL TILTS, which is the gesture every map on this phone
           uses and the one I left out. One finger pans in these modes, so there was nothing left
           to tilt with — I opened the tilt clamp in the two modes whose tilt gesture I had just
           removed. Dragging two fingers UP raises the camera toward overhead. */
        const my = (a.y + b.y) * 0.5;
        orbit.lift = Math.max(0, Math.min(1, lift0 + (mid0 - my) / window.innerHeight * 2.2));
        orbit.on = true;
      }
    }
    return;
  }

  if (mapGesture()){
    /* PAN, IN WORLD UNITS RATHER THAN PIXELS.

       The conversion is the height of the view frustum at the target distance divided by the
       viewport height, so a finger holds the same piece of ground at any zoom or any island scale.
       Without it a drag that crosses Al Maryah barely moves on Corniche.

       Rotated by the camera's heading, because the pan has to be along the screen axes and those
       are only the world axes when the yaw happens to be zero. Screen-up maps to -Z when facing
       north, and the camera looks from +Z toward the target, so dragging DOWN moves the ground
       down the screen, which means the camera walks toward +Z. */
    const dxp = e.clientX - lx, dyp = e.clientY - ly;
    const dist = Math.max(1, cur.dist * orbit.zoom);
    const perPx = 2 * dist * Math.tan(cur.fov * Math.PI / 360) / window.innerHeight;
    const a = cur.angle + orbit.yaw;
    const ca = Math.cos(a), sa = Math.sin(a);
    const wx = -dxp * perPx, wz = -dyp * perPx;
    orbit.panX += wx * ca - wz * sa;
    orbit.panZ += -wx * sa - wz * ca;
    lx = e.clientX; ly = e.clientY;
    if (Math.hypot(e.clientX - dx0, e.clientY - dy0) > 12) orbit.on = true;
    return;
  }

  /* Scaled by viewport width, so the same swipe turns the model by the same amount on any
     screen — a fixed pixels-per-radian figure makes the gesture feel twice as fast on a folded
     Z Fold as on an unfolded one. */
  orbit.yaw  -= (e.clientX - lx) / window.innerWidth * 3.2;
  orbit.lift += (e.clientY - ly) / window.innerHeight * 1.9;
  /* The upper clamp opens right up in the inspection modes. 1.5 tops out at a shallow oblique,
     and the registration question — is this building on this street — can only be answered from
     directly above. It stays clamped in the lit modes, where flying over the top of the diorama
     and seeing it end is the thing the clamp was put there to prevent. */
  orbit.lift  = Math.max(-0.55, Math.min(1.5, orbit.lift));
  lx = e.clientX; ly = e.clientY;
  if (Math.hypot(e.clientX - dx0, e.clientY - dy0) > 12) orbit.on = true;
});

const endPointer = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0; };
canvas.addEventListener('pointercancel', endPointer);

// Desktop convenience while working on the thing; harmless on a phone.
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.zoom = Math.max(ZOOM_MIN, Math.min(2.6, orbit.zoom * (1 + Math.sign(e.deltaY) * 0.10)));
  orbit.on = true;
}, { passive:false });
canvas.addEventListener('pointerup', e => {
  const many = pointers.size > 1;
  endPointer(e);
  // Tap, not drag, and not the tail of a pinch. Without this every camera drag fires a selection.
  // The 12px/600ms check exists to reject an accidental tap in the middle of an orbit drag — but
  // while picking, the camera never moves (frozen above), so there is no drag to distinguish a
  // tap from, and this same check was the second half of why picking silently did nothing before.
  if (many) return;
  if (PICK.mode === 'off' &&
      (Math.hypot(e.clientX-dx0, e.clientY-dy0) > 12 || performance.now()-dt0 > 600)) return;
  ndc.x =  (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);

  if (state === STATE.WORLD){
    /* PICK.mode WAS NEVER CHECKED HERE, AND THAT IS THE BUG. Every tap in world view raycast
       pickTargets and navigated into whatever it hit, unconditionally — the district/place branch
       below has its own `if (PICK.mode !== 'off')` gate, this one never did, so picking a point at
       the world level was never actually possible: the tap always won and dropped you into an
       island before a point could be recorded.

       Fixed by checking pick mode FIRST, against a plain world-space ground plane rather than a
       district's own tilted/scaled one — there is no single active district at this state, and
       there does not need to be: world view already shows every island in the raw diorama frame,
       so the ray-plane hit IS the coordinate a DIORAMA.<id> entry wants, with no district offset,
       scale, or rotation to invert. Passed through pickRecord with an identity transform
       (x:0, z:0, rot:0, scale 1) rather than a second code path, so the existing marker and
       readout logic keeps working unchanged. */
    if (PICK.mode !== 'off'){
      const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -(GROUND + 0.4));
      const p = new THREE.Vector3();
      if (ray.ray.intersectPlane(plane, p)) pickRecord({ x:0, z:0, rot:0 }, 1, p);
      return;
    }
    const hit = ray.intersectObjects(pickTargets, false)[0];
    if (hit) setDistrict(hit.object.userData.district);
    return;
  }
  /* DISTRICT OR PLACE — PICKING NEEDS BOTH. activeDistrict stays set once you drill into a place
     (setPlace assigns it the same as setDistrict does), so the ground-plane math below is
     identical either way; only the ORIGINAL place-anchor-navigation gate below cared about the
     distinction. Restricting this whole block to DISTRICT alone meant a pick attempt taken from
     inside a place view — which is where anyone checking a specific landmark's surroundings
     actually is — hit no matching branch at all and silently did nothing, no error, no marker,
     nothing to click through to a fix. */
  if ((state === STATE.DISTRICT || state === STATE.PLACE) && activeDistrict){
    const d = activeDistrict;
    const s = d.dispScale || 1;
    // The plane the user is tapping is the island's VISIBLE top face, which the group scale
    // lifts along with everything else.
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -(GROUND + 0.4) * s);
    const p = new THREE.Vector3();
    if (!ray.ray.intersectPlane(plane, p)) return;
    let best=null, bestD=Infinity;
    d.placeAnchors.forEach(a => {
      const w = anchorWorld(d, a);
      const dd = Math.hypot(w.x-p.x, w.z-p.z);
      if (dd < bestD){ bestD = dd; best = a; }
    });
    /* PICK TAKES OVER THE TAP ENTIRELY WHEN ACTIVE — no place-navigation underneath it, so a
       pick attempt can never accidentally jump you to the nearest gate instead of recording a
       point. p here is already the exact scene-local ground point; pickRecord below applies the
       same inverse of anchorWorld's transform (offset, dispScale, rotation) that a first version
       of this got wrong by skipping entirely — silently correct only on Corniche, where both
       happen to be zero. */
    if (PICK.mode !== 'off'){ pickRecord(d, s, p); return; }
    // Gate in DISPLAYED units. d.r is the island's true radius; the thing on screen is d.r * s,
    // and a gate a seventh of the size of the island it guards rejects almost every real tap.
    if (best && bestD < d.r * s) setPlace(d, best);
  }
});

/* ---------- labels ---------- */
const isleEls = new Map();
DISTRICTS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'isle';
  el.innerHTML = '<i></i>' + d.name;
  document.body.appendChild(el);
  isleEls.set(d, el);
  d.placeAnchors.forEach(a => {
    const p = document.createElement('div');
    p.className = 'isle';
    p.innerHTML = '<i></i>' + a.label;
    document.body.appendChild(p);
    isleEls.set(a, p);
  });
});
const proj = new THREE.Vector3();

/* LABELS THAT DO NOT SIT ON TOP OF EACH OTHER.

   Each label was projected and written to the DOM the instant it was computed, so nothing ever
   knew where any other label was. On Corniche that put five names inside about ninety pixels —
   "EmiratesEtihadPalaceTowers" — which does not read as crowded, it reads as corrupt. Adding
   venues made it worse, and it was going to keep getting worse, because the fix is structural:
   you cannot resolve a collision one element at a time.

   So it is two passes. Project everything, then place in order, keeping the boxes that have
   already landed and testing each new one against them.

   NEAREST FIRST, by projected depth. When two names cannot both be shown the nearer one is the
   one the camera is looking at, and a stable rule beats a prettier one that reorders itself
   every frame as the camera drifts.

   A label that collides is nudged UP in 16-pixel steps before it is dropped, because the
   overlaps are nearly always horizontal — venues strung along a shoreline at the same height —
   and stacking them vertically is what a mapmaker would do. Four steps, then it is hidden: a
   label 64 pixels above its own dot has stopped pointing at anything.

   Measured off the live element rather than estimated from string length: these are proportional
   and the difference between "SeaWorld" and "The Galleria Al Maryah Island" is not something to
   approximate. offsetWidth on a hidden element reads 0, hence the fallback. */
const LABEL_PAD = 4, NUDGE = 16, NUDGE_MAX = 4;

function screenOf(x, y, z){
  proj.set(x, y, z).project(camera);
  if (proj.z > 1) return null;
  return { x:(proj.x*0.5+0.5) * window.innerWidth,
           y:(-proj.y*0.5+0.5) * window.innerHeight,
           depth: proj.z };
}

function overlaps(a, b){
  return Math.abs(a.x - b.x) * 2 < (a.w + b.w) + LABEL_PAD * 2 &&
         Math.abs(a.y - b.y) * 2 < (a.h + b.h) + LABEL_PAD * 2;
}

/* MEASURED ONCE PER TEXT, NOT ONCE PER FRAME PER LABEL.

   A profile put `get offsetWidth` at 5.2 per cent of the whole load window with layoutLabels at
   2.3 — and unlike everything else on that list this is paid on EVERY frame for the life of the
   page, not once during the build.

   The cause was the shape of the loop rather than the number of labels. It read offsetWidth, then
   wrote style.left, style.top and a class, then read offsetWidth on the next label — and a read
   after a write forces the browser to flush layout before it can answer. Ten labels, ten forced
   layouts, sixty times a second.

   A label's size only changes when its text does, so it is cached against the text and remeasured
   when that changes. A hidden element reports zero, so a zero is never cached — otherwise the
   first frame a label is off-screen would poison its width for good. */
function labelSize(el){
  if (el._mw && el._mTxt === el.textContent) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  if (w){ el._mw = w; el._mh = h; el._mTxt = el.textContent; }
}

function layoutLabels(items){
  items.sort((a, b) => a.p.depth - b.p.depth);
  /* EVERY READ BEFORE ANY WRITE. On the frames where nothing has been remeasured this loop touches
     no layout at all; on the frames where something has, it costs one flush rather than ten. */
  for (const it of items) labelSize(it.el);
  const placed = [];
  for (const it of items){
    const w = it.el._mw || 70;
    const h = it.el._mh || 24;
    let y = it.p.y, box = null, ok = false;
    for (let n = 0; n <= NUDGE_MAX; n++){
      box = { x:it.p.x, y:y - n * NUDGE, w, h };
      if (!placed.some(q => overlaps(box, q))){ ok = true; break; }
    }
    if (!ok){ it.el.classList.remove('on'); continue; }
    placed.push(box);
    it.el.style.left = box.x + 'px';
    it.el.style.top  = box.y + 'px';
    it.el.classList.add('on');
  }
}

function updateLabels(){
  const items = [];
  DISTRICTS.forEach(d => {
    const el = isleEls.get(d);
    if (state === STATE.WORLD){
      const p = screenOf(d.x, GROUND * (d.dispScale || 1) + 26, d.z);
      if (p) items.push({ el, p }); else el.classList.remove('on');
    } else el.classList.remove('on');

    d.placeAnchors.forEach(a => {
      const el2 = isleEls.get(a);
      if (state !== STATE.WORLD && d === activeDistrict){
        const w = anchorWorld(d, a);
        const p = screenOf(w.x, w.y + 4, w.z);
        if (p) items.push({ el:el2, p }); else el2.classList.remove('on');
      } else el2.classList.remove('on');
    });
  });
  layoutLabels(items);
}

/* ---------- post ---------- */
/* ?dpr=N and ?msaa=0 — THE TWO NUMBERS THAT DECIDE WHAT THE COMPOSER ALLOCATES.

   p0render came back at 21,037 ms with the world HIDDEN, against bloom 69, tilt 16, output 15 and
   SMAA 18. An empty scene through the RenderPass. Nothing is being drawn, so the cost is not
   drawing — it is the target the pass draws into.

   Two things size that target and neither has ever been printed. It is allocated at window size
   times the device pixel ratio, which on a Fold is not 1. And EffectComposer asks for a
   MULTISAMPLED target on WebGL2 — four samples by default — so the allocation is four times what
   the resolution suggests.

   MSAA is also redundant here: SMAA is in this same chain doing the antialiasing, and the renderer
   itself was constructed with antialias:false for exactly that reason. Nobody asked for four-sample
   MSAA; EffectComposer's default did.

   Flags rather than a change, because two candidates and one load each settles it — and a
   diagnostic that needs a deploy per attempt is one nobody runs. */
const DPR_CAP = (() => {
  const m = location.search.match(/[?&]dpr=(\d+(?:\.\d+)?)/);
  const v = m ? parseFloat(m[1]) : 0;
  return isFinite(v) && v > 0 ? v : 0;
})();
if (DPR_CAP) renderer.setPixelRatio(Math.min(renderer.getPixelRatio(), DPR_CAP));

const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
if (location.search.includes('msaa=0')){
  [composer.renderTarget1, composer.renderTarget2].forEach(t => { if (t) t.samples = 0; });
}
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.60, 0.55, 0.46);
composer.addPass(bloom);

/* TILT-SHIFT. The cue that makes a city read as a MODEL rather than a city. Human vision has
   effectively infinite depth of field at this scale, so a frame with a narrow sharp band
   cannot be a real place — the brain concludes the subject is small and close. */
const TiltShift = {
  uniforms:{ tDiffuse:{value:null}, amount:{value:1.0}, focus:{value:0.47},
             aperture:{value:0.16}, strength:{value:0.0023} },
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv;' +
    ' gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
    'uniform sampler2D tDiffuse; uniform float amount, focus, aperture, strength;',
    'varying vec2 vUv;',
    'void main(){',
    '  float d = max(abs(vUv.y-focus)-aperture, 0.0);',
    '  float b = smoothstep(0.0,0.34,d)*strength*amount;',
    '  vec4 c = texture2D(tDiffuse,vUv)*0.226;',
    '  c += texture2D(tDiffuse,vUv+vec2( b*1.0, b*0.4))*0.129;',
    '  c += texture2D(tDiffuse,vUv+vec2(-b*1.0,-b*0.4))*0.129;',
    '  c += texture2D(tDiffuse,vUv+vec2( b*0.4,-b*1.0))*0.117;',
    '  c += texture2D(tDiffuse,vUv+vec2(-b*0.4, b*1.0))*0.117;',
    '  c += texture2D(tDiffuse,vUv+vec2( b*2.0, b*0.8))*0.071;',
    '  c += texture2D(tDiffuse,vUv+vec2(-b*2.0,-b*0.8))*0.071;',
    '  c += texture2D(tDiffuse,vUv+vec2( b*0.8,-b*2.0))*0.070;',
    '  c += texture2D(tDiffuse,vUv+vec2(-b*0.8, b*2.0))*0.070;',
    '  gl_FragColor = c;',
    '}'
  ].join('\n')

const tiltPass = new ShaderPass(TiltShift);
composer.addPass(tiltPass);
composer.addPass(new OutputPass());
const smaa = new SMAAPass(window.innerWidth * renderer.getPixelRatio(),
                          window.innerHeight * renderer.getPixelRatio());
composer.addPass(smaa);

/* SPLIT ON THE FIRST CALL ONLY, because this function is 4,527 ms of a 12 second load — larger
   than building the entire city — and it is four lines long.

   The pixel ratio is already clamped to 2, so the obvious explanation was wrong. Three of these
   four calls only record a size in three.js and defer the GPU allocation; one of them does not,
   and which one it is decides whether the fix is a smaller target, a cheaper pass, or dropping a
   pass entirely. Four marks is cheaper than another theory. */
let _resized = false;
function resize(){
  const w = window.innerWidth, h = window.innerHeight, pr = renderer.getPixelRatio();
  /* REFUSE A ZERO. Android reports innerWidth or innerHeight as 0 during a fold transition and
     when the tab is backgrounded, and this device folds. aspect then becomes 0, Infinity or NaN;
     fitDist divides by it and hands goal.dist an Infinity; cur.dist lerps toward it and the
     camera position goes non-finite. Nothing renders after that and nothing ever recovers,
     because the only thing that would re-frame is another resize.
     A black screen that survives every subsequent frame is the signature. */
  if (!(w > 0 && h > 0)) return;
  const first = !_resized; _resized = true;
  let m = first ? performance.now() : 0;
  const mark = k => { if (first){ PH[k] = performance.now() - m; m = performance.now(); } };

  renderer.setSize(w, h, false);            mark('r.setSize');
  composer.setSize(w, h);                   mark('composer');
  bloom.setSize(w, h);                      mark('bloom');
  smaa.setSize(w * pr, h * pr);             mark('smaa');
  const was = camera.aspect;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (first) console.info('resize ' + w + 'x' + h + ' pr=' + pr);
  /* RE-FRAME, because the shot distance is now a function of the aspect and the aspect changes
     under it. This device folds. A shot composed at 0.46 and then unfolded to 1.0 would keep the
     distance it was given and hold the subject at less than half the size the new frame wants,
     which is the same fault the hard-coded constants had — just arriving later. Damped, so the
     re-frame reads as the camera easing rather than as a jump. */
  if (!first && was && Math.abs(w / h - was) > 0.01) reframe();
}

/* Re-issues whichever shot is current. Nothing else changes: same target, same subject, same
   state — only the distance and elevation, which are the two things that depend on the frame. */
function reframe(){
  if (state === STATE.PLACE && activeDistrict && activePlace) setPlace(activeDistrict, activePlace);
  else if (state === STATE.DISTRICT && activeDistrict)         setDistrict(activeDistrict);
  else                                                          setWorld();
}
phase('liftReg');
window.addEventListener('resize', resize);
resize();
phase('resize');
// Dusk before setWorld, so the first frame is already the product state rather than a flash of
// unlit night while the sky texture and key light are configured.
applyView('dusk');
phase('applyView');

/* OPEN ON THE CORNICHE, NOT ON THE ARCHIPELAGO.

   At world zoom the five islands are five brown silhouettes; nothing in the frame says Abu Dhabi
   until you tap. One level down, Emirates Palace, Etihad Towers and ADNOC are all in shot, and the
   scene reads in the first second rather than after two taps.

   setWorld still exists and Back still reaches it — the world view is a real state and a good one,
   it is simply the wrong opening shot for a hero.

   THE CAMERA IS SNAPPED, NOT FLOWN. setDistrict composes a goal and the frame loop eases towards
   it, which is right for a transition the user asked for and wrong for the first frame: easing
   from the default world position means the scene opens by flying in from somewhere nobody chose.
   Copying goal into cur once, before the loop starts, makes the opening shot the shot. */
setWorld();
/* THE OPENING SHOT IS LEG 0's SHOT, composed here rather than defaulting to the district view.

   attract.i starts at 0 and the first advance goes to 1, so whatever is composed here IS leg 0 and
   attractGo never runs for it.

   MATCHED ON label, NOT name. A place anchor is { label, osm, x, z, h, r } — there is no `name` on
   it, so the first version of this looked up undefined, found nothing, and fell through to the
   district shot without a word. The overlay said leg 0 corniche and the camera said dist 4191, and
   both were telling the truth about different things. osm is checked too because that is the field
   the bake matches on and the two can differ. */
(() => {
  const a = placeByName(corniche, OPENING_PLACE);
  if (a) setPlace(corniche, a);
  else { console.warn('opening place "' + OPENING_PLACE + '" not found on corniche'); setDistrict(corniche); }
})();

/* ---------- PROGRESSIVE WARM-UP ----------------------------------------------------------------

   THE FIRST FRAME PAYS FOR EVERY MESH IT DRAWS, AND IT WAS DRAWING THE WHOLE ISLAND.

   The other four islands are deferred — they sit `pending` until the flight reaches them. Corniche
   is not: its fabric, ground and props are built inline at module evaluation, so the scene is
   complete before the first render and that render uploads all of it. Seventeen to twenty seconds,
   in one unbreakable block, on a driver that gives us no way to defer or parallelise it.

   Holding the camera on a landmark did not help because the cost is not the camera's — every mesh
   in the scene is uploaded on first draw whether it is in shot or not.

   So the meshes are hidden before the first frame and revealed a few at a time afterwards, with a
   time budget per frame. The same total work happens; it is broken into pieces the size of a frame
   instead of one piece the size of a page load. Frame one draws the sea and the sky and costs
   nothing, and the city arrives over the following second or two while the camera is already live.

const NO_WARM = location.search.includes('nowarm');
/* ?warm1 — ONE MESH PER FRAME, AND EACH FRAME'S COST CHARGED TO THE MESH IT REVEALED.

   the work and it surfaces at whatever touches the GPU next: compile moved to upload, p0render moved
   to liftReg. No marker around a call can attribute cost that has been deferred past it.

   This can, because it does not measure a call — it measures a difference in the scene. Reveal
   exactly one mesh, render, and whatever that frame cost more than the last is what that mesh's
   first draw costs. There is nowhere for the work to be deferred TO: the next frame reveals a
   different mesh.

   The output is a list of objects by name, instance count and milliseconds. If one instanced mesh
   of twenty thousand buildings turns out to be nine seconds, that is the answer and it has a fix.
   If it is four hundred meshes at fifty milliseconds each, that is also the answer and the fix is a
   different one. Either beats another theory. */
/* A COUNT PER FRAME, NOT A TIME BUDGET — the first version of this drained instantly.

   It popped meshes while the elapsed time stayed under 10 ms. But revealing a mesh is a flag write
   costing nanoseconds; the cost lands in the RENDER that follows. So ten milliseconds of flag
   writes drained the entire queue in one frame and the first render paid for everything exactly as
   before. warmDone read 4 ms, which was the queue emptying, not the work finishing.

   A fixed count per frame cannot fail that way: eight meshes revealed is eight meshes' worth of
   first draws on the next render, whatever they cost. */
const WARM_ONE = location.search.includes('warm1');
const WARM_N = WARM_ONE ? 1 : 8;
const WARM_COST = [];
let warmQueue = null, _warmLast = null;

function warmHideAll(){
  if (NO_WARM) return;
  warmQueue = [];
  world.traverse(o => {
    if (!o.isMesh || !o.visible || o.userData.fpHidden) return;
    o.visible = false;
    o.userData.warmHidden = true;
    warmQueue.push(o);
  });
  /* Biggest first. A frame's budget is spent better on one instanced mesh of twenty thousand
     buildings than on twenty lamp posts, and the heavy ones are what would otherwise stall a frame
     late in the sequence when the camera is already moving. */
  warmQueue.sort((a, b) => (b.count || 1) - (a.count || 1));
}

function warmStep(){
  if (!warmQueue) return;
  for (let i = 0; i < WARM_N; i++){
    const o = warmQueue.pop();
    if (!o) break;
    o.userData.warmHidden = false;
    o.visible = true;
    if (WARM_ONE) _warmLast = o;
  }
  if (!warmQueue.length){
    warmQueue = null;
    PH.warmDone = performance.now() - _phT;
  }
}

/* ---------- compile, AFTER the view and the shot, not before ----------

   THIS RAN THIRTEEN HUNDRED LINES EARLIER AND COMPILED THE WRONG MATERIALS.

   Ground meshes are created holding their NIGHT materials; applyView swaps every one of them to
   duskMats. Compiling before that produced a full set of night programs, and then the first frame
   met a scene of dusk materials it had never seen and compiled all of them again. The work was
   never avoided, only moved: compile read 22,326 ms in one build and 23 ms in another while the
   total sat at twenty seconds either way, which is the signature of a measurement straddling the
   thing it is trying to measure.

   Cutting the program count did not touch it, which is what ruled out permutations as the cause —
   85 programs down to 54 and upload went from 19,865 to 21,511.

   AND THE SHOT MATTERS AS MUCH AS THE VIEW. three.js compile() walks VISIBLE objects, and
   setDistrict decides which LOD layer is visible. Called before it, this compiled the layer the
   first frame does not draw. Called here, it compiles exactly what is about to be rendered.

   compileAsync resolves when compilation has actually happened rather than when it has been
   queued, so the number it reports is real. Guarded on existence: it arrived in r162 and the
   importmap pin is not something to discover the hard way at run time. */
/* THE COMPILE IS GONE, AND IT WAS COSTING RATHER THAN SAVING.

   Two independent reasons, both measured on the device:

   KHR_parallel_shader_compile is NO on the Adreno 830. three.js implements compileAsync by polling
   COMPLETION_STATUS_KHR; with no extension there is nothing to poll and the promise resolves
   immediately. `compile 24 ms` never meant anything had been compiled — only that the call
   returned. It could not defer a millisecond of work.

   And it compiled for the wrong output. compile() builds programs against the currently bound
   target, which here is the canvas — srgb. Every frame afterwards goes through the composer, into
   a render target — srgb-linear — and three.js treats those as different programs. So it linked a
   parallel set of the same materials that is never drawn. That is the 9-versus-10 split still
   sitting in the program dump after the probe renders were removed.

   Removing the probes took 54 programs to 43 and 620 ms off the first frame. This should take the
   srgb column out of the dump entirely. */
phase('compile');

/* THE REST OF THE CORNICHE, ONE IDLE FRAME AFTER THE FIRST.

   Only the four kilometres the camera opens on are built at load; the other fifteen are 18,776
   buildings nobody is looking at. requestIdleCallback runs it when the main thread is free, which
   on this page is immediately after the first frame has been presented — so the scene appears at
   its opening framing and fills in behind, rather than making anyone wait for ground they cannot
   see.

   The timeout is the important argument. Without it a busy thread can postpone an idle callback
   indefinitely, and "the east end of the island sometimes never arrives" is a far worse bug than
   a hitch. Two seconds, then it runs regardless.

     two seconds later on an idle callback and adds a fresh batch of urbanFabric instanced meshes
     to corniche.mass and corniche.detail — a second helping of generated buildings that nothing
     has ever hidden, standing among the real footprints at generated plot positions.

     Guarded on the footprints actually being on, so with ?fp off the rest pass behaves exactly as
     it always has. Whether this is also what makes them float is not something I know; if they
     survive this, the remaining suspects are the district patches and the hand-built kit, and the
     way to separate those is to load without ?fp and see whether it predates stage 3 entirely. */
  /* FP_ON, NOT fpState. The state check was a race I wrote into the guard: this runs on an idle
     callback moments after the opening shot, addFootprints is still awaiting the payload at that
     point, and fpState reads 'pending'. So the guard never fired and the rest pass's generated
     fabric stayed visible alongside the real footprints — two cities on the one island that has
     a rest pass, one following the streets and one not.

     Either order is now safe. If this runs first, addFootprints hides everything including what
     was just added. If footprints land first, this hides what the rest pass adds afterwards. */
  /* NOW fpState AGAIN, AND FOR THE OPPOSITE REASON TO v58.

     this needs to know is not "are footprints switched on" but "did THIS island actually swap",
     and 'on' is set only when it did.

     Both orders are still safe. If the rest pass runs first the state is 'pending', nothing is
     hidden here, and addFootprints hides the lot including this batch when it resolves. If the

  /* Corniche's fp row reads `corn -` today, so this never fires; kept so that if Corniche ever
     does get a payload it gap-fills like the rest rather than emptying itself. */
  if (fpState.get(corniche.id) === 'on' && corniche.fpList) cullFabric(corniche, corniche.fpList);
  snapshotMats(corniche.group);
  registerLift(corniche.group);
  /* CORNICHE IS BUILT HERE, NOT THROUGH setDistrict, so it never reached addGroundFeatures and
     the overlay read `corn -` — never ran, as opposed to ran and found nothing. It is the island

  addGroundFeatures(corniche);

if (window.requestIdleCallback) requestIdleCallback(fillCorniche, { timeout:2000 });
else setTimeout(fillCorniche, 800);

cur.target.copy(goal.target);
cur.dist = goal.dist; cur.elev = goal.elev; cur.angle = goal.angle; cur.fov = goal.fov;
phase('setWorld');

/* The second drain. Everything setWorld, applyView and the material snapshot created since the

   camera has its real position, so the dome is in frustum and the draw is real. */
await flushPaint('setworld');

/* ---------- frame ---------- */
const clock = new THREE.Clock();
/* ===========================================================================
   FRAME PROFILER.

   "Profile rather than guess" needs a number on the device, and a mean frame rate is the wrong
   number: it hides exactly the thing that ruins a diorama, which is the occasional 40 ms hitch
   while the rest of the second sits at 60. So the overlay carries a rolling window and reports
   the MEDIAN and the 95th percentile, which between them say both how it usually feels and how
   bad the bad frames are.

   120 samples is about two seconds at 60 Hz — long enough to be stable, short enough to respond
   while the camera is being moved, which is when the cost actually changes. */
const FT = new Float32Array(120);
let ftI = 0, ftN = 0, ftStat = '';
function frameStats(ms){
  FT[ftI] = ms; ftI = (ftI + 1) % FT.length; ftN = Math.min(ftN + 1, FT.length);
  if (ftI % 20) return;
  const a = Array.from(FT.slice(0, ftN)).sort((x, y) => x - y);
  const med = a[Math.floor(a.length * 0.5)], p95 = a[Math.floor(a.length * 0.95)];
  ftStat = med.toFixed(1) + 'ms med / ' + p95.toFixed(1) + ' p95   ' +
           (1000 / med).toFixed(0) + 'fps';
}

/* ===========================================================================
   THE ATTRACT LOOP.

   A hero that opens on a still frame asks the viewer to work out what they are looking at. A hero
   that is already moving does the explaining itself: the camera flies the archipelago, the city
   turns under it, and anyone who wants control takes it by touching the screen.

   IT IS ALSO THE LOADING STRATEGY, and that is the part worth noticing. Only the Corniche
   waterfront is built at load; every other island builds the first time the camera commits to it,
   which used to mean a hitch on arrival. A scripted path knows where it is going next, so leg n
   builds leg n+1's island while the viewer is watching leg n. The work happens in full view of
   something else, which is the only place it is genuinely free.

   NOTHING IS WITHHELD. This is not a title sequence and there is no skip button to find: the first
   touch cancels it mid-flight and hands the camera over exactly where it is. It comes back after
   IDLE_MS of nothing, because someone who has stopped interacting is either gone or watching, and
   both are better served by a moving scene than a parked one.

   Durations are per leg rather than one constant because the legs are not equal: the Corniche
   opening is the shot that has to land, and Al Maryah is a sliver worth four seconds at most. */
const ATTRACT = [
  /* THE OPENING LEG HOLDS UNTIL CORNICHE IS FINISHED, rather than for a fixed nine seconds.

     What a visitor watches now is the island assembling in three visible steps: bare ground, then a
     generated city, then that city replaced by the real one when isle-corniche.json lands. Blank,
     empty, populated. It would look wrong at two seconds as much as at twenty — it is not a load
     time fault, it is a fault of showing work in progress.

     So the shot is tight on a landmark that needs no payload, and it stays there until the island
     behind it has settled.

     maxMs is a ceiling, not a duration: a payload that never arrives must not leave the camera
     parked on one building for good. */
  { id:'corniche', place:OPENING_PLACE, hold:true, ms:9000, maxMs:30000 },
  { id:'maryah',   ms:5000 },
  { id:'reem',     ms:5500 },
  { id:'saadiyat', ms:6000 },
  { id:'yas',      ms:6500 },
  /* AL RAHA WAS MISSING FROM THIS LIST ENTIRELY, and that is the actual cause of "generic roads
     instead of Overture roads" — real road data was never a caching problem, it was never fetched
     at all. attractPrefetch is the ONLY mechanism that calls whenRoads() for a non-Corniche
     island (see buildAndRegister's own comment: a direct tap deliberately skips the await,
     "because a stall during a committed move is worse than a generated lattice" — real roads for
     every other outer island arrive because the tour prefetches them a leg ahead, not because the
     tap itself waits). Raha, absent from this array, had no leg to be prefetched during and no
     other path that ever calls loadRoads('raha') — permanently stuck on roadSkeleton's generated

  { id:'raha',     ms:6000 },
  { world:true,    ms:8000 },
