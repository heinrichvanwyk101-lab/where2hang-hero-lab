       The lamp pools are additive quads standing in for 628 point lights that could not be real
       ones. Handing them to any of the branches below is wrong in a different way each time:
       origMat in Day leaves a warm additive smear across a sunlit ground plan, dayMat makes them
       opaque pale discs, and silMat makes them flat black discs in the one view built to read
       massing. So they are checked before all of it, and simply switched off.

       Plan is covered for free: it is neither night nor dusk. */
    /* PLAN-ONLY MESHES: the grid reference labels. Same argument as nightOnly in reverse — they
       exist for one view and there is no version of them for the others, so they are switched
       before any of the material branches can hand them a material for a mode they never appear
       in. Checked ahead of the ground test below, which would otherwise hide them along with the
       buildings. */
    if (o.userData.nightOnly){
      o.visible = night || dusk;
      if (o.visible) o.material = dusk && o.userData.duskMats ? o.userData.duskMats
                                                             : o.userData.origMat;
      return;
    }
    /* Plan hides everything that is not island ground — buildings, props, the lot — so nothing
       can occlude or shade the surface under examination. */
    o.visible = plan ? o.userData.ground === true : true;
    if (plan){
      if (o.userData.ground) o.material = o.userData.planMats;
      return;
    }
    /* Props opt out of every diagnostic except silhouette. A palm frond is already the colour a
       palm frond should be under any light in this scene, and turning it into pale stone in the
       one mode built to judge a daytime render would be a strange thing to have built. */
    if (o.userData.litMat){
      o.material = sil ? silMat : o.userData.origMat;
      return;
    }
    if (night || dusk){
      o.material = (dusk && o.userData.duskMats) ? o.userData.duskMats : o.userData.origMat;
      return;
    }
    o.material = sil ? silMat : (o.userData.dayMats || dayMat);
  });

  water.visible = !plan;
  water.material = sil ? silWater : day ? dayWater : dusk ? duskWater
                 : water.userData.origMat;
  /* The far sea takes the same material. It is flat and unanimated, but it has to be the same
     COLOUR as the near water or the join becomes a visible line across the middle of the frame.

     GUARDED, because this file and w2h-world.js can be deployed a minute apart. farSea is a new
     return value, and an older module simply does not have one — which took the whole page down
     with "Cannot set properties of undefined" rather than degrading to a scene with a short
     horizon. Anything read out of another module's return should assume that module might be a
     version behind; on GitHub Pages, with its caching, it frequently is. */
  if (farSea){ farSea.material = water.material; farSea.visible = !plan; }

  applyLOD();
}

document.getElementById('vMode').addEventListener('click',
  () => applyView(MODES[(MODES.indexOf(view) + 1) % MODES.length]));

/* ---------- tap ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let dx0=0, dy0=0, dt0=0;

/* A Map, not a pair of variables. Two fingers on a phone arrive as two independent pointer
   streams and the second one can be released first; keeping them by pointerId is the only way
   the pinch distance stays meaningful when that happens. */
const pointers = new Map();
let pinch0 = 0, zoom0 = 1, lx = 0, ly = 0;

canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (pointers.size === 1){
    dx0 = e.clientX; dy0 = e.clientY; dt0 = performance.now();
    lx = e.clientX; ly = e.clientY;
  } else if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch0 = Math.hypot(a.x - b.x, a.y - b.y);
    zoom0  = orbit.zoom;
  }
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if (pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0 > 8){
      // Pinching APART should move the camera closer, so the ratio is inverted.
      orbit.zoom = Math.max(0.35, Math.min(2.6, zoom0 * (pinch0 / d)));
      orbit.on = true;
    }
    return;
  }
  /* Scaled by viewport width, so the same swipe turns the model by the same amount on any
     screen — a fixed pixels-per-radian figure makes the gesture feel twice as fast on a folded
     Z Fold as on an unfolded one. */
  orbit.yaw  -= (e.clientX - lx) / window.innerWidth * 3.2;
  orbit.lift += (e.clientY - ly) / window.innerHeight * 1.9;
  orbit.lift  = Math.max(-0.55, Math.min(1.5, orbit.lift));
  lx = e.clientX; ly = e.clientY;
  if (Math.hypot(e.clientX - dx0, e.clientY - dy0) > 12) orbit.on = true;
});

const endPointer = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0; };
canvas.addEventListener('pointercancel', endPointer);

// Desktop convenience while working on the thing; harmless on a phone.
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.zoom = Math.max(0.35, Math.min(2.6, orbit.zoom * (1 + Math.sign(e.deltaY) * 0.10)));
  orbit.on = true;
}, { passive:false });
canvas.addEventListener('pointerup', e => {
  const many = pointers.size > 1;
  endPointer(e);
  // Tap, not drag, and not the tail of a pinch. Without this every camera drag fires a selection.
  if (many || Math.hypot(e.clientX-dx0, e.clientY-dy0) > 12 || performance.now()-dt0 > 600) return;
  ndc.x =  (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);

  if (state === STATE.WORLD){
    const hit = ray.intersectObjects(pickTargets, false)[0];
    if (hit) setDistrict(hit.object.userData.district);
    return;
  }
  if (state === STATE.DISTRICT && activeDistrict){
    const d = activeDistrict;
    const s = d.dispScale || 1;
    // The plane the user is tapping is the island's VISIBLE top face, which the group scale
    // lifts along with everything else.
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -(GROUND + 0.4) * s);
    const p = new THREE.Vector3();
    if (!ray.ray.intersectPlane(plane, p)) return;
    let best=null, bestD=Infinity;
    d.placeAnchors.forEach(a => {
      const w = anchorWorld(d, a);
      const dd = Math.hypot(w.x-p.x, w.z-p.z);
      if (dd < bestD){ bestD = dd; best = a; }
    });
    // Gate in DISPLAYED units. d.r is the island's true radius; the thing on screen is d.r * s,
    // and a gate a seventh of the size of the island it guards rejects almost every real tap.
    if (best && bestD < d.r * s) setPlace(d, best);
  }
});

/* ---------- labels ---------- */
const isleEls = new Map();
DISTRICTS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'isle';
  el.innerHTML = '<i></i>' + d.name;
  document.body.appendChild(el);
  isleEls.set(d, el);
  d.placeAnchors.forEach(a => {
    const p = document.createElement('div');
    p.className = 'isle';
    p.innerHTML = '<i></i>' + a.label;
    document.body.appendChild(p);
    isleEls.set(a, p);
  });
});
const proj = new THREE.Vector3();

/* LABELS THAT DO NOT SIT ON TOP OF EACH OTHER.

   Each label was projected and written to the DOM the instant it was computed, so nothing ever
   knew where any other label was. On Corniche that put five names inside about ninety pixels —
   "EmiratesEtihadPalaceTowers" — which does not read as crowded, it reads as corrupt. Adding
   venues made it worse, and it was going to keep getting worse, because the fix is structural:
   you cannot resolve a collision one element at a time.

   So it is two passes. Project everything, then place in order, keeping the boxes that have
   already landed and testing each new one against them.

   NEAREST FIRST, by projected depth. When two names cannot both be shown the nearer one is the
   one the camera is looking at, and a stable rule beats a prettier one that reorders itself
   every frame as the camera drifts.

   A label that collides is nudged UP in 16-pixel steps before it is dropped, because the
   overlaps are nearly always horizontal — venues strung along a shoreline at the same height —
   and stacking them vertically is what a mapmaker would do. Four steps, then it is hidden: a
   label 64 pixels above its own dot has stopped pointing at anything.

   Measured off the live element rather than estimated from string length: these are proportional
   and the difference between "SeaWorld" and "The Galleria Al Maryah Island" is not something to
   approximate. offsetWidth on a hidden element reads 0, hence the fallback. */
const LABEL_PAD = 4, NUDGE = 16, NUDGE_MAX = 4;

function screenOf(x, y, z){
  proj.set(x, y, z).project(camera);
  if (proj.z > 1) return null;
  return { x:(proj.x*0.5+0.5) * window.innerWidth,
           y:(-proj.y*0.5+0.5) * window.innerHeight,
           depth: proj.z };
}

function overlaps(a, b){
  return Math.abs(a.x - b.x) * 2 < (a.w + b.w) + LABEL_PAD * 2 &&
         Math.abs(a.y - b.y) * 2 < (a.h + b.h) + LABEL_PAD * 2;
}

function layoutLabels(items){
  items.sort((a, b) => a.p.depth - b.p.depth);
  const placed = [];
  for (const it of items){
    const w = it.el.offsetWidth  || 70;
    const h = it.el.offsetHeight || 24;
    let y = it.p.y, box = null, ok = false;
    for (let n = 0; n <= NUDGE_MAX; n++){
      box = { x:it.p.x, y:y - n * NUDGE, w, h };
      if (!placed.some(q => overlaps(box, q))){ ok = true; break; }
    }
    if (!ok){ it.el.classList.remove('on'); continue; }
    placed.push(box);
    it.el.style.left = box.x + 'px';
    it.el.style.top  = box.y + 'px';
    it.el.classList.add('on');
  }
}

function updateLabels(){
  const items = [];
  DISTRICTS.forEach(d => {
    const el = isleEls.get(d);
    if (state === STATE.WORLD){
      const p = screenOf(d.x, GROUND * (d.dispScale || 1) + 26, d.z);
      if (p) items.push({ el, p }); else el.classList.remove('on');
    } else el.classList.remove('on');

    d.placeAnchors.forEach(a => {
      const el2 = isleEls.get(a);
      if (state !== STATE.WORLD && d === activeDistrict){
        const w = anchorWorld(d, a);
        const p = screenOf(w.x, w.y + 4, w.z);
        if (p) items.push({ el:el2, p }); else el2.classList.remove('on');
      } else el2.classList.remove('on');
    });
  });
  layoutLabels(items);
}

/* ---------- post ---------- */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.60, 0.55, 0.46);
composer.addPass(bloom);

/* TILT-SHIFT. The cue that makes a city read as a MODEL rather than a city. Human vision has
   effectively infinite depth of field at this scale, so a frame with a narrow sharp band
   cannot be a real place — the brain concludes the subject is small and close. */
const TiltShift = {
  uniforms:{ tDiffuse:{value:null}, amount:{value:1.0}, focus:{value:0.47},
             aperture:{value:0.16}, strength:{value:0.0023} },
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv;' +
    ' gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
    'uniform sampler2D tDiffuse; uniform float amount, focus, aperture, strength;',
    'varying vec2 vUv;',
    'void main(){',
    '  float d = max(abs(vUv.y-focus)-aperture, 0.0);',
    '  float b = smoothstep(0.0,0.34,d)*strength*amount;',
    '  vec4 c = texture2D(tDiffuse,vUv)*0.226;',
    '  c += texture2D(tDiffuse,vUv+vec2( b*1.0, b*0.4))*0.129;',
    '  c += texture2D(tDiffuse,vUv+vec2(-b*1.0,-b*0.4))*0.129;',
    '  c += texture2D(tDiffuse,vUv+vec2( b*0.4,-b*1.0))*0.117;',
    '  c += texture2D(tDiffuse,vUv+vec2(-b*0.4, b*1.0))*0.117;',
    '  c += texture2D(tDiffuse,vUv+vec2( b*2.0, b*0.8))*0.071;',
    '  c += texture2D(tDiffuse,vUv+vec2(-b*2.0,-b*0.8))*0.071;',
    '  c += texture2D(tDiffuse,vUv+vec2( b*0.8,-b*2.0))*0.070;',
    '  c += texture2D(tDiffuse,vUv+vec2(-b*0.8, b*2.0))*0.070;',
    '  gl_FragColor = c;',
    '}'
  ].join('\n')
};
const tiltPass = new ShaderPass(TiltShift);
composer.addPass(tiltPass);
composer.addPass(new OutputPass());
const smaa = new SMAAPass(window.innerWidth * renderer.getPixelRatio(),
                          window.innerHeight * renderer.getPixelRatio());
composer.addPass(smaa);

/* SPLIT ON THE FIRST CALL ONLY, because this function is 4,527 ms of a 12 second load — larger
   than building the entire city — and it is four lines long.

   The pixel ratio is already clamped to 2, so the obvious explanation was wrong. Three of these
   four calls only record a size in three.js and defer the GPU allocation; one of them does not,
   and which one it is decides whether the fix is a smaller target, a cheaper pass, or dropping a
   pass entirely. Four marks is cheaper than another theory. */
let _resized = false;
function resize(){
  const w = window.innerWidth, h = window.innerHeight, pr = renderer.getPixelRatio();
  /* REFUSE A ZERO. Android reports innerWidth or innerHeight as 0 during a fold transition and
     when the tab is backgrounded, and this device folds. aspect then becomes 0, Infinity or NaN;
     fitDist divides by it and hands goal.dist an Infinity; cur.dist lerps toward it and the
     camera position goes non-finite. Nothing renders after that and nothing ever recovers,
     because the only thing that would re-frame is another resize.
     A black screen that survives every subsequent frame is the signature. */
  if (!(w > 0 && h > 0)) return;
  const first = !_resized; _resized = true;
  let m = first ? performance.now() : 0;
  const mark = k => { if (first){ PH[k] = performance.now() - m; m = performance.now(); } };

  renderer.setSize(w, h, false);            mark('r.setSize');
  composer.setSize(w, h);                   mark('composer');
  bloom.setSize(w, h);                      mark('bloom');
  smaa.setSize(w * pr, h * pr);             mark('smaa');
  const was = camera.aspect;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (first) console.info('resize ' + w + 'x' + h + ' pr=' + pr);
  /* RE-FRAME, because the shot distance is now a function of the aspect and the aspect changes
     under it. This device folds. A shot composed at 0.46 and then unfolded to 1.0 would keep the
     distance it was given and hold the subject at less than half the size the new frame wants,
     which is the same fault the hard-coded constants had — just arriving later. Damped, so the
     re-frame reads as the camera easing rather than as a jump. */
  if (!first && was && Math.abs(w / h - was) > 0.01) reframe();
}

/* Re-issues whichever shot is current. Nothing else changes: same target, same subject, same
   state — only the distance and elevation, which are the two things that depend on the frame. */
function reframe(){
  if (state === STATE.PLACE && activeDistrict && activePlace) setPlace(activeDistrict, activePlace);
  else if (state === STATE.DISTRICT && activeDistrict)         setDistrict(activeDistrict);
  else                                                          setWorld();
}
phase('liftReg');
window.addEventListener('resize', resize);
resize();
phase('resize');
// Dusk before setWorld, so the first frame is already the product state rather than a flash of
// unlit night while the sky texture and key light are configured.
applyView('dusk');
phase('applyView');

/* OPEN ON THE CORNICHE, NOT ON THE ARCHIPELAGO.

   At world zoom the five islands are five brown silhouettes; nothing in the frame says Abu Dhabi
   until you tap. One level down, Emirates Palace, Etihad Towers and ADNOC are all in shot, and the
   scene reads in the first second rather than after two taps.

   setWorld still exists and Back still reaches it — the world view is a real state and a good one,
   it is simply the wrong opening shot for a hero.

   THE CAMERA IS SNAPPED, NOT FLOWN. setDistrict composes a goal and the frame loop eases towards
   it, which is right for a transition the user asked for and wrong for the first frame: easing
   from the default world position means the scene opens by flying in from somewhere nobody chose.
   Copying goal into cur once, before the loop starts, makes the opening shot the shot. */
setWorld();
setDistrict(corniche);

/* THE REST OF THE CORNICHE, ONE IDLE FRAME AFTER THE FIRST.

   Only the four kilometres the camera opens on are built at load; the other fifteen are 18,776
   buildings nobody is looking at. requestIdleCallback runs it when the main thread is free, which
   on this page is immediately after the first frame has been presented — so the scene appears at
   its opening framing and fills in behind, rather than making anyone wait for ground they cannot
   see.

   The timeout is the important argument. Without it a busy thread can postpone an idle callback
   indefinitely, and "the east end of the island sometimes never arrives" is a far worse bug than
   a hitch. Two seconds, then it runs regardless.

   setTimeout where requestIdleCallback does not exist, which is Safari. */
function fillCorniche(){
  if (!buildCornicheRest || !buildCornicheRest()) return;
  /* AND HIDE WHAT IT JUST ADDED, WHICH IS THE WHOLE POINT OF THIS LINE.

     hideFabric runs inside addFootprints, which happens when the island is built. This runs up to
     two seconds later on an idle callback and adds a fresh batch of urbanFabric instanced meshes
     to corniche.mass and corniche.detail — a second helping of generated buildings that nothing
     has ever hidden, standing among the real footprints at generated plot positions.

     Guarded on the footprints actually being on, so with ?fp off the rest pass behaves exactly as
     it always has. Whether this is also what makes them float is not something I know; if they
     survive this, the remaining suspects are the district patches and the hand-built kit, and the
     way to separate those is to load without ?fp and see whether it predates stage 3 entirely. */
  /* FP_ON, NOT fpState. The state check was a race I wrote into the guard: this runs on an idle
     callback moments after the opening shot, addFootprints is still awaiting the payload at that
     point, and fpState reads 'pending'. So the guard never fired and the rest pass's generated
     fabric stayed visible alongside the real footprints — two cities on the one island that has
     a rest pass, one following the streets and one not.

     Either order is now safe. If this runs first, addFootprints hides everything including what
     was just added. If footprints land first, this hides what the rest pass adds afterwards. */
  if (FP_ON) hideFabric(corniche);
  snapshotMats(corniche.group);
  registerLift(corniche.group);
  applyView(view);
}
if (window.requestIdleCallback) requestIdleCallback(fillCorniche, { timeout:2000 });
else setTimeout(fillCorniche, 800);

cur.target.copy(goal.target);
cur.dist = goal.dist; cur.elev = goal.elev; cur.angle = goal.angle; cur.fov = goal.fov;
phase('setWorld');

/* ---------- frame ---------- */
const clock = new THREE.Clock();
/* ===========================================================================
   FRAME PROFILER.

   "Profile rather than guess" needs a number on the device, and a mean frame rate is the wrong
   number: it hides exactly the thing that ruins a diorama, which is the occasional 40 ms hitch
   while the rest of the second sits at 60. So the overlay carries a rolling window and reports
   the MEDIAN and the 95th percentile, which between them say both how it usually feels and how
   bad the bad frames are.

   120 samples is about two seconds at 60 Hz — long enough to be stable, short enough to respond
   while the camera is being moved, which is when the cost actually changes. */
const FT = new Float32Array(120);
let ftI = 0, ftN = 0, ftStat = '';
function frameStats(ms){
  FT[ftI] = ms; ftI = (ftI + 1) % FT.length; ftN = Math.min(ftN + 1, FT.length);
  if (ftI % 20) return;
  const a = Array.from(FT.slice(0, ftN)).sort((x, y) => x - y);
  const med = a[Math.floor(a.length * 0.5)], p95 = a[Math.floor(a.length * 0.95)];
  ftStat = med.toFixed(1) + 'ms med / ' + p95.toFixed(1) + ' p95   ' +
           (1000 / med).toFixed(0) + 'fps';
}

/* ===========================================================================
   THE ATTRACT LOOP.

   A hero that opens on a still frame asks the viewer to work out what they are looking at. A hero
   that is already moving does the explaining itself: the camera flies the archipelago, the city
   turns under it, and anyone who wants control takes it by touching the screen.

   IT IS ALSO THE LOADING STRATEGY, and that is the part worth noticing. Only the Corniche
   waterfront is built at load; every other island builds the first time the camera commits to it,
   which used to mean a hitch on arrival. A scripted path knows where it is going next, so leg n
   builds leg n+1's island while the viewer is watching leg n. The work happens in full view of
   something else, which is the only place it is genuinely free.

   NOTHING IS WITHHELD. This is not a title sequence and there is no skip button to find: the first
   touch cancels it mid-flight and hands the camera over exactly where it is. It comes back after
   IDLE_MS of nothing, because someone who has stopped interacting is either gone or watching, and
   both are better served by a moving scene than a parked one.

   Durations are per leg rather than one constant because the legs are not equal: the Corniche
   opening is the shot that has to land, and Al Maryah is a sliver worth four seconds at most. */
const ATTRACT = [
  { id:'corniche', ms:9000 },
  { id:'maryah',   ms:5000 },
  { id:'reem',     ms:5500 },
  { id:'saadiyat', ms:6000 },
  { id:'yas',      ms:6500 },
  { world:true,    ms:8000 },
];
/* 45 SECONDS, UP FROM 22, AND A WAY TO TURN IT OFF ENTIRELY.

   22 is a reasonable guess for a visitor who has stopped touching the screen. It is hopeless for
   anyone inspecting the scene: reading a debug overlay, comparing a road network against a map, or
   just looking at something takes longer than that, and the camera flying away mid-thought makes
   the loop an obstacle rather than an attraction.

   ?still disables it outright, which is what you want while working on the thing. It is a URL
   flag rather than a build constant for the same reason ?drawn is: a diagnostic you have to
   redeploy to use is a diagnostic nobody uses. */
const IDLE_MS = 45000;
const ATTRACT_OFF = location.search.includes('still');

/* THE ERROR TRAP, WHICH SHOULD HAVE EXISTED BEFORE THE ATTRACT LOOP DID.

   This is authored and tested on a phone. There is no console, so an exception is not a message —
   it is an absence: the camera stops moving, or an island never appears, and the only evidence is
   the thing that did not happen. Two rounds of this have now been spent trying to tell a frozen
   frame apart from a healthy one in a screenshot.

   A throw inside frame() is especially quiet. requestAnimationFrame is registered on the FIRST
   line, so the loop survives its own body failing: every subsequent frame re-enters, dies at the
   same statement, and re-registers. The picture freezes, the overlay keeps whatever numbers the
   last complete frame left, and nothing anywhere says so.

   Kept to the last error and a count. A trap that scrolls is a trap nobody reads on a 6-inch
   screen, and the first one is nearly always the real one anyway. */
const ERR = { msg:null, n:0 };
function noteError(where, e){
  ERR.n++;
  const m = (e && e.message) || String(e);
  if (!ERR.msg) ERR.msg = where + ': ' + m;
  console.error(where, e);
}
window.addEventListener('error', ev => noteError('window', ev.error || ev.message));
/* THE OTHER BLACK SCREEN. A lost WebGL context draws nothing and throws nothing: no exception,
   no console line, a live page with an empty canvas. On Android it is caused by backgrounding
   the tab or by memory pressure, and five islands of instanced footprints is a great deal more
   memory than this page used to hold. Identical to a NaN camera from the outside; completely
   different underneath. Naming it is the whole point. */
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  noteError('webgl', new Error('context lost — reload required'));
});
canvas.addEventListener('webglcontextrestored', () => { ERR.msg = null; ERR.n = 0; });
window.addEventListener('unhandledrejection', ev => noteError('promise', ev.reason));

const attract = { on:false, i:0, until:0, lastInput:performance.now() };

/* Building the NEXT island now, so its arrival is a camera move rather than a camera move plus a
   second of frozen thread. Wrapped exactly like setDistrict's own call, because a freshly built
   island needs its materials snapshotted and registered before any view touches them — the fault
   that killed the render loop the first time this was deferred. */
/* HAS THIS ISLAND'S NETWORK LANDED YET. Synchronous, because the answer decides whether to build
   now or to wait, and a promise cannot be asked that question without already having waited. */
function roadsIn(id){
  const idx = window.__basemapIndex;
  const e = idx && (idx.islands || []).find(i => i.id === id);
  return !!(e && e._roads);
}

/* Resolves when the roads are in hand, when the fetch has failed, or after a ceiling — whichever
   comes first. The ceiling is the important one: a fetch that never settles would otherwise leave
   the island unbuilt for the rest of the session and the flight would arrive at bare sand. Four
   seconds is comfortably longer than any of these files has taken and comfortably shorter than a
   leg, so in the normal case it is never reached and in the pathological case it degrades to
   exactly the old behaviour. */
function whenRoads(id, ms = 4000){
  const idx = window.__basemapIndex;
  if (!idx || !BMAP.loadRoads) return Promise.resolve(false);
  return Promise.race([
    BMAP.loadRoads(idx, id).then(() => true).catch(() => false),
    new Promise(res => setTimeout(() => res(false), ms)),
  ]);
}


/* ---------- STAGE 3a: REAL FOOTPRINTS, BEHIND ?fp ----------

   The island payload is the file roads were split out of, and it is the larger half of what is
   left. It is fetched only when the flag is on, so nothing about the default path changes weight:
   a diagnostic that costs every visitor a megabyte is a diagnostic that has to be justified to
   people who are not debugging.

   Per island, on demand, at the moment its city is built. Same lifecycle as the roads, same
   reason — the ground and the buildings want to arrive together or the island assembles twice. */

async function footprintsFrom(d){
  const idx = window.__basemapIndex;
  if (!idx || !BMAP.loadIsland || !BMAP.buildingsUnits) return null;
  const entry = (idx.islands || []).find(i => i.id === d.id);
  if (!entry) return null;
  const data = await BMAP.loadIsland(idx, d.id);
  const origin = BMAP.islandOrigin(entry);
  const units = BMAP.buildingsUnits(data, origin);
  return (units && units.length) ? units : null;
}

/* Hides the generated fabric's MESHES without touching its arithmetic. The cells and blocks it
   returned are still in d.fabric and still feeding groundPlan; only the boxes stop drawing. */
function hideFabric(d){
  let n = 0;
  [d.mass, d.detail].forEach(layer => {
    if (!layer) return;
    layer.children.forEach(o => {
      if (o.isInstancedMesh && o.name !== 'footprints'){ o.visible = false; n++; }
    });
  });
  d.fpHid = n;
  return n;
}

async function addFootprints(d){
  if (!FP_ON || !footprintsFor || fpState.has(d.id)) return;
  fpState.set(d.id, 'pending');
  try {
    const list = await footprintsFrom(d);
    if (!list){ fpState.set(d.id, 'none'); return; }
    const g = footprintsFor(d, list);
    if (!g){ fpState.set(d.id, 'none'); return; }
    hideFabric(d);
    d.detail.add(g);
    /* Same order the deferred islands taught us: snapshot and register BEFORE any view touches
       the new meshes, or applyView sets a material to undefined and the render loop dies inside
       projectObject naming neither the mesh nor the island. */
    snapshotMats(g); registerLift(g); applyView(view);
    fpState.set(d.id, 'on');
    console.info('footprints ' + d.id + ': ' + d.fpCount + ' (' + d.fpReal + ' real heights)');
  } catch (e){ noteError('footprints ' + d.id, e); fpState.set(d.id, 'none'); }
}

function buildAndRegister(d){
  if (!buildIsland(d.id)) return;
  snapshotMats(d.group); registerLift(d.group); fitClip(); applyView(view);
  addFootprints(d);
}


function attractPrefetch(n){
  const leg = ATTRACT[n % ATTRACT.length];
  if (!leg || !leg.id || !buildIsland) return;
  const d = DISTRICTS.find(x => x.id === leg.id);
  if (!d) return;
  /* THE RACE, AND WHY IT WAS WORTH FIXING RATHER THAN LIVING WITH.

     The ground canvas is painted once, during the build, and never repainted. So whether an island
     shows its real street network or a generated lattice is decided by whether roads-<id>.json
     happened to have arrived at the instant the prefetch fired — and for Al Maryah, built from the
     startup prefetch milliseconds after the page opens, that came down to network weather. Two
     consecutive loads of the identical build read `mary gen` and `mary 459`.

     A hero that renders differently on refresh for reasons the visitor cannot see, cause or avoid
     is not a hero with a bug in it; it is a hero you cannot reason about at all. The prefetch runs
     a whole leg ahead of the camera, so it has seconds to spare — it simply was not spending them.

     Nothing here blocks a frame: the build still happens synchronously when it happens, this only
     moves WHEN. And a user tap still builds immediately through setDistrict, because a stall
     during a committed move is worse than a generated lattice. */
  if (roadsIn(leg.id)){ buildAndRegister(d); return; }
  whenRoads(leg.id).then(() => { if (d.pending) buildAndRegister(d); });
}

function attractGo(i){
  attract.i = i % ATTRACT.length;
  const leg = ATTRACT[attract.i];
  attract.until = performance.now() + leg.ms;
  if (leg.world) setWorld();
  else {
    const d = DISTRICTS.find(x => x.id === leg.id);
    if (d) setDistrict(d);
  }
  /* Next island built during THIS leg, not at the moment it is needed. */
  attractPrefetch(attract.i + 1);
}

function attractStart(){
  if (ATTRACT_OFF || attract.on) return;
  attract.on = true;
  attractGo(attract.i + 1);
}

/* Cancel leaves the camera wherever the flight had reached: the goal is not reset, so the ease
   that was in progress simply finishes and the viewer inherits a composed shot rather than being
   snapped back to wherever they last were. */
function attractStop(){
  attract.on = false;
  attract.lastInput = performance.now();
}
['pointerdown', 'wheel', 'keydown'].forEach(ev =>
  window.addEventListener(ev, attractStop, { passive:true }));

function attractTick(now){
  if (attract.on){ if (now >= attract.until) attractGo(attract.i + 1); return; }
  if (now - attract.lastInput > IDLE_MS) attractStart();
}

/* KICK OFF HERE, not up beside setDistrict(corniche) where it reads more naturally. ATTRACT is a
   const declared in this block, and a const is in the temporal dead zone until its declaration
   runs — referencing it two hundred lines earlier is a ReferenceError, not a hoist. The opening
   shot is already composed by then; this only decides how long it holds before the flight moves.

   attract.i starts at 0 and the first advance goes to 1, so leg 0 IS that composed shot. */
attract.on = !ATTRACT_OFF;
attract.until = performance.now() + ATTRACT[0].ms;
attractPrefetch(1);

function frame(){
  requestAnimationFrame(frame);
  /* CONTAINED, BECAUSE THIS LINE SITS IN FRONT OF THE RENDER. attractTick reaches setDistrict and
     buildIsland, which between them touch geometry, textures and materials for an island being
     built for the first time — the most failure-prone call in the file, executed before anything
     is drawn. A throw here stops the camera AND the render, which is a frozen scene, which reads
     as almost any other bug.

     Caught, named, and the loop disabled after the first failure: retrying a throw sixty times a
     second buries the message under its own repeats and would keep the scene frozen anyway. The
     rest of the frame then runs, so what you get is a live scene that has stopped flying and an
     overlay line saying why — which is a bug report rather than a mystery. */
  try { attractTick(performance.now()); }
  catch (e){ noteError('attract', e); attract.on = false; attract.dead = true; }
  const t0 = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  /* DAMPED, framerate-independent. The 1-exp(-k*dt) form is correct at 30fps and 120fps
     alike; a plain lerp by a fixed fraction travels twice as fast on a 120Hz phone, which is
     the usual reason camera feel differs between devices. Damping also means a tap during a
     transition simply re-aims, with no timeline to cancel. */
  const e = 1 - Math.exp(-2.0 * dt);
  cur.target.lerp(goal.target, e);
  cur.dist  += (goal.dist  - cur.dist)  * e;
  cur.elev  += (goal.elev  - cur.elev)  * e;
  cur.angle += (goal.angle - cur.angle) * e;
  cur.fov   += (goal.fov   - cur.fov)   * e;

  /* The idle drift stops the moment the camera is touched. Two things moving the view at once
     reads as a bug, and on a still frame the drift is what makes a held angle look unsteady. */
  /* THE SIGNALS RUN ON WALL TIME, every frame, in every view. It is tempting to skip this at world
     zoom where a lens is sub-pixel — but the tick only writes when an aspect actually changes, so
     the per-frame cost is a loop over 416 signals doing one modulo and one compare, and skipping
     it would mean every junction jumping to a new state the moment an island is tapped. */
  if (tickSignals) tickSignals(t);

  const drift = (state === STATE.WORLD && !orbit.on) ? Math.sin(t * 0.045) * 0.09 : 0;
  const a = cur.angle + drift + orbit.yaw;
  const dist = cur.dist * orbit.zoom;
  /* Elevation scales with distance rather than adding to it, so a zoomed-in camera does not end
     up looking down from the height the world view wanted. Floored just above the ground plane:
     this is a diorama and there is nothing under it to look at. */
  const elev = Math.max(GROUND + 4, (cur.elev - GROUND) * orbit.zoom * (1 + orbit.lift) + GROUND);
  camera.position.set(
    cur.target.x + Math.sin(a) * dist,
    elev,
    cur.target.z + Math.cos(a) * dist
  );
  /* THE LAST LINE OF DEFENCE, AND IT IS CHEAP. One NaN anywhere upstream — an aspect, a radius,
     a lerp against an Infinity — propagates into camera.position and every frame after it draws
     nothing. Three comparisons per frame buys a scene that recovers rather than one that is black
     until the page is reloaded, and it says so on the overlay rather than recovering silently. */
  if (!Number.isFinite(camera.position.x + camera.position.y + camera.position.z)){
    noteError('camera', new Error('non-finite position — reframing'));
    cur.dist = 600; cur.elev = 400; cur.angle = 0;
    cur.target.set(0, 0, 0);
    camera.position.set(0, 400, 600);
    reframe();
  }
  camera.lookAt(cur.target);

  /* THE HAZE FOLLOWS THE CAMERA, EVERY FRAME. cur.dist and cur.elev are the damped values the
     camera was just built from, so this is the distance actually being looked through rather
     than the one the state nominally implies — during a flight it eases on the same curve as
     the move, which is the whole point. */
  if (scene.fog && fogKey){
    // The orbited distance, not the state's nominal one, or the haze stops matching the view
    // the moment anything is zoomed.
    const camDist = Math.hypot(dist, elev - GROUND);
    const f = fogFor(camDist, fogKey);
    scene.fog.near = f.near;
    scene.fog.far  = f.far;
  }

  if (Math.abs(camera.fov - cur.fov) > 0.01){
    camera.fov = cur.fov; camera.updateProjectionMatrix();
  }

  for (let i = 0; i < waterPos.count; i++){
    const x = waterBase[i*3], y = waterBase[i*3+1];
    /* 0.09 AND 0.06, DOWN FROM 0.55 AND 0.42, and this is the fix for the beach rather than a
       change to the sea.

       Peak displacement was 0.97 units. At 7.8 metres to the unit that is a 7.6-metre swell —
       fifteen metres crest to trough — in water holding seventy moored boats. It read as
       plausible while the coast was a wall, because a wall does not care where the waterline is.

       A beach is nothing BUT where the waterline is. The foam band and the dark band under it
       span y +0.06 to -0.06: 0.12 units, 94 centimetres, and the sea was moving sixteen times
       that. The shoreline swept across 9.2 of the beach's 12 units, 77 per cent of its width, so
       at a crest the water climbed to the sea wall and at a trough it drained off the outer edge
       and exposed the dark submerged rings. Every band in that profile was being alternately
       drowned and stranded, several times a second. No colour or width change could have fixed
       it — the bands were correct and the sea was washing over all of them.

       At 0.15 peak the sweep is 2.0 units and lands on the foreshore, with the foam band inside
       it. 1.2 metres of swell, which is a real day in the Gulf.

       The swell has less to do now anyway: since v23 the fine surface detail is a normal map,
       and the geometry is only carrying the long shape underneath it. */
    waterPos.array[i*3+2] = Math.sin(x*0.010 + t*0.45)*0.09 + Math.sin(y*0.008 - t*0.35)*0.06;
  }
  waterPos.needsUpdate = true;
  water.geometry.computeVertexNormals();

  /* THE RIPPLE SCROLLS, and it costs one vector assignment rather than five thousand vertices.
     Two components pulling at different rates across the same tiling texture is enough to stop
     the eye finding the repeat; a single offset scrolling in one direction reads as a conveyor
     belt. Slow — the swell underneath is on a 14-second period and chop that outran it would
     look like the sea was moving in two unrelated ways. */
  if (waterNormal){
    // Rates raised with the tile: the offset is in UV, so a 188-unit tile moving at the old rate
    // would drift half again as slowly across the water as it used to.
    waterNormal.offset.set(t * 0.0092, t * 0.0058);
    // Eased rather than switched: the camera flight between world and district takes about a
    // second, and a sea that changes surface in one frame during it is worse than either end.
    if (Math.abs(rippleNow - rippleGoal) > 0.002){
      rippleNow += (rippleGoal - rippleNow) * 0.06;
      dayWater.normalScale.set(0.29 * rippleNow, 0.29 * rippleNow);
      duskWater.normalScale.set(0.42 * rippleNow, 0.42 * rippleNow);
    }
  }

  updateLabels();
  renderer.info.reset();
  composer.render();
  /* THE FIRST-FRAME MARK LIVES IN THE PROBE BLOCK BELOW, and it used to live here as well.

     Two drops each inserted a block guarded on `PH.firstFrame === undefined` immediately above
     frameStats. The first ran, set the flag, and left the second — the one with the probes in it —
     permanently unreachable. The overlay showed no upload, shadowPass or postFX rows and I spent a
     round trip wondering why the diagnostics were silent, which is the same duplicate-guard fault
     this file's own header warns about for cache strings.

     One block, one guard. */
  /* THREE PROBE RENDERS, ONCE, BEFORE THE FIRST REAL FRAME IS MEASURED.

     compile came back at 13 ms, so the 10 seconds is not shader programs — it is upload, the
     shadow pass, or post-processing, and from outside they are one number. Rendering deliberately
     three times separates them: the first draw pays every texture and buffer upload, the second
     adds the shadow maps, the third adds the composer's targets. Each subsequent render is cheap,
     so the differences are the costs.

     Two guesses have already been wrong today — paintGround and shader compilation — and both
     would have been cheap to test and expensive to act on. This is the cheap test. */
  if (PH.firstFrame === undefined){
    try {
      const sw = renderer.shadowMap.enabled;
      let m = performance.now();
      renderer.shadowMap.enabled = false;
      renderer.render(scene, camera);
      PH.upload = performance.now() - m; m = performance.now();
      renderer.shadowMap.enabled = sw;
      renderer.render(scene, camera);
      PH.shadowPass = performance.now() - m; m = performance.now();
      composer.render();
      PH.postFX = performance.now() - m;
    } catch (e){ console.warn('probe:', e.message); }
    PH.firstFrame = performance.now() - _phT;
    PH['#page'] = performance.now() - PAGE_T0;
  }
  frameStats(performance.now() - t0);

  if (DEBUG){
    const info = renderer.info;
    document.getElementById('dbg').textContent =
      'state  ' + state + (activeDistrict ? ' / ' + activeDistrict.id : '') +
        '   view ' + view + '\n' +
      'tris   ' + info.render.triangles + '   calls ' + info.render.calls + '\n' +
      'geo    ' + info.memory.geometries + '   tex ' + info.memory.textures + '\n' +
      'props  ' + propCount.palms + ' palm  ' + (propCount.shrubs||0) + ' shrub  ' + propCount.lamps + ' lamp  ' +
        propCount.cars + ' car  ' + propCount.boats + ' boat  ' +
        (propCount.signals || 0) + ' signal\n' +
      'build  ' + B_NAV + ' / ' + B_CITY + ' / ' + B_WORLD + ' / ' + B_PROPS + '\n' +
      /* WHICH NETWORK IS ON THE GROUND, ON SCREEN. Stage 2 shipped and then sat unverified,
         because the only way to answer "are these real centrelines" was to look at the painted
         texture and judge it by eye — which is exactly the sort of question a build should be
         able to answer about itself. One line: per island, real or generated, with the centreline
         count when it is real. dispScale is here for the same reason. It is the number three
         separate bugs came out of and it was visible nowhere. */
      'roads  ' + DISTRICTS.map(d => d.id.slice(0,4) + ' ' +
        (!d.built ? '-' : d.roadsReal ? String(d.roads.drawArterials.length) : 'gen') +
        (d.dispScale && Math.abs(d.dispScale - 1) > 0.01
          ? ' x' + d.dispScale.toFixed(1) : '')).join('  ') + '\n' +
      /* HOW MANY ANCHORS THE BAKE NAMED, per island, and whether the shot is framing them or
         falling back to the coastline. An anchor the bake missed keeps a stale authored position
         near the island centre and looks like a landmark that happens to be central. */
      (FP_ON ? 'fp     ' + DISTRICTS.map(d => d.id.slice(0,4) + ' ' +
        (fpState.get(d.id) === 'on' ? (d.fpCount + '/' + d.fpReal + 'r hid' + (d.fpHid || 0))
         : (fpState.get(d.id) || '-'))).join('  ') + '\n' : '') +
      'marks  ' + DISTRICTS.map(d => d.id.slice(0,4) + ' ' +
        (d.marksHit == null ? '?' : d.marksHit + '/' + d.marksOf) +
        (d.shot && d.shot.r < d.r ? '*' : '')).join('  ') + '\n' +
      /* V, WHICH THE OVERLAY NEVER SHOWED. The four stamps tell you which module CONTENT is
         live, which does catch a stale module — but not which query string fetched it, so a
         forgotten bump and a Pages cache miss looked identical from here. */
      /* THE BUILD BREAKDOWN, ON SCREEN RATHER THAN IN THE CONSOLE. This is authored on a phone,
         where console.table might as well not exist — a timing that can only be read by attaching
         a desktop debugger is a timing nobody will look at. Top four stages, one line. */
      /* ONE STAGE PER LINE. The single-line version ran off the right edge of a folded phone and
         showed four of eight, which is how a measurement turns into another guess: the two stages
         that were visible accounted for three seconds of fourteen and I could not see where the
         other eleven went. Pairs per line, so it fits and still reads. */
      /* WRAPPED, LIKE THE STAGES, and for the same reason — which I had just fixed one line below
         and then reintroduced here. A single line of seven phases runs off a folded phone at the
         fourth, and the fourth was the one that mattered. */
      (() => {
        const rows = Object.keys(PH).filter(k => k[0] !== '#')
          .map(k => [k, Math.round(PH[k])]).sort((a, b) => b[1] - a[1]);
        let out = '';
        for (let i = 0; i < rows.length; i += 2){
          out += (i ? '       ' : 'phase  ') +
            rows.slice(i, i + 2).map(([k, v]) => (k + ' ' + v).padEnd(24)).join('') + '\n';
        }
        return out + '       total ' + Math.round(PH['#page'] || 0) + ' ms   ' +
               (PH['#mpx'] ? PH['#mpx'].toFixed(0) + ' Mpx tex' : '') + '\n';
      })() +
      (PERF ? (() => {
        const rows = Object.keys(PERF).filter(k => k[0] !== '#')
          .map(k => [k, Math.round(PERF[k])]).sort((a, b) => b[1] - a[1]);
        const named = rows.reduce((a, r) => a + r[1], 0);
        rows.push(['(rest)', Math.max(0, Math.round(PERF['#total'] || 0) - named)]);
        let out = '';
        for (let i = 0; i < rows.length; i += 2){
          out += (i ? '       ' : 'stages ') +
            rows.slice(i, i + 2).map(([k, v]) =>
              (k + ' ' + v).padEnd(24)).join('') + '\n';
        }
        return out;
      })() : '') +
      /* THE LOOP, ON SCREEN. "It stopped flying" has three causes that look identical from the
         outside — the flag is set, the user touched something, or it threw — and the overlay
         could distinguish none of them. */
      'cam    aspect ' + (camera.aspect || 0).toFixed(2) + '  dist ' + Math.round(cur.dist) +
        '  elev ' + Math.round(cur.elev) + '  fov ' + Math.round(camera.fov) +
        '  clip ' + Math.round(camera.near) + '/' + Math.round(camera.far) + '\n' +
      /* WHERE THE CAMERA IS AND WHERE THE SUBJECT IS, which is the pair that decides whether a
         black frame means "aimed at nothing" or "aimed at something that is not being drawn".
         Every other number on this overlay is consistent with a working scene, so the fault is
         in a relationship between two of them and none of the two were visible.
         The island's own centre and displayed radius sit alongside, because the question is
         whether the target is anywhere near the land. */
      'aim    cam ' + [camera.position.x, camera.position.y, camera.position.z]
          .map(v => Math.round(v)).join(',') +
        '  tgt ' + [cur.target.x, cur.target.y, cur.target.z].map(v => Math.round(v)).join(',') +
        (activeDistrict ? '\n       isle ' + Math.round(activeDistrict.x) + ',' +
            Math.round(activeDistrict.z) + '  r ' +
            Math.round(activeDistrict.r * (activeDistrict.dispScale || 1)) +
            '  shot ' + (activeDistrict.shot
              ? Math.round(activeDistrict.shot.x) + ',' + Math.round(activeDistrict.shot.z) +
                ' r' + Math.round(activeDistrict.shot.r) : '-') +
            '  vis ' + (activeDistrict.detail && activeDistrict.detail.visible ? 'detail' : 'mass') +
            ' ' + ((activeDistrict.detail && activeDistrict.detail.children.length) || 0) : '') +
        '\n' +
      'loop   ' + (ATTRACT_OFF ? 'off (?still)'
        : attract.dead ? 'DEAD'
        : attract.on ? ('leg ' + attract.i + ' ' + (ATTRACT[attract.i].id || 'world') + '  next in ' +
            Math.max(0, ((attract.until - performance.now()) / 1000)).toFixed(1) + 's')
        : ('stopped, idle ' + ((performance.now() - attract.lastInput) / 1000).toFixed(0) + 's')) + '\n' +
      (ERR.msg ? 'ERROR  ' + ERR.msg + (ERR.n > 1 ? '  (x' + ERR.n + ')' : '') + '\n' : '') +
      /* ?marks LISTS WHAT THE BAKE ACTUALLY CALLS THINGS.

         marks says reem 0/3 and saad 1/3, which tells us the match failed and nothing else. The
         match is our display label against a key in the baked landmark table, so the fix is a
         PLACE_OSM entry — and writing one without seeing the key is guessing at a proper noun and
         committing it. The names are sitting in index.json, which is already in memory; the only
         reason they were unreadable is that nobody printed them, and there is no console on this
         device to print them to.

         A URL flag rather than a build constant, for the same reason ?drawn and ?still are. */
      (location.search.includes('marks') ? (() => {
        try {
          const idx = window.__basemapIndex;
          if (!idx) return 'names  no basemap index\n';
          let out = '';
          for (const d of DISTRICTS){
            const e = (idx.islands || []).find(i => i.id === d.id);
            const keys = Object.keys((e && e.landmarks) || {});
            const miss = (d.places || []).filter(p => p.baked === false).map(p => p.label);
            out += (out ? '       ' : 'names  ') + d.id + '  bake: ' +
                   (keys.length ? keys.join(', ') : 'none') + '\n';
            if (miss.length) out += '         missed: ' + miss.join(', ') + '\n';
          }
          return out;
        } catch (e){ return 'names  ' + e.message + '\n'; }
      })() : '') +
      'cache  ' + V + '   shadow ' + shadowNote + '\n' +
      // The number to tune against, on the device rather than in an estimate.
      'frame  ' + ftStat;
  }
}
frame();

window.W2H = {
  world: setWorld,
  view: applyView,
  build: [B_NAV, B_CITY, B_WORLD, B_PROPS].join(' / '),
  go: id => { const d = DISTRICTS.find(x => x.id === id); if (d) setDistrict(d); },
  tilt: v => tiltPass.uniforms.amount.value = v,
  DISTRICTS, goal, cur,
};

} catch(e){ fail('module top level', e); }
</script>
</body>
</html>
